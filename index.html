    <title>강학</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
          else { document.documentElement.style.colorScheme = 'light'; }
        } catch (e) {}
      })();
    </script>
    <style>
      /* 강학뉴스 신문 지면은 라이트 테마 고정: 다크모드 토큰 상속으로 글자가 날아가는 문제 방지 */
      .bg-\[\#f5f0e8\] .text-foreground-950 { color:#171717 !important; }
      .bg-\[\#f5f0e8\] .text-foreground-900 { color:#222 !important; }
      .bg-\[\#f5f0e8\] .text-foreground-800 { color:#333 !important; }
      .bg-\[\#f5f0e8\] .text-foreground-700 { color:#444 !important; }

      .bg-\[\#f5f0e8\] .text-foreground-400 { color:#777 !important; }
      .bg-\[\#f5f0e8\] .text-foreground-300 { color:#888 !important; }

      .bg-\[\#f5f0e8\] .border-foreground-900 { border-color:#222 !important; }
      .bg-\[\#f5f0e8\] .border-foreground-300 { border-color:#c8c2b8 !important; }
      .bg-\[\#f5f0e8\] .border-foreground-200 { border-color:#d8d1c7 !important; }
      .bg-\[\#f5f0e8\] .border-foreground-100 { border-color:#e7e0d7 !important; }
      .bg-\[\#f5f0e8\] .bg-foreground-950 { background-color:#171717 !important; }
      .bg-\[\#f5f0e8\] .text-background-50 { color:#fff !important; }
      .bg-\[\#f5f0e8\] .bg-foreground-200 { background-color:#e6dfd5 !important; }
