name: Temporary notification badge patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Navbar notification badges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/feature/Navbar.tsx')
          text = path.read_text()

          if "useNotificationMenuCounts" not in text:
              text = text.replace(
                  "import NotificationsModal, { useNotificationCount, NotificationToast } from '@/components/feature/NotificationsModal';",
                  "import NotificationsModal, { useNotificationCount, NotificationToast } from '@/components/feature/NotificationsModal';\nimport NotificationBadge from '@/components/base/NotificationBadge';\nimport { getNotificationMenuCount, useNotificationMenuCounts } from '@/hooks/useNotificationMenuCounts';"
              )

          text = text.replace(
              "  const notificationCount = useNotificationCount(user);",
              "  const notificationCount = useNotificationCount(user);\n  const notificationMenuCounts = useNotificationMenuCounts(user);\n  const menuCount = (path: string) => getNotificationMenuCount(notificationMenuCounts, path);"
          )

          # Desktop top-level links.
          old = "{TOP_ITEMS.map(item => <Link key={item.path} to={item.path} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium transition-all duration-200 whitespace-nowrap cursor-pointer hover:scale-[1.02] ${isActive(item.path) ? 'bg-primary-100 text-primary-700' : 'text-foreground-600 hover:text-foreground-950 hover:bg-background-100'}`}><i className={`${item.icon} text-xs`}></i>{item.label}</Link>)}"
          new = "{TOP_ITEMS.map(item => <Link key={item.path} to={item.path} className={`relative flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium transition-all duration-200 whitespace-nowrap cursor-pointer hover:scale-[1.02] ${isActive(item.path) ? 'bg-primary-100 text-primary-700' : 'text-foreground-600 hover:text-foreground-950 hover:bg-background-100'}`}><i className={`${item.icon} text-xs`}></i>{item.label}<NotificationBadge count={menuCount(item.path)} /></Link>)}"
          text = text.replace(old, new)

          # Desktop category buttons: show the aggregate unread count on the menu itself.
          replacements = {
              ">말씀 도구<i className={`ri-arrow-down-s-line": ">말씀 도구<NotificationBadge count={BIBLE_CATEGORY.items.reduce((n, item) => n + menuCount(item.path), 0)} /><i className={`ri-arrow-down-s-line",
              ">소통·공동체<i className={`ri-arrow-down-s-line": ">소통·공동체<NotificationBadge count={COMMUNITY_CATEGORY.items.reduce((n, item) => n + menuCount(item.path), 0)} /><i className={`ri-arrow-down-s-line",
              ">갓겜<i className={`ri-arrow-down-s-line": ">갓겜<NotificationBadge count={GAME_CATEGORY.items.reduce((n, item) => n + menuCount(item.path), 0)} /><i className={`ri-arrow-down-s-line",
              ">신앙(비공개)<i className={`ri-arrow-down-s-line": ">신앙(비공개)<NotificationBadge count={FAITH_CATEGORY.items.reduce((n, item) => n + menuCount(item.path), 0)} /><i className={`ri-arrow-down-s-line",
              ">사명자<i className={`ri-arrow-down-s-line": ">사명자<NotificationBadge count={fullMissionItems.reduce((n, item) => n + (item.path ? menuCount(item.path) : 0), 0)} /><i className={`ri-arrow-down-s-line",
          }
          for a, b in replacements.items():
              text = text.replace(a, b)

          # Mobile top-level cards.
          old = "className={`flex flex-col items-center gap-1.5 p-3 rounded-2xl transition-colors cursor-pointer ${isActive(item.path) ? 'bg-background-100 shadow-card text-primary-700' : 'text-foreground-600 hover:bg-background-100/60'}`}><div className={`w-10 h-10 rounded-full flex items-center justify-center ${isActive(item.path) ? 'insta-gradient-bg' : 'bg-background-100'}`}><i className={`${item.icon} text-lg ${isActive(item.path) ? 'text-white' : 'text-foreground-500'}`}></i></div><span className=\"text-[11px] font-medium whitespace-nowrap\">{item.label}</span></MotionLink>)"
          new = "className={`relative flex flex-col items-center gap-1.5 p-3 rounded-2xl transition-colors cursor-pointer ${isActive(item.path) ? 'bg-background-100 shadow-card text-primary-700' : 'text-foreground-600 hover:bg-background-100/60'}`}><div className={`w-10 h-10 rounded-full flex items-center justify-center ${isActive(item.path) ? 'insta-gradient-bg' : 'bg-background-100'}`}><i className={`${item.icon} text-lg ${isActive(item.path) ? 'text-white' : 'text-foreground-500'}`}></i></div><span className=\"text-[11px] font-medium whitespace-nowrap\">{item.label}</span><NotificationBadge count={menuCount(item.path)} /></MotionLink>)"
          text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Type check and lint
        run: |
          npm install --no-package-lock
          npm run type-check
          npm run lint

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/Navbar.tsx src/components/base/NotificationBadge.tsx .github/workflows/temporary-notification-badges.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: show unread badges on navigation menus"
          git push
