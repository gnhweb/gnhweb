name: Force fresh Bible MBTI client bundle

on:
  push:
    paths:
      - .github/workflows/force-bible-mbti-bundle-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add build revision marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.tsx')
          text = path.read_text(encoding='utf-8')
          marker = "const GNHWEB_BUNDLE_REVISION = '20260908-bible-mbti-art-1';\nvoid GNHWEB_BUNDLE_REVISION;\n\n"
          if 'GNHWEB_BUNDLE_REVISION' not in text:
              text = text.replace("import App from './App.tsx'\n", "import App from './App.tsx'\n\n" + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/force-bible-mbti-bundle-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx .github/workflows/force-bible-mbti-bundle-refresh.yml
          git commit -m 'force fresh client bundle for Bible MBTI artwork fix'
          git push origin main
