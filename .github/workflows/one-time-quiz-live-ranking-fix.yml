name: One-time quiz live ranking fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: make quiz ranking realtime') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch home realtime listener
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/home/page.tsx')
          text = path.read_text()
          old = """    const quizChannel = supabase\n      .channel('home-quiz-champion-rt')\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'quiz_scores' }, () => loadQuizChampion(true))\n      .subscribe();"""
          new = """    const quizChannel = supabase\n      .channel('home-quiz-champion-rt')\n      .on('broadcast', { event: 'quiz_score_changed' }, () => loadQuizChampion(true))\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'quiz_scores' }, () => loadQuizChampion(true))\n      .subscribe();"""
          if old not in text:
              raise SystemExit('Expected quiz realtime listener was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/home/page.tsx
          git commit -m "fix: make quiz ranking realtime"
          git push origin main
