name: One-time Pharisee Interrogation Feature
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply interrogation feature
        run: python .github/scripts/add_pharisee_interrogation.py
      - name: Remove one-time migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/pharisee/GameView.tsx .github/workflows/one-time-pharisee-interrogation.yml .github/scripts/add_pharisee_interrogation.py
          git rm -f .github/workflows/one-time-pharisee-interrogation.yml .github/scripts/add_pharisee_interrogation.py
          git commit -m "feat: add public interrogation mechanic to Pharisee"
          git push
