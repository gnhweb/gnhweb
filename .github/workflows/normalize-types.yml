name: Normalize legacy TypeScript

on:
  push:
    branches:
      - 'main'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply verified Bible MBTI portrait renderer fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/bibleMbtiEnhanced/page.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = r"function FigureIllustration\(\{name,className\}:\{name:Figure;className:string\}\)\{.*?\n\}"
          replacement = '''function FigureIllustration({name,className}:{name:Figure;className:string}){
 const index = figureOrder.indexOf(name);
 const column = index % 5;
 const row = Math.floor(index / 5);
 return <div role="img" aria-label={`${name} 성경인물 프로필`} className={`bg-no-repeat ${className}`} style={{backgroundImage:'url(/bible-mbti/figure-portraits.webp)',backgroundPosition:`${column * 25}% ${row * (100 / 3)}%`,backgroundSize:'500% 400%'}}/>;
}'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count == 1:
              s2 = s2.replace("import { figureImagePaths } from './figureImages';\n", '', 1)
              p.write_text(s2, encoding='utf-8')
          PY
          node scripts/normalize-legacy-types.mjs
          node scripts/dedupe-passkey-auth.mjs

      - name: Commit normalized source when changed
        run: |
          if git diff --quiet; then
            echo "No normalization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git commit -m "fix: render Bible MBTI portraits from existing sprite"
          git push origin HEAD:${GITHUB_REF_NAME}
