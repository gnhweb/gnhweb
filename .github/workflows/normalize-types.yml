name: Normalize legacy TypeScript

on:
  push:
    branches:
      - 'fix/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and order attendance board sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/pages/attendanceBoard/page.tsx')
          text = subprocess.check_output(['git', 'show', 'e1e9d8caed1de4222ba6f3762f29e67f8e1a32a7:src/pages/attendanceBoard/page.tsx'], text=True)
          lines = text.splitlines(keepends=True)
          card_prefix = '            <div className="bg-background-100 border border-background-200 rounded-2xl p-5'

          def card_for(heading):
              heading_idx = next(i for i, line in enumerate(lines) if heading in line)
              start = heading_idx - 1
              while start >= 0 and not lines[start].startswith(card_prefix):
                  start -= 1
              if start < 0:
                  raise SystemExit(f'Could not locate card start: {heading}')
              end = start + 1
              while end < len(lines) and not lines[end].startswith(card_prefix) and not lines[end].strip().startswith('</>'):
                  end += 1
              return start, end, lines[start:end]

          absent_start, absent_end, absent_block = card_for('불참 신고 ({absentCount}명)')
          unresponsive_start, unresponsive_end, unresponsive_block = card_for('미응답 ({unresponsiveCount}명)')

          if absent_start > unresponsive_start:
              lines = lines[:unresponsive_start] + absent_block + lines[unresponsive_end:absent_start] + unresponsive_block + lines[absent_end:]
              path.write_text(''.join(lines), encoding='utf-8')
              print('Reordered: attended -> late -> absent -> unresponsive')
          else:
              path.write_text(text, encoding='utf-8')
              print('Already ordered: absent before unresponsive')
          PY

      - name: Commit attendance source when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/attendanceBoard/page.tsx
          if git diff --cached --quiet; then
            echo "No attendance ordering changes needed."
            exit 0
          fi
          git commit -m "fix: order attendance board status sections"
          git push origin HEAD:${GITHUB_REF_NAME}