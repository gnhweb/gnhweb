name: Normalize legacy TypeScript

on:
  push:
    branches:
      - 'fix/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and order attendance board sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/pages/attendanceBoard/page.tsx')
          parent = subprocess.check_output(['git', 'show', 'HEAD^:src/pages/attendanceBoard/page.tsx'], text=True)
          text = parent

          def block_for(source, heading):
              heading_pos = source.find(heading)
              if heading_pos < 0:
                  raise SystemExit(f'Could not locate heading: {heading}')
              start = source.rfind('\n            <div className="bg-background-100 border border-background-200 rounded-2xl p-5', 0, heading_pos)
              if start < 0:
                  raise SystemExit(f'Could not locate card start: {heading}')
              end = source.find('\n            <div className="bg-background-100 border border-background-200 rounded-2xl p-5', heading_pos + len(heading))
              if end < 0:
                  end = len(source)
              return start, end, source[start:end]

          absent_start, absent_end, absent_block = block_for(text, '불참 신고 ({absentCount}명)')
          unresponsive_start, unresponsive_end, unresponsive_block = block_for(text, '미응답 ({unresponsiveCount}명)')

          if absent_start > unresponsive_start:
              text = text[:unresponsive_start] + absent_block + unresponsive_block + text[absent_end:]
              print('Reordered: attended -> late -> absent -> unresponsive')
          else:
              print('Already ordered: absent before unresponsive')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit attendance source when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/attendanceBoard/page.tsx
          if git diff --cached --quiet; then
            echo "No attendance ordering changes needed."
            exit 0
          fi
          git commit -m "fix: order attendance board status sections"
          git push origin HEAD:${GITHUB_REF_NAME}