name: One-time remove Pharisee voice and public interrogation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove features
        run: python .github/scripts/remove_pharisee_voice_interrogation.py
      - name: Remove voice component and one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f src/games/pharisee/VoiceChat.tsx .github/workflows/one-time-remove-pharisee-voice-interrogation.yml .github/scripts/remove_pharisee_voice_interrogation.py
          git add src/games/pharisee/GameView.tsx
          git commit -m "chore: remove Pharisee voice chat and public interrogation"
          git push
