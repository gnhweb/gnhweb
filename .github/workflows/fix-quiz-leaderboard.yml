name: Apply quiz leaderboard realtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-quiz-leaderboard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch leaderboard realtime refresh and score save
        shell: python
        run: |
          from pathlib import Path

          leaderboard = Path('src/pages/bibleQuiz/components/LeaderboardModal.tsx')
          text = leaderboard.read_text(encoding='utf-8')
          old = """  useEffect(() => {\n    if (isOpen) {\n      fetchLeaderboard();\n    }\n  }, [isOpen, fetchLeaderboard]);\n"""
          new = """  useEffect(() => {\n    if (isOpen) {\n      fetchLeaderboard();\n    }\n  }, [isOpen, fetchLeaderboard]);\n\n  useEffect(() => {\n    if (!isOpen) return;\n\n    const channel = supabase\n      .channel('bible-quiz-leaderboard-rt')\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'quiz_scores' }, () => {\n        void fetchLeaderboard();\n      })\n      .subscribe();\n\n    return () => {\n      void supabase.removeChannel(channel);\n    };\n  }, [isOpen, fetchLeaderboard]);\n"""
          if old not in text:
              raise SystemExit('LeaderboardModal anchor not found')
          if "bible-quiz-leaderboard-rt" not in text:
              text = text.replace(old, new, 1)
          leaderboard.write_text(text, encoding='utf-8')

          page = Path('src/pages/bibleQuiz/page.tsx')
          text = page.read_text(encoding='utf-8')
          old = """        supabase.functions.invoke('quiz-leaderboard', {\n          method: 'POST',\n          body: {\n            user_id: user.id,\n            nickname: profile.name || '익명',\n            club_name: clubName,\n            score: finalScore,\n            total_questions: questions.length,\n            correct_count: finalCorrectCount,\n            difficulty,\n          },\n        }).then(({ data: result, error: saveError }) => {\n          if (saveError) {\n            console.error('[BibleQuiz] score save failed:', saveError);\n            return;\n          }\n          if (result?.cumulative) {\n            setCumulativeStats(result.cumulative as CumulativeStats);\n          }\n        }).finally(() => setSavingScore(false));\n"""
          new = """        const { data: result, error: saveError } = await supabase.functions.invoke('quiz-leaderboard', {\n          method: 'POST',\n          body: {\n            user_id: user.id,\n            nickname: profile.name || '익명',\n            club_name: clubName,\n            score: finalScore,\n            total_questions: questions.length,\n            correct_count: finalCorrectCount,\n            difficulty,\n          },\n        });\n\n        if (saveError) {\n          console.error('[BibleQuiz] score save failed:', saveError);\n          setError('퀴즈 기록을 저장하지 못했어요. 잠시 후 다시 확인해주세요.');\n        } else if (result?.cumulative) {\n          setCumulativeStats(result.cumulative as CumulativeStats);\n        }\n        setSavingScore(false);\n"""
          if old not in text:
              raise SystemExit('BibleQuiz score-save anchor not found')
          if "const { data: result, error: saveError } = await supabase.functions.invoke('quiz-leaderboard'" not in text:
              text = text.replace(old, new, 1)
          page.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/bibleQuiz/page.tsx src/pages/bibleQuiz/components/LeaderboardModal.tsx
          git commit -m "fix(quiz): save scores before result and refresh leaderboard"
          git push
