name: one-time coaching completeness fix v2
on:
  push:
    paths:
      - .github/workflows/one-time-coaching-completeness-fix-v2.yml
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'one-time coaching completeness fix v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch coaching flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('workers/ai-gateway/src/coachingFeature.ts')
          s = p.read_text()
          old_sig = '''async function requestGateway(\n  messages: Array<{ role: "system" | "user"; content: string }>,\n  maxTokens = 3000,\n) {'''
          new_sig = '''async function requestGateway(\n  messages: Array<{ role: "system" | "user"; content: string }>,\n  _env: Record<string, string | undefined>,\n  maxTokens = 3000,\n) {'''
          assert s.count(old_sig) == 1, 'requestGateway signature mismatch'
          s = s.replace(old_sig, new_sig)
          marker = 'export async function handleNimCoaching(req: Request, env: Record<string, string | undefined>) {'
          helper = '''function isCompleteCoachingDraft(content: string | null): boolean {\n  if (!content) return false;\n  const clean = content.trim();\n  if (clean.length < 120) return false;\n  if (/(^|\\n)```[^\\n]*$/.test(clean)) return false;\n  if (/[：:]$|[-*|]$|[([{]$/.test(clean)) return false;\n  if (/\\b(시작|예를 들어|다음과 같이|먼저)\\s*[:：]$/.test(clean)) return false;\n  return /[.!?。！？다요죠습니다함]$/.test(clean);\n}\n\n'''
          assert s.count(marker) == 1, 'handleNimCoaching marker mismatch'
          if 'function isCompleteCoachingDraft' not in s:
              s = s.replace(marker, helper + marker)
          s, n1 = re.subn(r'    const finalDraft = await requestGateway\\(', '    let finalDraft = await requestGateway(', s, count=1)
          assert n1 == 1, 'finalDraft declaration mismatch'
          old_return = '    if (finalDraft) return json({ advice: finalDraft });'
          new_return = '''    if (finalDraft && !isCompleteCoachingDraft(finalDraft)) {\n      finalDraft = await requestGateway([\n        ...finalMessages,\n        {\n          role: "user",\n          content: `방금 답변은 중간에서 끝난 것으로 판단된다. 핵심 판단과 실행 방법을 유지하되, 미완성된 목록·문장·대화 예시를 끝까지 완결하고 마지막에 자연스러운 문장으로 마무리해라. 완성된 답변만 다시 출력해라.`,\n        },\n      ], env, 3200);\n    }\n\n    if (finalDraft && isCompleteCoachingDraft(finalDraft)) return json({ advice: finalDraft });'''
          assert s.count(old_return) == 1, 'final return mismatch'
          s = s.replace(old_return, new_return)
          p.write_text(s)
          PY
          git diff --check
          npm ci
          npm run type-check
          npx wrangler deploy --dry-run --config workers/ai-gateway/wrangler.jsonc
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/ai-gateway/src/coachingFeature.ts
          git commit -m 'fix: complete truncated coaching answers'
          git push
