name: Harden worship insights data

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch worship data handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/feature/WorshipAttendanceInsights.tsx')
          text = path.read_text()
          text = text.replace("  late_reason: string | null;\n", "")
          text = text.replace(".select('user_id, status, attendance_date, absence_reason, late_reason')", ".select('user_id, status, attendance_date, absence_reason')")
          text = text.replace("rate: total > 0 ? Math.round(((attended + late) / total) * 100) : null,", "rate: total > 0 && dateRecords.length > 0 ? Math.round(((attended + late) / total) * 100) : null,")
          old = """  const currentMonthRate = useMemo(() => {\n    if (members.length === 0 || currentMonthServices.length === 0) return null;\n    const attendedSlots = currentMonthServices.reduce((sum, service) => sum + service.attended + service.late, 0);\n    return Math.round((attendedSlots / (members.length * currentMonthServices.length)) * 100);\n  }, [currentMonthServices, members.length]);"""
          new = """  const currentMonthRate = useMemo(() => {\n    const measuredServices = currentMonthServices.filter((service) => service.rate !== null);\n    if (members.length === 0 || measuredServices.length === 0) return null;\n    const attendedSlots = measuredServices.reduce((sum, service) => sum + service.attended + service.late, 0);\n    return Math.round((attendedSlots / (members.length * measuredServices.length)) * 100);\n  }, [currentMonthServices, members.length]);"""
          if old not in text: raise SystemExit('currentMonthRate marker not found')
          text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/WorshipAttendanceInsights.tsx
          git commit -m "fix: avoid false zero worship attendance rates"
          git rm .github/workflows/harden-worship-insights-data.yml
          git commit -m "chore: remove temporary worship insights workflow"
          git push origin main
