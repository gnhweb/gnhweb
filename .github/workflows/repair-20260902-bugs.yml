name: requested bug repairs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip repair 20260902-bugs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply grounded repairs
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text missing in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Bible Pick: for authenticated users, persist to DB before showing the result.
          replace_once(
              'src/pages/biblePick/page.tsx',
              """    if (error) {\n      console.error('Failed to save bible pick:', error);\n      // DB 저장이 실패해도 기록 자체가 사라지지 않도록 로컬에라도 남겨둡니다.\n      saveToLocalHistory(record);\n      return false;\n    }""",
              """    if (error) {\n      console.error('Failed to save bible pick:', error);\n      return false;\n    }"""
          )
          replace_once(
              'src/pages/biblePick/page.tsx',
              """      const verse = await fetchVerseFromAI(userText.trim());\n      setVerseData(verse);\n      setIsSubmitted(true);\n      const saved = await savePick(verse, userText.trim(), user?.id);\n      if (!saved) {\n        setError('말씀은 준비됐지만 히스토리 저장에는 실패했어요. 나의 히스토리에서 보이지 않는다면 다시 시도해주세요.');\n      }""",
              """      const verse = await fetchVerseFromAI(userText.trim());\n      const saved = await savePick(verse, userText.trim(), user?.id);\n      if (!saved) {\n        throw new Error('말씀은 준비됐지만 히스토리 저장에 실패했어요. 잠시 후 다시 시도해주세요.');\n      }\n      setVerseData(verse);\n      setIsSubmitted(true);"""
          )

          # Anonymous suggestion display must never fall back to a stored author name.
          replace_once(
              'src/pages/suggestions/page.tsx',
              "{item.is_anonymous && !isMySuggestion ? '익명' : item.author_name}",
              "{item.is_anonymous ? '익명' : (item.author_name || '작성자')}"
          )

          # Lock duration choices: exactly the requested five options. The previous repair
          # left a duplicate 1-minute option in the current profile page.
          replace_once(
              'src/pages/profile/page.tsx',
              """                  <option value={1}>1분</option>\n                  <option value={1}>1분</option>\n                  <option value={5}>5분</option>\n                  <option value={30}>30분</option>\n                  <option value={60}>1시간</option>\n                  <option value={300}>5시간</option>""",
              """                  <option value={1}>1분</option>\n                  <option value={5}>5분</option>\n                  <option value={30}>30분</option>\n                  <option value={60}>1시간</option>\n                  <option value={300}>5시간</option>"""
          )

          # Meeting AI: NVIDIA is the known existing provider for this task. Put it first
          # so a missing/retired fallback provider cannot consume the request timeout before
          # the provider used by the existing meeting functions is attempted.
          replace_once(
              'supabase/functions/ai-gateway/index.ts',
              '  학생회: ["deepseek", "groq", "mistral", "openrouter", "nvidia", "gemini", "xai", "sambanova", "cohere", "modelscope"],',
              '  학생회: ["nvidia", "deepseek", "groq", "mistral", "openrouter", "gemini", "xai", "sambanova", "cohere", "modelscope"],'
          )

          # Keep the repository schema in sync with the live DB hardening already applied:
          # anonymous submissions need a nullable display-name column because the BEFORE
          # trigger intentionally clears the name.
          migration = Path('supabase/migrations/20260902213000_allow_anonymous_suggestion_author_name.sql')
          if not migration.exists():
              migration.write_text(
                  """-- Anonymous suggestions intentionally have no display name.\nalter table public.suggestions alter column author_name drop not null;\nupdate public.suggestions set author_name = null where is_anonymous = true;\nnotify pgrst, 'reload schema';\n""",
                  encoding='utf-8'
              )

          # The workflow is one-shot; do not leave repair machinery in production.
          workflow = Path('.github/workflows/repair-20260902-bugs.yml')
          workflow.unlink()

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: complete requested web bug repairs [skip repair 20260902-bugs]'
          git push
