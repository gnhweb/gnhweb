name: One-time fix weekly report delete policy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'fix: enable weekly report deletion')
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Apply weekly report delete policy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEON_DATABASE_URL:-}"

          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          drop policy if exists "weekly_reports_delete_author_or_teacher_chief" on public.weekly_reports;

          create policy "weekly_reports_delete_author_or_teacher_chief"
          on public.weekly_reports
          for delete
          to authenticated
          using (
            author_id = (select auth.uid())
            or has_any_active_role(array['teacher'::text, 'chief'::text])
          );
          SQL

          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            select policyname, cmd
            from pg_policies
            where schemaname = 'public'
              and tablename = 'weekly_reports'
              and policyname = 'weekly_reports_delete_author_or_teacher_chief';
          "
