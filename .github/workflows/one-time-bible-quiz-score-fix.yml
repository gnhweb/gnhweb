name: One-time Bible Quiz Score Fix

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'fix: bible quiz exact scoring' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch score logic only
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/bibleQuiz/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''    if (correct) {\n      const pts = q.points || 20;\n      const streakBonus = Math.min(streak, 5) * 2;\n      const timeBonus = Math.max(0, Math.round(timer * 0.5));\n      const finalPts = pts + streakBonus + timeBonus;\n      setScore(prev => prev + finalPts);\n      setTotalPoints(prev => prev + finalPts);\n'''
          new = '''    if (correct) {\n      const pointsByDifficulty: Record<Difficulty, number> = { easy: 20, normal: 50, hard: 80 };\n      const pts = pointsByDifficulty[difficulty];\n      setScore(prev => prev + pts);\n      setTotalPoints(prev => prev + pts);\n'''
          if old not in s:
              raise SystemExit('expected score block not found')
          s = s.replace(old, new, 1)
          s = s.replace("<span className=\"text-xs font-bold text-amber-600 dark:text-amber-300 ml-1\">🔥 연속 {streak}정답 보너스!</span>", "", 1)
          s = s.replace("<motion.div initial={{ opacity: 0, y: -10 }} animate={{ opacity: 1, y: 0 }} className=\"mb-3 text-center\"><span className=\"inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-rose-100 text-rose-700 text-xs font-bold\"><i className=\"ri-vip-crown-line\"></i> 보스 라운드! 보너스 점수 2배!</span></motion.div>", "", 1)
          s = s.replace("{isCorrect ? `정답! (+${questions[currentQ]?.points || 20}점)` : '틀렸어요'}", "{isCorrect ? `정답! (+${scorePerQ}점)` : '틀렸어요'}", 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/bibleQuiz/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: bible quiz exact scoring'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-bible-quiz-score-fix.yml
          git commit -m 'chore: remove one-time bible quiz fixer'
          git push
