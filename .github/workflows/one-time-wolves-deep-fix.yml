name: One-time wolves deep multiplayer fix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/one-time-wolves-deep-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch wolves multiplayer security and race conditions
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/games/wolves-and-sheep/GameManger.ts')
          s = p.read_text()

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'patch target not found: {label}')
              s = s.replace(old, new, 1)

          rep(
              '  private pendingTimeouts = new Set<ReturnType<typeof setTimeout>>();\n  private lastRoleAssignment: Record<string, Role> | null = null;\n  private returnToLobbyInFlight = false;\n',
              '  private pendingTimeouts = new Set<ReturnType<typeof setTimeout>>();\n  private lastRoleAssignment: Record<string, Role> | null = null;\n  private returnToLobbyInFlight = false;\n  private roleChannel: RealtimeChannel | null = null;\n  private hostId: string | null = null;\n  private gameNonce = "";\n  private revealedRoles: Record<string, Role> = {};\n  private processedBlackoutPresses = new Set<string>();\n  private activeSabotageKind: "blackout" | "reactor" | "door" | "candle" | "pipe" | null = null;\n  private activeMeetingId: string | null = null;\n',
              'add multiplayer state fields'
          )

          rep(
              '    this.bind();\n    this.bindVisibility();\n',
              '    this.bind();\n    this.bindRoleChannel();\n    this.bindVisibility();\n',
              'bind role channel'
          )

          rep(
              '  get isHost(): boolean {\n    if (this.presenceOrder.length === 0) return false;\n    return this.presenceOrder[0].id === this.userId;\n  }\n',
              '  get isHost(): boolean {\n    if (this.hostId) return this.hostId === this.userId;\n    return this.presenceOrder.length > 0 && this.presenceOrder[0].id === this.userId;\n  }\n\n  private bindRoleChannel() {\n    this.roleChannel = supabase.channel(`wolves-role-${this.roomCode}-${this.userId}`, { config: { broadcast: { self: false } } });\n    this.roleChannel\n      .on("broadcast", { event: "role" }, ({ payload }) => this.applyPrivateRole(payload))\n      .on("broadcast", { event: "investigation_result" }, ({ payload }) => {\n        if (payload?.requesterId === this.userId) {\n          this.investigationResult = payload.result ?? null;\n          this.emit("ability-update");\n        }\n      })\n      .subscribe();\n  }\n\n  private applyPrivateRole(payload: { role?: Role; gameNonce?: string }) {\n    if (!payload?.role || (payload.gameNonce && this.gameNonce && payload.gameNonce !== this.gameNonce)) return;\n    this.myRole = payload.role;\n    const me = this.players.get(this.userId);\n    if (me) me.role = payload.role;\n    this.emit("role-update", payload.role);\n  }\n\n  private sendPrivateRoles(roles: Record<string, Role>) {\n    const nonce = this.gameNonce;\n    Object.entries(roles).forEach(([id, role]) => {\n      if (id === this.userId) {\n        this.applyPrivateRole({ role, gameNonce: nonce });\n        return;\n      }\n      const channelName = `wolves-role-${this.roomCode}-${id}`;\n      const send = () => {\n        const ch = supabase.channel(channelName);\n        ch.send({ type: "broadcast", event: "role", payload: { role, gameNonce: nonce } }).finally(() => {\n          setTimeout(() => supabase.removeChannel(ch), 300);\n        });\n      };\n      send();\n      this.scheduleTimeout(send, 600);\n      this.scheduleTimeout(send, 1400);\n    });\n  }\n',
              'private role delivery'
          )

          rep(
              '    supabase.removeChannel(this.channel);\n',
              '    if (this.roleChannel) {\n      supabase.removeChannel(this.roleChannel);\n      this.roleChannel = null;\n    }\n    supabase.removeChannel(this.channel);\n',
              'destroy role channel'
          )

          rep(
              '    order.sort((a, b) => a.joinedAt - b.joinedAt);\n    this.presenceOrder = order;\n',
              '    order.sort((a, b) => a.joinedAt - b.joinedAt);\n    this.presenceOrder = order;\n    if (!this.hostId || !order.some((p) => p.id === this.hostId)) this.hostId = order[0]?.id ?? null;\n',
              'stable host election'
          )

          rep(
              '    if (this.isHost && this.phase === "lobby") {\n      this.channel.send({ type: "broadcast", event: "settings_update", payload: this.settings });\n    }\n',
              '    if (this.isHost) {\n      this.channel.send({ type: "broadcast", event: "host_announce", payload: { hostId: this.hostId } });\n    }\n    if (this.isHost && this.phase === "lobby") {\n      this.channel.send({ type: "broadcast", event: "settings_update", payload: this.settings });\n    }\n',
              'announce stable host'
          )

          rep(
              '      .on("broadcast", { event: "settings_update" }, ({ payload }) => this.applySettingsUpdate(payload))\n',
              '      .on("broadcast", { event: "settings_update" }, ({ payload }) => this.applySettingsUpdate(payload))\n      .on("broadcast", { event: "host_announce" }, ({ payload }) => { if (payload?.hostId) this.hostId = payload.hostId; })\n',
              'host announce listener'
          )

          rep(
              '    const payload = {\n      roles,\n      spawns,\n',
              '    this.gameNonce = `${Date.now()}-${Math.random().toString(36).slice(2)}`;\n    const payload = {\n      playerIds: ids,\n      roles,\n      spawns,\n      gameNonce: this.gameNonce,\n',
              'game nonce and ids'
          )

          rep(
              '    this.applyGameStart(payload);\n    this.channel.send({ type: "broadcast", event: "game_start", payload });\n',
              '    this.applyGameStart(payload);\n    const publicPayload = { ...payload, roles: undefined };\n    this.channel.send({ type: "broadcast", event: "game_start", payload: publicPayload });\n    this.sendPrivateRoles(roles);\n',
              'public game start without roles'
          )

          rep(
              '  private applyGameStart(payload: {\n    roles: Record<string, Role>;\n',
              '  private applyGameStart(payload: {\n    roles?: Record<string, Role>;\n    playerIds?: string[];\n',
              'game start optional roles'
          )

          rep(
              '    settings?: GameSettings;\n    taskAssignments?: Record<string, string[]>;\n  }) {\n',
              '    settings?: GameSettings;\n    taskAssignments?: Record<string, string[]>;\n    gameNonce?: string;\n  }) {\n',
              'game nonce type'
          )

          rep(
              '    if (payload.settings) this.settings = { ...DEFAULT_GAME_SETTINGS, ...payload.settings };\n    this.players.clear();\n    Object.entries(payload.roles).forEach(([id, role]) => {\n',
              '    if (payload.settings) this.settings = { ...DEFAULT_GAME_SETTINGS, ...payload.settings };\n    this.gameNonce = payload.gameNonce ?? this.gameNonce;\n    const ids = payload.playerIds ?? Object.keys(payload.roles ?? {});\n    const roles = payload.roles ?? {};\n    this.players.clear();\n    ids.forEach((id) => {\n      const role = roles[id] ?? (id === this.userId ? this.myRole : "sheep");\n',
              'apply public game start'
          )

          rep(
              '    this.myRole = payload.roles[this.userId] ?? "sheep";\n',
              '    if (payload.roles?.[this.userId]) this.myRole = payload.roles[this.userId];\n',
              'preserve private role'
          )

          rep(
              '    this.players = new Map(Object.entries(payload.players));\n',
              '    const currentMyRole = this.myRole;\n    const publicPlayers = Object.fromEntries(Object.entries(payload.players).map(([id, p]) => [id, { ...p, role: this.revealedRoles[id] ?? "sheep" }]));\n    this.players = new Map(Object.entries(publicPlayers));\n    const myPlayer = this.players.get(this.userId);\n    if (myPlayer) myPlayer.role = currentMyRole;\n',
              'sanitize state sync roles'
          )

          rep(
              '      players: Object.fromEntries(this.players),\n',
              '      players: Object.fromEntries([...this.players.entries()].map(([id, p]) => [id, { ...p, role: this.revealedRoles[id] ?? "sheep" }])),\n',
              'sanitize serialized roles'
          )

          rep(
              '      .on("broadcast", { event: "meeting_start" }, ({ payload }) => this.applyMeetingStart(payload))\n',
              '      .on("broadcast", { event: "meeting_start" }, ({ payload }) => this.applyMeetingStart(payload))\n',
              'noop keep anchor'
          )

          # Blackout progress dedupe
          rep(
              '    this.applyBlackoutProgress();\n    this.channel.send({ type: "broadcast", event: "blackout_progress", payload: {} });\n',
              '    const pressId = `${this.userId}-${Date.now()}-${Math.random().toString(36).slice(2)}`;\n    this.applyBlackoutProgress({ pressId });\n    this.channel.send({ type: "broadcast", event: "blackout_progress", payload: { pressId } });\n',
              'blackout press id'
          )

          rep(
              '  private applyBlackoutProgress() {\n    if (!this.blackoutActive) return;\n    this.blackoutProgress += 1;\n',
              '  private applyBlackoutProgress(payload: { pressId?: string } = {}) {\n    if (!this.blackoutActive) return;\n    if (payload.pressId) {\n      if (this.processedBlackoutPresses.has(payload.pressId)) return;\n      this.processedBlackoutPresses.add(payload.pressId);\n    }\n    this.blackoutProgress += 1;\n',
              'blackout dedupe'
          )

          # Single active sabotage guard
          rep(
              '  canSabotage(now: number) {\n    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.blackoutActive;\n  }\n',
              '  private hasActiveSabotage() { return this.activeSabotageKind !== null; }\n\n  canSabotage(now: number) {\n    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.hasActiveSabotage();\n  }\n',
              'single sabotage guard'
          )
          rep('    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.reactorActive;', '    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.hasActiveSabotage();', 'reactor guard')
          rep('    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.doorLockRoomId;', '    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.hasActiveSabotage();', 'door guard')
          rep('    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.candleActive;', '    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.hasActiveSabotage();', 'candle guard')
          rep('    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.pipeActive;', '    return this.isWolfSide && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.hasActiveSabotage();', 'pipe guard')

          # Gate trigger functions too, preventing race from direct concurrent calls.
          rep('  triggerBlackout() {\n', '  triggerBlackout() {\n    if (!this.canSabotage(Date.now())) return;\n    this.activeSabotageKind = "blackout";\n', 'blackout trigger guard')
          rep('  triggerReactorSabotage() {\n', '  triggerReactorSabotage() {\n    if (!this.canReactorSabotage(Date.now())) return;\n    this.activeSabotageKind = "reactor";\n', 'reactor trigger guard')
          rep('  triggerDoorLock(roomId: string) {\n', '  triggerDoorLock(roomId: string) {\n    if (!this.canDoorSabotage(Date.now())) return;\n    this.activeSabotageKind = "door";\n', 'door trigger guard')
          rep('  triggerCandleSabotage() {\n', '  triggerCandleSabotage() {\n    if (!this.canCandleSabotage(Date.now())) return;\n    this.activeSabotageKind = "candle";\n', 'candle trigger guard')
          rep('  triggerPipeSabotage() {\n', '  triggerPipeSabotage() {\n    if (!this.canPipeSabotage(Date.now())) return;\n    this.activeSabotageKind = "pipe";\n', 'pipe trigger guard')

          # Clear active sabotage whenever any sabotage ends.
          for old, new, label in [
            ('    this.blackoutActive = false;\n    this.sabotageCooldownUntil', '    this.blackoutActive = false;\n    this.activeSabotageKind = null;\n    this.sabotageCooldownUntil', 'blackout end'),
            ('    this.reactorActive = false;\n      this.sabotageCooldownUntil', '    this.reactorActive = false;\n      this.activeSabotageKind = null;\n      this.sabotageCooldownUntil', 'reactor end'),
            ('    this.doorLockRoomId = null;\n    this.sabotageCooldownUntil', '    this.doorLockRoomId = null;\n    this.activeSabotageKind = null;\n    this.sabotageCooldownUntil', 'door end'),
            ('      this.candleActive = false;\n      this.sabotageCooldownUntil', '      this.candleActive = false;\n      this.activeSabotageKind = null;\n      this.sabotageCooldownUntil', 'candle end'),
            ('      this.pipeActive = false;\n      this.sabotageCooldownUntil', '      this.pipeActive = false;\n      this.activeSabotageKind = null;\n      this.sabotageCooldownUntil', 'pipe end'),
          ]:
              if old in s: s = s.replace(old, new, 1)

          # Host-authoritative win check.
          rep(
              '  private checkWin() {\n    if (this.phase === "ended" || this.winner) return;\n',
              '  private checkWin() {\n    if (!this.isHost) return;\n    if (this.phase === "ended" || this.winner) return;\n',
              'host-only win check'
          )

          # Meeting early resolution and final resolution only by host are already guarded, but reveal ejected role.
          rep(
              '    const payload = { ejectedId };\n',
              '    const payload = { ejectedId, role: ejectedId ? this.players.get(ejectedId)?.role ?? null : null };\n',
              'meeting role reveal payload'
          )
          rep(
              '    if (payload.ejectedId) {\n      const p = this.players.get(payload.ejectedId);\n      if (p) p.alive = false;\n    }\n',
              '    if (payload.ejectedId) {\n      const p = this.players.get(payload.ejectedId);\n      if (p) { p.alive = false; if (payload.role) { p.role = payload.role; this.revealedRoles[payload.ejectedId] = payload.role; } }\n    }\n',
              'apply ejection role reveal'
          )

          # End-game roles are revealed only after the match ends.
          rep(
              '      this.applyGameEnd(payload);\n      if (this.isHost) this.channel.send({ type: "broadcast", event: "game_end", payload });\n',
              '      this.applyGameEnd({ ...payload, roles: Object.fromEntries([...this.players.entries()].map(([id, p]) => [id, p.role])) });\n      if (this.isHost) this.channel.send({ type: "broadcast", event: "game_end", payload: { ...payload, roles: Object.fromEntries([...this.players.entries()].map(([id, p]) => [id, p.role])) } });\n',
              'checkwin role reveal'
          )

          # Update game_end payload type and application for role reveal.
          rep(
              '  private applyGameEnd(payload: { winner: "sheep" | "wolf" }) {\n',
              '  private applyGameEnd(payload: { winner: "sheep" | "wolf"; roles?: Record<string, Role> }) {\n',
              'game end roles type'
          )
          rep(
              '    this.winner = payload.winner;\n    this.phase = "ended";\n',
              '    this.winner = payload.winner;\n    if (payload.roles) {\n      this.revealedRoles = payload.roles;\n      Object.entries(payload.roles).forEach(([id, role]) => { const p = this.players.get(id); if (p) p.role = role; });\n    }\n    this.phase = "ended";\n',
              'apply game end roles'
          )

          # Reconnect: host should resend private role to each player after state sync.
          rep(
              '    if (this.isHost && this.phase !== "lobby") {\n      this.channel.send({ type: "broadcast", event: "state_sync", payload: this.serializeState() });\n    }\n',
              '    if (this.isHost && this.phase !== "lobby") {\n      this.channel.send({ type: "broadcast", event: "state_sync", payload: this.serializeState() });\n      this.sendPrivateRoles(Object.fromEntries([...this.players.entries()].map(([id, p]) => [id, p.role])));\n    }\n',
              'reconnect role resend'
          )

          # Keep state-sync recipient from losing its private role.
          rep(
              '    this.myRole = this.players.get(this.userId)?.role ?? "sheep";\n',
              '    this.myRole = this.myRole || this.players.get(this.userId)?.role || "sheep";\n',
              'preserve private role on sync'
          )

          # reset sabotage dedupe on round/game transitions
          rep(
              '    this.blackoutActive = false;\n    this.blackoutEndsAt = 0;\n',
              '    this.blackoutActive = false;\n    this.activeSabotageKind = null;\n    this.processedBlackoutPresses.clear();\n    this.blackoutEndsAt = 0;\n',
              'reset sabotage fields'
          )

          p.write_text(s)
      - name: Verify source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/games/wolves-and-sheep/GameManger.ts').read_text()
          checks = [
            'private roleChannel: RealtimeChannel | null = null;',
            'private activeSabotageKind:',
            'if (!this.isHost) return;',
            'roles: undefined',
            'sendPrivateRoles(roles);',
            'processedBlackoutPresses',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
            raise SystemExit('missing invariants: ' + repr(missing))
          print('wolves deep fix invariants OK')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/wolves-and-sheep/GameManger.ts
          git commit -m "fix: harden wolves multiplayer privacy and synchronization" || exit 0
          git push
          git rm .github/workflows/one-time-wolves-deep-fix.yml || true
          git commit -m "chore: remove one-time wolves deep fix workflow" || true
          git push || true
