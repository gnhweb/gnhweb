name: One-time Pharisee Voice and Prophet Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python .github/scripts/fix_pharisee_voice_and_prophet.py
      - name: Commit fixes and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/pharisee/VoiceChat.tsx src/games/pharisee/GameView.tsx
          git rm -f .github/workflows/one-time-fix-pharisee-voice-and-prophet.yml .github/scripts/fix_pharisee_voice_and_prophet.py
          git commit -m "fix: stabilize Pharisee voice peer discovery and remove prophet reveal"
          git push
