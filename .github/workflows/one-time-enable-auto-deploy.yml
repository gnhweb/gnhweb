name: Enable automatic Cloudflare deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable push trigger
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-cloudflare.yml')
          s = p.read_text()
          old = 'on:\n  workflow_dispatch:'
          new = 'on:\n  push:\n    branches: [main]\n  workflow_dispatch:'
          if old not in s:
              raise SystemExit('expected workflow trigger not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit workflow change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-cloudflare.yml
          git commit -m "Enable automatic Cloudflare deployment on main"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-enable-auto-deploy.yml
          git commit -m "Remove one-time auto-deploy setup workflow"
          git push
