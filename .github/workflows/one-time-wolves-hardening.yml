name: One-time wolves hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden Wolves GameManager
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('src/games/wolves-and-sheep/GameManger.ts')
          s = path.read_text()
          marker = '// WOLVES-HARDENING-V2'
          if marker in s:
              print('Already hardened')
              raise SystemExit(0)

          anchor = '  private activeMeetingId: string | null = null;\n'
          helpers = '''  private activeMeetingId: string | null = null;\n\n  // WOLVES-HARDENING-V2\n  private isValidCoordinate(value: number, max: number) {\n    return Number.isFinite(value) && value >= 0 && value <= max;\n  }\n\n  private isAlivePlayer(id: string) {\n    return this.players.get(id)?.alive === true;\n  }\n\n  private hasActiveSabotage() {\n    return this.activeSabotageKind !== null;\n  }\n\n  private clearActiveSabotage(kind?: typeof this.activeSabotageKind) {\n    if (!kind || this.activeSabotageKind === kind) this.activeSabotageKind = null;\n  }\n'''
          if anchor not in s:
              raise RuntimeError('helper anchor not found')
          s = s.replace(anchor, helpers, 1)

          s, n = re.subn(r'(?ms)^  sendMove\(x: number, y: number\) \{.*?^  \}\n\n  private applyMove\(payload: \{ id: string; x: number; y: number \}\) \{.*?^  \}\n', '''  sendMove(x: number, y: number) {\n    if (this.phase !== "playing" || !this.me?.alive) return;\n    if (!this.isValidCoordinate(x, 3600) || !this.isValidCoordinate(y, 2800)) return;\n    const p = this.players.get(this.userId);\n    if (!p) return;\n    if (Math.hypot(x - p.x, y - p.y) > 360) return;\n    p.x = x;\n    p.y = y;\n    this.channel.send({ type: "broadcast", event: "move", payload: { id: this.userId, x, y } });\n  }\n\n  private applyMove(payload: { id: string; x: number; y: number }) {\n    if (this.phase !== "playing") return;\n    if (!this.isValidCoordinate(payload.x, 3600) || !this.isValidCoordinate(payload.y, 2800)) return;\n    const p = this.players.get(payload.id);\n    if (!p || !p.alive) return;\n    if (Math.hypot(payload.x - p.x, payload.y - p.y) > 360) return;\n    p.x = payload.x;\n    p.y = payload.y;\n    this.emit("player-moved", payload.id);\n  }\n''', s, count=1)
          if n != 1: raise RuntimeError('movement block not found')

          s, n = re.subn(r'(?ms)^  killPlayer\(victimId: string\) \{\n', '  killPlayer(victimId: string) {\n    if (!this.canKill(Date.now()) || victimId === this.userId) return;\n', s, count=1)
          if n != 1: raise RuntimeError('killPlayer not found')
          s, n = re.subn(r'(?ms)^  private applyKill\([^\n]+\) \{\n', lambda m: m.group(0) + '    if (this.phase !== "playing") return;\n', s, count=1)
          if n != 1: raise RuntimeError('applyKill not found')

          s, n = re.subn(r'(?ms)^  completeTask\(taskId: string\) \{\n', '  completeTask(taskId: string) {\n    if (this.phase !== "playing" || !this.me?.alive) return;\n    if (!(this.taskAssignments[this.userId] ?? []).includes(taskId)) return;\n', s, count=1)
          if n != 1: raise RuntimeError('completeTask not found')
          s, n = re.subn(r'(?ms)^  private applyTaskProgress\([^\n]+\) \{\n', lambda m: m.group(0) + '    if (this.phase !== "playing") return;\n    if (!this.isAlivePlayer(payload.playerId)) return;\n    if (!(this.taskAssignments[payload.playerId] ?? []).includes(payload.taskId)) return;\n', s, count=1)
          if n != 1: raise RuntimeError('applyTaskProgress not found')

          for name, guard in [
            ('triggerBlackout', '    if (!this.canSabotage(Date.now())) return;\n'),
            ('triggerReactorSabotage', '    if (!this.canReactorSabotage(Date.now()) || this.hasActiveSabotage()) return;\n'),
            ('triggerDoorLock', '    if (!this.canDoorSabotage(Date.now()) || this.hasActiveSabotage()) return;\n'),
            ('triggerCandleSabotage', '    if (!this.canCandleSabotage(Date.now()) || this.hasActiveSabotage()) return;\n'),
            ('triggerPipeSabotage', '    if (!this.canPipeSabotage(Date.now()) || this.hasActiveSabotage()) return;\n'),
          ]:
            pat = rf'(?m)^(  {name}\([^\n]*\) \{{)$'
            s, n = re.subn(pat, rf'\1\n{guard}', s, count=1)
            if n != 1: raise RuntimeError(f'{name} not found')

          s, n = re.subn(r'(?ms)^  canSabotage\(now: number\) \{\n.*?^  \}\n', '''  canSabotage(now: number) {\n    return this.isWolfSide && this.me?.alive === true && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.hasActiveSabotage();\n  }\n''', s, count=1)
          if n != 1: raise RuntimeError('canSabotage not found')

          for fn, kind in [
            ('applyBlackoutStart', 'blackout'),
            ('applyReactorStart', 'reactor'),
            ('applyDoorLock', 'door'),
            ('applyCandleStart', 'candle'),
            ('applyPipeStart', 'pipe'),
          ]:
            pat = rf'(?m)^(  private {fn}\([^\n]*\) \{{)$'
            s, n = re.subn(pat, rf'\1\n    if (this.phase !== "playing" || this.hasActiveSabotage()) return;\n    this.activeSabotageKind = "{kind}";', s, count=1)
            if n != 1: raise RuntimeError(f'{fn} not found')

          s = re.sub(r'(?m)^(  callMeeting\(reason: string\) \{)$', r'\1\n    if (this.phase !== "playing" || !this.me?.alive) return;\n    if (reason !== "emergency" && reason !== "body") return;', s, count=1)
          s = re.sub(r'(?m)^(  private applyMeetingStart\([^\n]*\) \{)$', r'\1\n    if (this.phase !== "playing" || this.winner) return;', s, count=1)
          s = re.sub(r'(?m)^(  private applyVote\([^\n]*\) \{)$', r'\1\n    if (this.phase !== "meeting" || this.meetingSubPhase !== "vote") return;', s, count=1)
          s = s.replace('    if (payload.targetId && !target) return;\n', '    if (payload.targetId && (!target || !target.alive)) return;\n', 1)
          s = re.sub(r'(?m)^(  private applyVoteCancel\([^\n]*\) \{)$', r'\1\n    if (this.phase !== "meeting" || this.meetingSubPhase !== "vote") return;\n    if (!this.isAlivePlayer(payload.voterId)) return;', s, count=1)

          for fn in ['progressBlackout', 'fixReactorPanel', 'extinguishCandle', 'fixPipePanel']:
            pat = rf'(?m)^(  {fn}\([^\n]*\) \{{)$'
            s, n = re.subn(pat, r'\1\n    if (!this.me?.alive || this.phase !== "playing") return;', s, count=1)
            if n != 1: raise RuntimeError(f'{fn} not found')

          for fn in ['endBlackout', 'applyBlackoutEnd']:
            s = re.sub(rf'(?m)^(  (?:private )?{fn}\([^\n]*\) \{{)$', rf'\1\n    this.clearActiveSabotage("blackout");', s, count=1)
          for fn, kind in [('applyReactorEnd','reactor'),('endDoorLock','door'),('applyDoorUnlock','door'),('applyCandleEnd','candle'),('applyPipeEnd','pipe')]:
            s = re.sub(rf'(?m)^(  (?:private )?{fn}\([^\n]*\) \{{)$', rf'\1\n    this.clearActiveSabotage("{kind}");', s, count=1)

          s, n = re.subn(r'(?m)^(  private applyProtect\([^\n]*\) \{)$', r'\1\n    if (this.phase !== "playing") return;', s, count=1)
          if n != 1: raise RuntimeError('applyProtect not found')
          s, n = re.subn(r'(?m)^(  private applyIntercession\([^\n]*\) \{)$', r'\1\n    if (this.phase !== "playing") return;', s, count=1)
          if n != 1: raise RuntimeError('applyIntercession not found')

          path.write_text(s)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add', str(path)], check=True)
          subprocess.run(['git','commit','-m','fix: harden wolves gameplay validation'], check=True)
          subprocess.run(['git','push'], check=True)

      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-wolves-hardening.yml
          git commit -m "chore: remove one-time wolves hardening workflow"
          git push
