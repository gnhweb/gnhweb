name: One-time wolves hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden Wolves GameManager
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('src/games/wolves-and-sheep/GameManger.ts')
          s = path.read_text()
          marker = '// WOLVES-HARDENING-V2'
          if marker in s:
              print('Already hardened')
              raise SystemExit(0)

          # 1) Add central validation helpers.
          anchor = '  private activeMeetingId: string | null = null;\n'
          helpers = '''  private activeMeetingId: string | null = null;\n\n  // WOLVES-HARDENING-V2\n  private isValidCoordinate(value: number, max: number) {\n    return Number.isFinite(value) && value >= 0 && value <= max;\n  }\n\n  private isAlivePlayer(id: string) {\n    return this.players.get(id)?.alive === true;\n  }\n\n  private hasActiveSabotage() {\n    return this.activeSabotageKind !== null;\n  }\n\n  private clearActiveSabotage(kind?: typeof this.activeSabotageKind) {\n    if (!kind || this.activeSabotageKind === kind) this.activeSabotageKind = null;\n  }\n'''
          if anchor not in s:
              raise RuntimeError('helper anchor not found')
          s = s.replace(anchor, helpers, 1)

          # 2) Validate movement at both send and receive boundaries.
          s = re.sub(r'''  sendMove\(x: number, y: number\) \{.*?\n  \}\n\n  private applyMove\(payload: \{ id: string; x: number; y: number \}\) \{.*?\n  \}\n''', '''  sendMove(x: number, y: number) {\n    if (this.phase !== "playing" || !this.me?.alive) return;\n    if (!this.isValidCoordinate(x, 3600) || !this.isValidCoordinate(y, 2800)) return;\n    const p = this.players.get(this.userId);\n    if (!p) return;\n    const maxStep = 360;\n    if (Math.hypot(x - p.x, y - p.y) > maxStep) return;\n    p.x = x;\n    p.y = y;\n    this.channel.send({ type: "broadcast", event: "move", payload: { id: this.userId, x, y } });\n  }\n\n  private applyMove(payload: { id: string; x: number; y: number }) {\n    if (this.phase !== "playing") return;\n    if (!this.isValidCoordinate(payload.x, 3600) || !this.isValidCoordinate(payload.y, 2800)) return;\n    const p = this.players.get(payload.id);\n    if (!p || !p.alive) return;\n    if (Math.hypot(payload.x - p.x, payload.y - p.y) > 360) return;\n    p.x = payload.x;\n    p.y = payload.y;\n    this.emit("player-moved", payload.id);\n  }\n''', s, count=1, flags=re.S)

          # 3) Kill entry points must re-check role, phase, cooldown and self-targeting.
          s = re.sub(r'''  killPlayer\(victimId: string\) \{\n    const victim = this.players.get\(victimId\);\n    if \(!victim \|\| !victim\.alive\) return;\n    this\.killCooldownUntil = Date\.now\(\) \+ this\.settings\.killCooldownMs;''', '''  killPlayer(victimId: string) {\n    if (!this.canKill(Date.now())) return;\n    if (victimId === this.userId) return;\n    const victim = this.players.get(victimId);\n    if (!victim || !victim.alive) return;\n    this.killCooldownUntil = Date.now() + this.settings.killCooldownMs;''', s, count=1)
          s = re.sub(r'''  private applyKill\(payload: \{ victimId: string; x: number; y: number; victimName: string \}\) \{\n    if \(this\.blockedKillVictims\.has\(payload\.victimId\)\) return;''', '''  private applyKill(payload: { victimId: string; x: number; y: number; victimName: string }) {\n    if (this.phase !== "playing") return;\n    if (this.blockedKillVictims.has(payload.victimId)) return;''', s, count=1)

          # 4) Tasks can only be completed by the assigned player and only once.
          s = re.sub(r'''  completeTask\(taskId: string\) \{\n    if \(this\.myCompletedTasks\.has\(taskId\)\) return;''', '''  completeTask(taskId: string) {\n    if (this.phase !== "playing" || !this.me?.alive) return;\n    if (!(this.taskAssignments[this.userId] ?? []).includes(taskId)) return;\n    if (this.myCompletedTasks.has(taskId)) return;''', s, count=1)
          s = re.sub(r'''  private applyTaskProgress\(payload: \{ playerId: string; taskId: string \}\) \{\n    const done =''', '''  private applyTaskProgress(payload: { playerId: string; taskId: string }) {\n    if (this.phase !== "playing") return;\n    if (!this.isAlivePlayer(payload.playerId)) return;\n    if (!(this.taskAssignments[payload.playerId] ?? []).includes(payload.taskId)) return;\n    const done =''', s, count=1)

          # 5) Protect/intercession/misc abilities re-check life/phase at mutation boundary.
          s = re.sub(r'''  private applyProtect\(payload: \{ targetId: string \}\) \{\n    const target =''', '''  private applyProtect(payload: { targetId: string }) {\n    if (this.phase !== "playing") return;\n    const target =''', s, count=1)
          s = re.sub(r'''  private applyIntercession\(payload: \{ targetId: string; targetName: string; x: number; y: number; byName: string \}\) \{\n    const p =''', '''  private applyIntercession(payload: { targetId: string; targetName: string; x: number; y: number; byName: string }) {\n    if (this.phase !== "playing") return;\n    const p =''', s, count=1)

          # 6) Meeting/ voting must be alive, valid-phase, and target-alive.
          s = re.sub(r'''  callMeeting\(reason: string\) \{\n    if \(this\.phase !== "playing"\) return;''', '''  callMeeting(reason: string) {\n    if (this.phase !== "playing" || !this.me?.alive) return;\n    if (reason !== "emergency" && reason !== "body") return;''', s, count=1)
          s = re.sub(r'''  private applyMeetingStart\(payload: \{ reason: string; callerName: string; emergencyCallsUsed: number \}\) \{\n    let interruptedSabotage''', '''  private applyMeetingStart(payload: { reason: string; callerName: string; emergencyCallsUsed: number }) {\n    if (this.phase !== "playing" || this.winner) return;\n    this.activeMeetingId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;\n    let interruptedSabotage''', s, count=1)
          s = re.sub(r'''  private applyVote\(payload: \{ voterId: string; targetId: string \}\) \{\n    const voter =''', '''  private applyVote(payload: { voterId: string; targetId: string }) {\n    if (this.phase !== "meeting" || this.meetingSubPhase !== "vote") return;\n    const voter =''', s, count=1)
          s = re.sub(r'''    if \(payload\.targetId && !target\) return;\n    this\.votes\.set''', '''    if (payload.targetId && (!target || !target.alive)) return;\n    this.votes.set''', s, count=1)
          s = re.sub(r'''  private applyVoteCancel\(payload: \{ voterId: string \}\) \{\n    this\.votes\.delete''', '''  private applyVoteCancel(payload: { voterId: string }) {\n    if (this.phase !== "meeting" || this.meetingSubPhase !== "vote") return;\n    if (!this.isAlivePlayer(payload.voterId)) return;\n    this.votes.delete''', s, count=1)

          # 7) Sabotage triggers require a wolf, playing phase, cooldown, and no competing sabotage.
          s = re.sub(r'''  canSabotage\(now: number\) \{\n    return this\.isWolfSide && now >= this\.sabotageCooldownUntil && this\.phase === "playing" && !this\.blackoutActive;\n  \}''', '''  canSabotage(now: number) {\n    return this.isWolfSide && this.me?.alive === true && now >= this.sabotageCooldownUntil && this.phase === "playing" && !this.hasActiveSabotage();\n  }''', s, count=1)

          replacements = [
            (r'''  triggerBlackout\(\) \{\n    const payload''', '''  triggerBlackout() {\n    if (!this.canSabotage(Date.now())) return;\n    const payload'''),
            (r'''  triggerReactorSabotage\(\) \{\n    const payload''', '''  triggerReactorSabotage() {\n    if (!this.canReactorSabotage(Date.now()) || this.hasActiveSabotage()) return;\n    const payload'''),
            (r'''  triggerDoorLock\(roomId: string\) \{\n    const payload''', '''  triggerDoorLock(roomId: string) {\n    if (!this.canDoorSabotage(Date.now()) || this.hasActiveSabotage()) return;\n    if (!roomId || roomId.length > 64) return;\n    const payload'''),
            (r'''  triggerCandleSabotage\(\) \{\n    const shuffled''', '''  triggerCandleSabotage() {\n    if (!this.canCandleSabotage(Date.now()) || this.hasActiveSabotage()) return;\n    const shuffled'''),
            (r'''  triggerPipeSabotage\(\) \{\n    const payload''', '''  triggerPipeSabotage() {\n    if (!this.canPipeSabotage(Date.now()) || this.hasActiveSabotage()) return;\n    const payload'''),
          ]
          for pat, repl in replacements:
              s, n = re.subn(pat, repl, s, count=1)
              if n != 1:
                  raise RuntimeError(f'guard replacement failed: {pat}')

          # Mark active sabotage in every start handler.
          starts = [
              ('applyBlackoutStart', 'blackoutActive', 'blackout'),
              ('applyReactorStart', 'reactorActive', 'reactor'),
              ('applyDoorLock', 'doorLockRoomId', 'door'),
              ('applyCandleStart', 'candleActive', 'candle'),
              ('applyPipeStart', 'pipeActive', 'pipe'),
          ]
          for fn, state, kind in starts:
              marker_line = f'  private {fn}'
              pos = s.find(marker_line)
              if pos < 0:
                  raise RuntimeError(f'{fn} not found')
              body_start = s.find('{', pos)
              insert = f'\n    if (this.phase !== "playing" || this.hasActiveSabotage()) return;\n    this.activeSabotageKind = "{kind}";'
              s = s[:body_start+1] + insert + s[body_start+1:]

          # Clear active sabotage on all successful/forced ends.
          s = re.sub(r'(private endBlackout\(broadcast: boolean\) \{)', r'\1\n    this.clearActiveSabotage("blackout");', s, count=1)
          s = re.sub(r'(private applyBlackoutEnd\(\) \{)', r'\1\n    this.clearActiveSabotage("blackout");', s, count=1)
          s = re.sub(r'(private applyReactorEnd\(\) \{)', r'\1\n    this.clearActiveSabotage("reactor");', s, count=1)
          s = re.sub(r'(private endDoorLock\(broadcast: boolean\) \{)', r'\1\n    this.clearActiveSabotage("door");', s, count=1)
          s = re.sub(r'(private applyDoorUnlock\(\) \{)', r'\1\n    this.clearActiveSabotage("door");', s, count=1)
          s = re.sub(r'(private applyCandleEnd\(\) \{)', r'\1\n    this.clearActiveSabotage("candle");', s, count=1)
          s = re.sub(r'(private applyPipeEnd\(\) \{)', r'\1\n    this.clearActiveSabotage("pipe");', s, count=1)

          # Active sabotage progress/fix inputs require living players and active matching state.
          for fn in ['progressBlackout', 'fixReactorPanel', 'extinguishCandle', 'fixPipePanel']:
              pos = s.find(f'  {fn}')
              if pos < 0:
                  raise RuntimeError(f'{fn} not found')
              brace = s.find('{', pos)
              s = s[:brace+1] + '\n    if (!this.me?.alive || this.phase !== "playing") return;' + s[brace+1:]

          path.write_text(s)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add', str(path)], check=True)
          subprocess.run(['git','commit','-m','fix: harden wolves gameplay authority and validation'], check=True)
          subprocess.run(['git','push'], check=True)

      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-wolves-hardening.yml
          git commit -m "chore: remove one-time wolves hardening workflow"
          git push
