name: Verify site

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: development

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --include=dev --cache "/tmp/npm-cache-${{ github.run_id }}"
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
