name: Verify site

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: development

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply pending image egress guard
        if: ${{ github.event_name == 'push' && hashFiles('._apply_egress_guard.py') != '' }}
        run: python3 ._apply_egress_guard.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --include=dev --cache "/tmp/npm-cache-${{ github.run_id }}"
      - name: Verify site
        run: npm run verify
      - name: Unit tests
        run: npm test
      - name: Commit pending image egress guard
        if: ${{ github.event_name == 'push' && hashFiles('._apply_egress_guard.py') != '' }}
        run: |
          rm -f ._apply_egress_guard.py .github/workflows/apply-image-egress-guard.yml .github/workflows/_apply-egress-guard.yml _egress-guard.patch _egress-guard-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase/migrations/20260905220000_harden_public_image_bucket.sql
          git add -u .github/workflows/verify-site.yml .github/workflows/apply-image-egress-guard.yml .github/workflows/_apply-egress-guard.yml ._apply_egress_guard.py _egress-guard.patch _egress-guard-trigger.txt
          git commit -m "chore: apply image egress guard"
          git push
