name: One-time profile records cleanup

on:
  push:
    paths:
      - .github/workflows/one-time-profile-records-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'one-time profile records cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove profile-only faith record buttons
        shell: python
        run: |
          from pathlib import Path

          page = Path('src/pages/profile/page.tsx')
          s = page.read_text(encoding='utf-8')

          old = [
              "  { path: '/faith-storybook', label: '신앙 스토리북', icon: 'ri-bookmark-line' },\n",
              "  { path: '/repentance-journal', label: '회개 저널', icon: 'ri-hand-heart-line' },\n",
          ]
          for line in old:
              if s.count(line) != 1:
                  raise SystemExit(f'Expected exactly one profile item: {line.strip()}')
              s = s.replace(line, '', 1)

          page.write_text(s, encoding='utf-8')

      - name: Validate scope
        run: |
          ! grep -q "path: '/faith-storybook'.*신앙 스토리북" src/pages/profile/page.tsx
          ! grep -q "path: '/repentance-journal'.*회개 저널" src/pages/profile/page.tsx
          grep -q "path: '/faith-journal'.*신앙 일지" src/pages/profile/page.tsx
          grep -q 'grid grid-cols-3 gap-2' src/pages/profile/page.tsx
          git diff --check

      - name: Commit profile-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/profile/page.tsx
          git commit -m 'fix: remove profile faith storybook and repentance journal buttons'
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-profile-records-cleanup.yml
          git commit -m 'chore: remove one-time profile records cleanup workflow'
          git push
