name: Remove Student Council Center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-center:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove center references
        shell: python
        run: |
          from pathlib import Path

          navbar = Path('src/components/feature/Navbar.tsx')
          text = navbar.read_text(encoding='utf-8')
          text = text.replace("    { path: '/student-council-center', label: '학생회 발전센터', icon: 'ri-rocket-2-line' },\n", '')
          mobile = '<MenuGridCard icon="ri-rocket-2-line" label="학생회 발전센터" colorClass="bg-indigo-100 text-indigo-600" active={isActive(\'/student-council-center\')} onClick={() => { navigate(\'/student-council-center\'); setMobileOpen(false); }} />'
          text = text.replace(mobile, '')
          navbar.write_text(text, encoding='utf-8')

          router = Path('src/router/config.tsx')
          text = router.read_text(encoding='utf-8')
          text = text.replace('const StudentCouncilCenter = lazy(() => import("@/pages/studentCouncilCenter/page"));\n', '')
          route = '''      {\n        path: "/student-council-center",\n        element: (\n          <AuthGuard minRole="assistant_zone_leader">\n            {withSuspense(<StudentCouncilCenter />)}\n          </AuthGuard>\n        ),\n      },\n'''
          text = text.replace(route, '')
          router.write_text(text, encoding='utf-8')

          page = Path('src/pages/studentCouncilCenter/page.tsx')
          if page.exists():
              page.unlink()

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove student council development center" || exit 0
          git push

      - name: Remove this one-time workflow
        if: success()
        run: |
          git rm .github/workflows/remove-student-council-center.yml
          git commit -m "Remove one-time cleanup workflow"
          git push
