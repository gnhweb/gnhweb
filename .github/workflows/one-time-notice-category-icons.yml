name: One-time notice category icon fill

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace notice category icons with filled icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/home/page.tsx')
          s = p.read_text()
          replacements = {
            'ri-alarm-warning-line': 'ri-alarm-warning-fill',
            'ri-calendar-event-line': 'ri-calendar-event-fill',
            'ri-user-add-line': 'ri-user-add-fill',
            'ri-book-open-line': 'ri-book-open-fill',
            'ri-hand-heart-line': 'ri-hand-heart-fill',
            'ri-megaphone-line': 'ri-megaphone-fill',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/home/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "공지사항 카테고리 아이콘을 채움형으로 통일 [skip ci]"
          git push
