name: Force fresh main bundle for Bible MBTI artwork fix

on:
  push:
    paths:
      - .github/workflows/force-main-bundle-rebuild.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add runtime bundle revision
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.tsx')
          text = path.read_text(encoding='utf-8')
          marker = "\ndocument.documentElement.dataset.gnhwebBundleRevision = '20260908-bible-mbti-art-2';\n"
          if 'gnhwebBundleRevision' not in text:
              path.write_text(text.rstrip() + marker, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/force-main-bundle-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx .github/workflows/force-main-bundle-rebuild.yml
          git commit -m 'force fresh main bundle for Bible MBTI artwork fix'
          git push origin main
