name: One-time faith private links

on:
  push:
    paths:
      - .github/workflows/one-time-faith-private-links.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch private faith links
        shell: python
        run: |
          from pathlib import Path

          navbar = Path('src/components/feature/Navbar.tsx')
          s = navbar.read_text()
          s = s.replace(
              "    { path: '/bible-pick/history', label: '말씀 히스토리', icon: 'ri-history-line' },\n",
              ""
          )
          s = s.replace(
              "const PROFILE_FAITH_ITEMS: CategoryItem[] = [\n",
              "const PROFILE_FAITH_ITEMS: CategoryItem[] = [\n  { path: '/bible-pick/history', label: '말씀 히스토리', icon: 'ri-history-line' },\n  { path: '/bible-streak', label: '말씀 스트릭', icon: 'ri-fire-line' },\n"
          )
          navbar.write_text(s)

          profile = Path('src/pages/profile/page.tsx')
          s = profile.read_text()
          s = s.replace(
              "const PRIVATE_FEATURE_ITEMS: { path: string; label: string; icon: string }[] = [\n",
              "const PRIVATE_FEATURE_ITEMS: { path: string; label: string; icon: string }[] = [\n  { path: '/bible-pick/history', label: '말씀 히스토리', icon: 'ri-history-line' },\n  { path: '/bible-streak', label: '말씀 스트릭', icon: 'ri-fire-line' },\n"
          )
          profile.write_text(s)

      - name: Verify changes
        run: |
          grep -n "말씀 히스토리\|말씀 스트릭" src/components/feature/Navbar.tsx src/pages/profile/page.tsx
          if grep -n "{ path: '/bible-pick/history', label: '말씀 히스토리'" src/components/feature/Navbar.tsx | head -1 | grep -q "BIBLE_CATEGORY"; then true; fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/Navbar.tsx src/pages/profile/page.tsx
          git commit -m "feat: move bible history and streak into private faith" || exit 0
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-faith-private-links.yml || true
          git commit -m "chore: remove one-time faith links workflow" || true
          git push || true
