name: optimize-image-cache-once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    if: github.event.head_commit.message != 'chore: one-time image cache optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply image cache metadata
        shell: python
        run: |
          from pathlib import Path
          targets = [
            'src/components/feature/ClubBannerManager.tsx',
            'src/components/feature/SiteBanner.tsx',
            'src/pages/clubs/community/page.tsx',
            'src/pages/faithJournal/page.tsx',
            'src/pages/ganghakNews/edit/page.tsx',
            'src/pages/ganghakNews/write/page.tsx',
            'src/pages/missions/board/page.tsx',
            'src/pages/profile/page.tsx',
          ]
          for name in targets:
            p = Path(name)
            s = p.read_text()
            old = s
            s = s.replace("{ cacheControl: '3600', upsert: false }", "{ cacheControl: '31536000', upsert: false }")
            s = s.replace("{ upsert: true, contentType: 'image/jpeg' }", "{ upsert: true, contentType: 'image/jpeg', cacheControl: '31536000' }")
            s = s.replace("{ upsert: true });", "{ upsert: true, cacheControl: '31536000' });")
            if s != old:
              p.write_text(s)
      - name: Commit optimized files
        shell: bash
        run: |
          git config user.name "gnhweb"
          git config user.email "gemini19840314@gmail.com"
          git add src/components/feature/ClubBannerManager.tsx src/components/feature/SiteBanner.tsx src/pages/clubs/community/page.tsx src/pages/faithJournal/page.tsx src/pages/ganghakNews/edit/page.tsx src/pages/ganghakNews/write/page.tsx src/pages/missions/board/page.tsx src/pages/profile/page.tsx
          if git diff --cached --quiet; then
            echo "No image upload cache changes needed"
          else
            git commit -m "chore: one-time image cache optimization"
            git push
          fi
          rm -f .github/workflows/optimize-image-cache-once.yml
          git add -u .github/workflows/optimize-image-cache-once.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time image cache optimization"
            git push
          fi
