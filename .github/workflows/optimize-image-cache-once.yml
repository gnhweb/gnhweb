name: One-time image cache optimization

on:
  push:
    paths:
      - '.github/cache-optimization-trigger'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add long-lived cache metadata to image uploads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/pages/clubs/community/page.tsx': [
                  (".upload(path, file, { upsert: true })", ".upload(path, file, { upsert: true, cacheControl: '31536000' })"),
              ],
              'src/pages/faithJournal/page.tsx': [
                  (".upload(uploadedPath, storyForm.file, { upsert: true })", ".upload(uploadedPath, storyForm.file, { upsert: true, cacheControl: '31536000' })"),
              ],
              'src/pages/ganghakNews/edit/page.tsx': [
                  (".upload(path, file, { upsert: true })", ".upload(path, file, { upsert: true, cacheControl: '31536000' })"),
              ],
              'src/pages/profile/page.tsx': [
                  (".upload(path, file, { upsert: true })", ".upload(path, file, { upsert: true, cacheControl: '31536000' })"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'{filename}: no change made')
              path.write_text(text)
          PY

      - name: Commit source changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/cache-optimization-trigger .github/workflows/optimize-image-cache-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/clubs/community/page.tsx src/pages/faithJournal/page.tsx src/pages/ganghakNews/edit/page.tsx src/pages/profile/page.tsx .github/cache-optimization-trigger .github/workflows/optimize-image-cache-once.yml
          git diff --cached --check
          git commit -m 'perf: optimize remaining image upload cache metadata'
          git push
