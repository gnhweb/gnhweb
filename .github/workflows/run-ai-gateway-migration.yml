name: one-time AI gateway migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Migrate
        run: python scripts/migrate-ai-gateway.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions .github/workflows/verify-site.yml
          git rm -f .github/workflows/run-ai-gateway-migration.yml 2>/dev/null || true
          git rm -f .github/workflows/migrate-ai-gateway.yml .github/workflows/one-time-final-search-placement.yml MIGRATION_TRIGGER.md scripts/migrate-ai-gateway.py 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: route remaining AI edge functions through gateway"
          git push
