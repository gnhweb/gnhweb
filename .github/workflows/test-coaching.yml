name: Test leadership coaching

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coaching-smoke-test:
    name: Verify gnhweb AI gateway /nim-coaching POST
    runs-on: ubuntu-latest
    steps:
      - name: POST /nim-coaching smoke test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"concern":"동아리원이 내 말을 잘 듣지 않아요. 내가 어떻게 해야 하나요?","tone":"direct"}' \
            'https://gnhweb-ai-gateway.gemini19840314.workers.dev/nim-coaching')
          echo "HTTP $http_code"
          cat "$response_file"
          test "$http_code" = "200"
          grep -q '"advice"' "$response_file"
          advice_length=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("advice", "").strip()))' "$response_file")
          echo "advice_length=$advice_length"
          test "$advice_length" -ge 120
