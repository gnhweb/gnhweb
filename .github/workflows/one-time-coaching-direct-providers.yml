name: One-time direct coaching provider fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch coaching provider call
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('workers/ai-gateway/src/coachingFeature.ts')
          s = p.read_text()
          pattern = r'async function requestGateway\(\n  messages: Array<\{ role: "system" \| "user"; content: string \}>,\n  maxTokens = 3000,\n\) \{.*?\n\}\n\n(?:async function|function|export async function)'
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit('requestGateway block not found')
          old = m.group(0)
          marker = old.rsplit('\n\n', 1)[-1]
          new_func = '''async function requestGateway(\n  messages: Array<{ role: "system" | "user"; content: string }>,\n  maxTokens = 3000,\n) {\n  const providers = [\n    { key: "NVIDIA_API_KEY", url: "https://integrate.api.nvidia.com/v1/chat/completions", modelKey: "NVIDIA_GATEWAY_MODEL", model: "google/gemma-4-31b-it" },\n    { key: "GROQ_API_KEY", url: "https://api.groq.com/openai/v1/chat/completions", modelKey: "GROQ_MODEL", model: "openai/gpt-oss-120b" },\n    { key: "DEEPSEEK_API_KEY", url: "https://api.deepseek.com/chat/completions", modelKey: "DEEPSEEK_MODEL", model: "deepseek-v4-flash" },\n    { key: "MISTRAL_API_KEY", url: "https://api.mistral.ai/v1/chat/completions", modelKey: "MISTRAL_MODEL", model: "mistral-large-latest" },\n    { key: "XAI_API_KEY", url: "https://api.x.ai/v1/chat/completions", modelKey: "XAI_MODEL", model: "grok-4.6" },\n    { key: "OPENROUTER_API_KEY", url: "https://openrouter.ai/api/v1/chat/completions", modelKey: "OPENROUTER_MODEL", model: "openai/gpt-oss-120b" },\n  ];\n  for (const provider of providers) {\n    const apiKey = envForCoaching[provider.key]?.trim();\n    if (!apiKey) continue;\n    const controller = new AbortController();\n    const timeout = setTimeout(() => controller.abort(), 12000);\n    try {\n      const response = await fetch(provider.url, {\n        method: "POST",\n        headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}` },\n        body: JSON.stringify({ model: (envForCoaching[provider.modelKey] || provider.model).trim(), messages, max_tokens: maxTokens, temperature: 0.3 }),\n        signal: controller.signal,\n      });\n      if (!response.ok) continue;\n      const data = await response.json() as { choices?: Array<{ message?: { content?: unknown } }> };\n      const content = data.choices?.[0]?.message?.content;\n      if (typeof content === "string" && content.trim()) return content.trim();\n    } catch {\n      // Try the next configured provider.\n    } finally {\n      clearTimeout(timeout);\n    }\n  }\n  throw new Error("No coaching provider available");\n}\n\n'''
          # requestGateway needs access to the handler's env, so rename the handler env to a module-scoped reference safely.
          s = s.replace('async function requestGateway(\n', 'async function requestGateway(\n', 1)
          # Add a small module-scoped env reference and set it at handler entry.
          if 'let envForCoaching: Record<string, string | undefined> = {};' not in s:
              insert_at = s.find('const FALLBACK_DIRECT')
              s = s[:insert_at] + 'let envForCoaching: Record<string, string | undefined> = {};\n\n' + s[insert_at:]
          s = s[:m.start()] + new_func + marker + s[m.end():]
          handler = re.search(r'export async function handleNimCoaching\(req: Request, env: Record<string, string \| undefined>\) \{', s)
          if not handler:
              raise SystemExit('handleNimCoaching signature not found')
          start = handler.end()
          s = s[:start] + '\n  envForCoaching = env; ' + s[start:]
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name gnhweb
          git config user.email gemini19840314@gmail.com
          rm .github/workflows/one-time-coaching-direct-providers.yml
          git add workers/ai-gateway/src/coachingFeature.ts .github/workflows/one-time-coaching-direct-providers.yml
          git commit -m 'Fix coaching direct provider routing'
          git push
