name: one-time-community-mission-menu
on:
  push:
    paths:
      - '.github/workflows/one-time-community-mission-menu.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only community mission menu
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/feature/Navbar.tsx')
          text = p.read_text(encoding='utf-8')
          old = "    { path: '/prayer-relay', label: '기도 릴레이', icon: 'ri-hand-heart-line' },\n    { path: '/missions/wall', label: '사명 인증 게시판', icon: 'ri-gallery-line' },"
          new = "    { path: '/prayer-relay', label: '기도 릴레이', icon: 'ri-hand-heart-line' },\n    { path: '/missions', label: '작은 사명 관리', icon: 'ri-medal-line' },\n    { path: '/missions/wall', label: '사명 인증 게시판', icon: 'ri-gallery-line' },"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/Navbar.tsx
          git rm .github/workflows/one-time-community-mission-menu.yml
          git commit -m "fix: show small mission management in community menu"
          git push
