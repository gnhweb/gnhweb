name: One-time event planning removal

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/one-time-final-search-placement.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove event planning features
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, patterns):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for pattern, replacement in patterns:
                  text = re.sub(pattern, replacement, text, flags=re.M)
              p.write_text(text, encoding='utf-8')

          edit('src/components/feature/Navbar.tsx', [
              (r"^\s*\{ path: '/pds-planner', label: '행사 기획 마법사'.*?\},\s*$", ''),
              (r"^\s*\{ path: '/event-ideas', label: '행사 기획 아이디어'.*?\},\s*$", ''),
          ])
          edit('src/components/feature/UnifiedNavbar.tsx', [
              (r"\['/pds-planner','행사 기획'\],", ''),
              (r"\['/event-ideas','행사 아이디어'\],", ''),
          ])
          edit('src/lib/siteSearch.ts', [
              (r"^\s*\{ path: '/pds-planner', label: '행사 기획 마법사'.*?\},\s*$", ''),
              (r"^\s*\{ path: '/event-ideas', label: '행사 기획 아이디어'.*?\},\s*$", ''),
          ])

          edit('src/components/feature/Layout.tsx', [
              (r"^import EventIdeasEnhanced from '@/pages/eventIdeasEnhanced/page';\n", ''),
              (r"['\"]?/event-ideas['\"]?,", ''),
              (r":location\.pathname===['\"]?/event-ideas['\"]?\s*\?\s*<EventIdeasEnhanced\s*/>\s*:", ':'),
          ])

          edit('src/router/config.tsx', [
              (r"^const EventIdeas = lazy\(\(\) => import\(\"@/pages/eventIdeas/page\"\)\);\n", ''),
              (r"^const PdsPlanner = lazy\(\(\) => import\(\"@/pages/pdsPlanner/page\"\)\);\n", ''),
              (r'\{path:"/event-ideas",element:withSuspense\(<EventIdeas/>\)\},', ''),
              (r'\{path:"/pds-planner",.*?\},', ''),
          ])

          edit('src/lib/nvidiaNim.ts', [
              (r"export interface PDSChecklist[\s\S]*?(?=export async function generateLeadershipCoaching)", ''),
          ])

          edit('scripts/verify-site.mjs', [(r"^\s*'/event-ideas',\n", '')])
          edit('public/navbar-desktop-fix.css', [(r"\n/\* Removed mission tools:.*?a\[href=\"/event-ideas\"\] \{\n\s*display: none !important;\n\}\s*", '\n')])

          for path in [
              'src/pages/pdsPlanner/page.tsx',
              'src/pages/eventIdeas/page.tsx',
              'src/pages/eventIdeasEnhanced/page.tsx',
              'supabase/functions/nim-pds/index.ts',
              'supabase/functions/nim-event-ideas/index.ts',
          ]:
              Path(path).unlink(missing_ok=True)

          needles = ['/pds-planner', '/event-ideas', '행사 기획 마법서', '행사 기획 아이디어', 'nim-pds', 'nim-event-ideas', 'PDSChecklist', 'EventIdea']
          leftovers = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  t = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if any(n in t for n in needles):
                  leftovers.append(str(p))
          if leftovers:
              raise SystemExit('deprecated references remain: ' + ', '.join(leftovers))

          for path in [
              '.github/workflows/remove-event-planning-tools.yml',
              '.github/workflows/remove-event-planning-tools-v2.yml',
              '.github/workflows/remove-event-planning-tools-v3.yml',
              '.github/workflows/one-time-final-search-placement.yml',
          ]:
              Path(path).unlink(missing_ok=True)

      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove: delete event planning mission tools"
          git push
