name: One-time AI gateway migration

on:
  push:
    paths:
      - .github/workflows/one-time-final-search-placement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Migrate remaining direct NVIDIA functions
        shell: python
        run: |
          from pathlib import Path
          import re

          base = Path('supabase/functions')

          def gateway_auth(s):
              s = re.sub(r'const apiKey = Deno\.env\.get\([^)]+\);', 'const gatewayAuth = req.headers.get("Authorization") || `Bearer ${Deno.env.get("SUPABASE_ANON_KEY") || ""}`;', s)
              s = s.replace('if (!apiKey)', 'if (!gatewayAuth)').replace('if (apiKey)', 'if (gatewayAuth)')
              s = s.replace('`Bearer ${apiKey}`', 'gatewayAuth')
              s = s.replace('"Authorization": `Bearer ${apiKey}`', '"Authorization": gatewayAuth')
              return s

          def simple(name, task):
              p = base / name / 'index.ts'
              s = p.read_text()
              if 'integrate.api.nvidia.com' not in s:
                  return
              s = re.sub(r'import \{ logNvidiaUsage \} from "\.\./_shared/logNvidiaUsage\.ts";\n?', '', s)
              s = s.replace('https://integrate.api.nvidia.com/v1/chat/completions', '${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway')
              s = gateway_auth(s)
              s = re.sub(r'\n\s*logNvidiaUsage\([^\n]*\)\.catch\(\(\) => \{\}\);', '', s)
              marker = '${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway'
              at = s.find(marker)
              if at >= 0 and 'task:' not in s[at:at+500]:
                  bi = s.find('body: JSON.stringify({', at)
                  if bi >= 0:
                      ins = bi + len('body: JSON.stringify({')
                      s = s[:ins] + f'\n        task: "{task}",' + s[ins:]
              s = s.replace("fetch('${Deno.env.get(\"SUPABASE_URL\")}/functions/v1/ai-gateway'", 'fetch(`${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway`')
              s = s.replace('fetch("${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway"', 'fetch(`${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway`')
              p.write_text(s)

          simple('nim-mbti', 'bible-mbti')
          simple('bible-pick', 'bible-pick')

          p = base / 'meeting-copilot' / 'index.ts'
          s = p.read_text()
          if 'integrate.api.nvidia.com' in s:
              s = re.sub(r'import \{ logNvidiaUsage \} from "\.\./_shared/logNvidiaUsage\.ts";\n?', '', s)
              s = re.sub(r'const apiKey = Deno\.env\.get\("NVIDIA_KEY_MEETING"\);', 'const gatewayAuth = req.headers.get("Authorization") || `Bearer ${Deno.env.get("SUPABASE_ANON_KEY") || ""}`;', s)
              s = s.replace('if (!apiKey)', 'if (!gatewayAuth)')
              s = s.replace('https://integrate.api.nvidia.com/v1/chat/completions', '${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway')
              s = s.replace('"Authorization": `Bearer ${apiKey}`', '"Authorization": gatewayAuth')
              s = s.replace('fetch("${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway"', 'fetch(`${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway`')
              at = s.find('${Deno.env.get("SUPABASE_URL")}/functions/v1/ai-gateway')
              bi = s.find('body: JSON.stringify({', at)
              if bi >= 0 and 'task:' not in s[bi:bi+120]:
                  ins = bi + len('body: JSON.stringify({')
                  s = s[:ins] + '\n        task: "student-council",' + s[ins:]
              s = re.sub(r'\n\s*logNvidiaUsage\([^\n]*\)\.catch\(\(\) => \{\}\);', '', s)
              s = s.replace('const NIM_MODEL = Deno.env.get("NVIDIA_NIM_MODEL") || "google/gemma-4-31b-it";\n', '')
              s = s.replace('    console.log(`[meeting-copilot] Model: ${NIM_MODEL}, messages: ${apiMessages.length}, dataRich: ${dataRichness.rich}, missing: [${dataRichness.missingFields.join(", ")}]`);', '    console.log(`[meeting-copilot] Gateway request: messages=${apiMessages.length}, dataRich=${dataRichness.rich}, missing=[${dataRichness.missingFields.join(", ")}]`);')
              s = s.replace('        model: NIM_MODEL,\n', '').replace('        top_p: 0.9,\n        stream: true,\n', '')
              s = s.replace('// ── NIM API 스트리밍 호출 ──', '// ── AI Gateway 호출 ──')
              start = s.find('    if (!nimResponse.ok) {')
              outer = s.find('  } catch (err) {', start)
              if start >= 0 and outer >= 0:
                  replacement = '\n'.join([
                      '    if (!nimResponse.ok) {',
                      '      const errText = await nimResponse.text();',
                      '      console.error("AI Gateway error:", nimResponse.status, errText);',
                      '      return new Response(',
                      '        JSON.stringify({ error: `AI 서비스 호출에 실패했습니다. (${nimResponse.status})` }),',
                      '        { status: 502, headers: { ...CORS_HEADERS, "Content-Type": "application/json" } }',
                      '      );',
                      '    }',
                      '',
                      '    const gatewayData = await nimResponse.json();',
                      '    const content = gatewayData?.choices?.[0]?.message?.content;',
                      '    if (typeof content !== "string" || !content.trim()) {',
                      '      return new Response(',
                      '        JSON.stringify({ error: "AI 응답을 받지 못했습니다." }),',
                      '        { status: 502, headers: { ...CORS_HEADERS, "Content-Type": "application/json" } }',
                      '      );',
                      '    }',
                      '',
                      '    const encoder = new TextEncoder();',
                      '    const ssePayload = `data: ${JSON.stringify({ content })}\\n\\ndata: [DONE]\\n\\n`;',
                      '    return new Response(encoder.encode(ssePayload), {',
                      '      headers: {',
                      '        ...CORS_HEADERS,',
                      '        "Content-Type": "text/event-stream",',
                      '        "Cache-Control": "no-cache",',
                      '        "Connection": "keep-alive",',
                      '      },',
                      '    });',
                      '',
                  ])
                  s = s[:start] + replacement + s[outer:]
              p.write_text(s)

          direct = []
          for p in base.glob('*/index.ts'):
              if p.parent.name != 'ai-gateway' and 'integrate.api.nvidia.com' in p.read_text():
                  direct.append(str(p))
          if direct:
              raise SystemExit('Direct NVIDIA calls remain: ' + ', '.join(direct))

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/migrate-ai-gateway.yml .github/workflows/one-time-final-search-placement.yml MIGRATION_TRIGGER.md 2>/dev/null || true
          git add supabase/functions .github/workflows/one-time-final-search-placement.yml
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "refactor: route remaining AI edge functions through gateway"
          git push
