          new = '''const FUNCTIONS_URL = `${import.meta.env.VITE_PUBLIC_SUPABASE_URL}/functions/v1/notebook-copilot`;
const STORAGE_KEY = "gnh-notebook-session-v1";
const RESUMABLE_UPLOAD_THRESHOLD = 6 * 1024 * 1024;
const RESUMABLE_CHUNK_SIZE = 6 * 1024 * 1024;

type UploadProgressHandler = (progress: number) => void;

function getSupabaseResumableEndpoint(): string {
  const configuredUrl = String(import.meta.env.VITE_PUBLIC_SUPABASE_URL || '');
  const hostname = new URL(configuredUrl).hostname;
  const projectRef = hostname.split('.')[0];
  if (!projectRef) throw new Error('Supabase 프로젝트 주소를 확인할 수 없습니다.');
  return `https://${projectRef}.storage.supabase.co/storage/v1/upload/resumable`;
}

function encodeTusMetadata(value: string): string {
  const bytes = new TextEncoder().encode(value);
  let binary = '';
  bytes.forEach(byte => { binary += String.fromCharCode(byte); });
  return btoa(binary);
}

async function uploadNotebookFile(path: string, file: File, onProgress: UploadProgressHandler): Promise<void> {
  if (file.size <= RESUMABLE_UPLOAD_THRESHOLD) {
    const { error } = await supabase.storage.from('notebook-files').upload(path, file, {
      cacheControl: '3600',
      upsert: false,
      contentType: file.type || 'application/octet-stream',
    });
    if (error) throw error;
    onProgress(100);
    return;
  }

  const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
  if (sessionError || !sessionData.session?.access_token) {
    throw sessionError || new Error('로그인 세션이 만료되었습니다. 다시 로그인해주세요.');
  }

  const token = sessionData.session.access_token;
  const endpoint = getSupabaseResumableEndpoint();
  const metadata = [
    `bucketName ${encodeTusMetadata('notebook-files')}`,
    `objectName ${encodeTusMetadata(path)}`,
    `contentType ${encodeTusMetadata(file.type || 'application/octet-stream')}`,
    `cacheControl ${encodeTusMetadata('3600')}`,
  ].join(',');

  const createResponse = await fetch(endpoint, {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${token}`,
      'Tus-Resumable': '1.0.0',
      'Upload-Length': String(file.size),
      'Upload-Metadata': metadata,
    },
  });
  if (!createResponse.ok) throw new Error(`대용량 파일 업로드를 시작하지 못했습니다. (${createResponse.status})`);

  const uploadUrl = createResponse.headers.get('Location');
  if (!uploadUrl) throw new Error('대용량 파일 업로드 주소를 받지 못했습니다.');

  let offset = 0;
  let retries = 0;
  while (offset < file.size) {
    const chunk = file.slice(offset, Math.min(offset + RESUMABLE_CHUNK_SIZE, file.size));
    try {
      const patchResponse = await fetch(uploadUrl, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${token}`,
          'Tus-Resumable': '1.0.0',
          'Content-Type': 'application/offset+octet-stream',
          'Upload-Offset': String(offset),
        },
        body: chunk,
      });
      if (!patchResponse.ok) throw new Error(`파일 조각 업로드에 실패했습니다. (${patchResponse.status})`);
      const nextOffset = Number(patchResponse.headers.get('Upload-Offset'));
      if (!Number.isFinite(nextOffset) || nextOffset <= offset) throw new Error('파일 업로드 진행 위치를 확인하지 못했습니다.');
      offset = nextOffset;
      retries = 0;
      onProgress(Math.min(100, Math.round((offset / file.size) * 100)));
    } catch (error) {
      if (retries >= 3) throw error;
      retries += 1;
      await new Promise(resolve => window.setTimeout(resolve, retries * 1500));
      const headResponse = await fetch(uploadUrl, {
        method: 'HEAD',
        headers: { Authorization: `Bearer ${token}`, 'Tus-Resumable': '1.0.0' },
      });
      if (headResponse.ok) {
        const serverOffset = Number(headResponse.headers.get('Upload-Offset'));
        if (Number.isFinite(serverOffset) && serverOffset >= offset && serverOffset <= file.size) {
          offset = serverOffset;
          onProgress(Math.min(100, Math.round((offset / file.size) * 100)));
        }
      }
    }
  }
}
