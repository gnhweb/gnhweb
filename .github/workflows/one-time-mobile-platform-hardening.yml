name: one-time mobile platform hardening

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'mobile platform hardening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              occurrences = text.count(old)
              if count is not None and occurrences != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {occurrences} for pattern: {old[:120]!r}')
              if count is None and occurrences == 0:
                  raise SystemExit(f'{path}: pattern not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, count if count is not None else -1))

          # 1) BottomTabBar: iOS keyboard listener cleanup + dark mode + safe-area sizing.
          replace(
              'src/components/feature/BottomTabBar.tsx',
              '''    document.addEventListener("focusin", updateKeyboardState);\n    document.addEventListener("focusout", () => {\n      window.setTimeout(updateKeyboardState, 120);\n    });\n\n    return () => {''',
              '''    const handleFocusOut = () => {\n      window.setTimeout(updateKeyboardState, 120);\n    };\n\n    document.addEventListener("focusin", updateKeyboardState);\n    document.addEventListener("focusout", handleFocusOut);\n\n    return () => {''',
              1,
          )
          replace(
              'src/components/feature/BottomTabBar.tsx',
              '''      document.body.classList.remove("ios-keyboard-open");\n      document.removeEventListener("focusin", updateKeyboardState);''',
              '''      document.body.classList.remove("ios-keyboard-open");\n      document.removeEventListener("focusin", updateKeyboardState);\n      document.removeEventListener("focusout", handleFocusOut);''',
              1,
          )
          replace(
              'src/components/feature/BottomTabBar.tsx',
              'className="w-full rounded-t-[20px] bg-white shadow-card-lg border-t border-background-200"',
              'className="w-full rounded-t-[20px] bg-background-100 shadow-card-lg border-t border-background-200 pb-safe"',
              1,
          )
          replace(
              'src/components/feature/BottomTabBar.tsx',
              'className="md:hidden fixed bottom-0 left-0 right-0 z-50 pb-safe"',
              'className="md:hidden fixed bottom-0 left-0 right-0 z-50"',
              1,
          )

          # 2) Layout: make iOS PWA back affordance available outside the menu and in fullscreen games.
          replace(
              'src/components/feature/Layout.tsx',
              'if (!iosPwa || !mobileOpen) return null;',
              'if (!iosPwa || location.pathname === "/") return null;',
              1,
          )
          replace(
              'src/components/feature/Layout.tsx',
              'className="fixed right-[4.25rem] top-[calc(env(safe-area-inset-top)+0.5rem)] z-[100] flex h-10 w-10 items-center justify-center rounded-full bg-background-200 text-foreground-700 shadow-sm active:scale-95"',
              'className="fixed right-[4.5rem] top-[calc(env(safe-area-inset-top)+0.5rem)] z-[100] flex h-10 w-10 items-center justify-center rounded-full bg-background-200 text-foreground-700 shadow-sm active:scale-95"',
              1,
          )
          replace(
              'src/components/feature/Layout.tsx',
              '''  if (isFullscreenGameRoute) {\n    return <Outlet />;\n  }''',
              '''  if (isFullscreenGameRoute) {\n    return (\n      <>\n        <IosPwaBackButton />\n        <Outlet />\n      </>\n    );\n  }''',
              1,
          )
          replace(
              'src/components/feature/Layout.tsx',
              '''        <main className={showNavbar ? 'max-md:pb-24' : ''}>\n          <Outlet />\n        </main>''',
              '''        <main className={showNavbar ? 'max-md:pb-[calc(6rem+env(safe-area-inset-bottom))]' : ''}>\n          <Outlet />\n        </main>''',
              1,
          )

          # 3) Mobile runtime: stop walking the entire body on every mutation; batch only added nodes.
          p = Path('src/mobile-runtime.ts')
          text = p.read_text()
          old = '''  const mo = new MutationObserver((records) => {\n    for (const record of records) {\n      for (const node of record.addedNodes) {\n        if (!(node instanceof Element)) continue;\n        if (node.matches('img')) observe(node.parentElement ?? document);\n        else observe(node);\n      }\n    }\n  });\n  mo.observe(document.body, { childList: true, subtree: true });'''
          new = '''  let queued = false;\n  const pendingRoots = new Set<Element>();\n\n  const flush = () => {\n    queued = false;\n    for (const root of pendingRoots) observe(root);\n    pendingRoots.clear();\n  };\n\n  const mo = new MutationObserver((records) => {\n    for (const record of records) {\n      for (const node of record.addedNodes) {\n        if (!(node instanceof Element)) continue;\n        pendingRoots.add(node);\n      }\n    }\n    if (!queued && pendingRoots.size) {\n      queued = true;\n      const schedule = window.requestIdleCallback || ((cb: IdleRequestCallback) => window.setTimeout(() => cb({ timeRemaining: () => 0 } as IdleDeadline), 0));\n      schedule(flush);\n    }\n  });\n  mo.observe(document.body, { childList: true, subtree: true });'''
          if text.count(old) != 1:
              raise SystemExit('mobile-runtime.ts: mutation observer block changed unexpectedly')
          p.write_text(text.replace(old, new))

          # 4) Mobile CSS: safe dynamic viewport, horizontal clipping and modal scroll chaining protection.
          css = Path('src/index.css')
          c = css.read_text()
          marker = '/* ===== Base Styles ===== */'
          block = '''/* ===== Cross-platform Mobile Hardening ===== */\n@media (max-width: 767px) {\n  html, body {\n    min-height: 100dvh;\n    overflow-x: clip;\n  }\n\n  body {\n    overscroll-behavior-x: none;\n  }\n\n  /* Tailwind viewport utilities that are commonly used by mobile full-screen pages. */\n  .h-screen { height: 100dvh; }\n  .min-h-screen { min-height: 100dvh; }\n\n  /* Keep iOS modal sheets from handing their scroll to the document at the edges. */\n  .overflow-y-auto,\n  .overflow-auto {\n    overscroll-behavior-y: contain;\n    -webkit-overflow-scrolling: touch;\n  }\n\n  /* Prevent browser tap highlight from creating misleading pressed states. */\n  a, button {\n    -webkit-tap-highlight-color: transparent;\n  }\n\n  /* Avoid accidental text selection during fast mobile interactions. */\n  button {\n    touch-action: manipulation;\n  }\n}\n\n'''
          if marker not in c:
              raise SystemExit('index.css: base style marker not found')
          if 'Cross-platform Mobile Hardening' not in c:
              c = c.replace(marker, block + marker, 1)
          css.write_text(c)

          # 5) main.tsx: cleanup global visualViewport listeners on page teardown.
          p = Path('src/main.tsx')
          t = p.read_text()
          old = '''if (typeof window !== 'undefined' && 'visualViewport' in window) {\n  const updateKeyboardState = () => {\n    const vv = window.visualViewport;\n    if (!vv) return;\n    const heightGap = window.innerHeight - vv.height;\n    const keyboardOpen = heightGap > 120;\n    document.body.classList.toggle('keyboard-open', keyboardOpen);\n    document.documentElement.style.setProperty('--visual-viewport-height', `${Math.round(vv.height)}px`);\n  };\n  window.visualViewport?.addEventListener('resize', updateKeyboardState);\n  window.visualViewport?.addEventListener('scroll', updateKeyboardState);\n  window.addEventListener('resize', updateKeyboardState);\n  updateKeyboardState();\n}'''
          new = '''if (typeof window !== 'undefined' && 'visualViewport' in window) {\n  const updateKeyboardState = () => {\n    const vv = window.visualViewport;\n    if (!vv) return;\n    const heightGap = window.innerHeight - vv.height;\n    const keyboardOpen = heightGap > Math.max(120, window.innerHeight * 0.18);\n    document.body.classList.toggle('keyboard-open', keyboardOpen);\n    document.documentElement.style.setProperty('--visual-viewport-height', `${Math.round(vv.height)}px`);\n  };\n  const vv = window.visualViewport;\n  vv?.addEventListener('resize', updateKeyboardState);\n  vv?.addEventListener('scroll', updateKeyboardState);\n  window.addEventListener('resize', updateKeyboardState);\n  updateKeyboardState();\n\n  window.addEventListener('pagehide', () => {\n    vv?.removeEventListener('resize', updateKeyboardState);\n    vv?.removeEventListener('scroll', updateKeyboardState);\n    window.removeEventListener('resize', updateKeyboardState);\n  }, { once: true });\n}'''
          if t.count(old) != 1:
              raise SystemExit('main.tsx: visualViewport block changed unexpectedly')
          p.write_text(t.replace(old, new))
          PY

      - name: Commit hardening changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/BottomTabBar.tsx src/components/feature/Layout.tsx src/mobile-runtime.ts src/index.css src/main.tsx
          git rm .github/workflows/one-time-mobile-platform-hardening.yml
          git commit -m "fix: harden mobile platform behavior"
          git push
