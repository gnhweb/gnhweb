name: Force Bible MBTI rebuild

on:
  push:
    paths:
      - .github/workflows/force-bible-mbti-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch direct Bible MBTI artwork source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/bibleMbti/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = '`/bible-mbti/characters-new/${slug}.svg`'
          new = '`/bible-mbti/characters-new/${slug}.svg?v=20260909-2`'
          if old not in text:
              raise SystemExit('Expected direct Bible MBTI artwork path was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit source touch and remove workflow
        run: |
          rm .github/workflows/force-bible-mbti-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/bibleMbti/page.tsx .github/workflows/force-bible-mbti-rebuild.yml
          git commit -m 'force rebuild of Bible MBTI direct artwork'
          git push origin main
