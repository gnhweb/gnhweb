name: Cleanup temporary Bible Pick workflow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary repair workflow
        run: |
          rm -f .github/workflows/_apply_navbar_requested_changes.yml .github/workflows/_cleanup_bible_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "chore: remove temporary repair workflows" || exit 0
          git push
