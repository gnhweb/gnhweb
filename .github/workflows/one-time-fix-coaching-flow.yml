name: One-time fix coaching flow

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-coaching-flow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix coaching flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('workers/ai-gateway/src/coachingFeature.ts')
          text = path.read_text()

          start = text.index('async function requestGateway(')
          end = text.index('\nexport async function handleNimCoaching', start)
          replacement = '''async function requestGateway(
  messages: Array<{ role: "system" | "user"; content: string }>,
  maxTokens = 3000,
) {
  try {
    const response = await fetch("https://gnhweb-ai-gateway.gemini19840314.workers.dev", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        task: "coaching",
        messages,
        max_tokens: maxTokens,
      }),
    });
    if (!response.ok) return null;
    const data = await response.json() as { choices?: Array<{ message?: { content?: unknown } }> };
    const content = data.choices?.[0]?.message?.content;
    return typeof content === "string" && content.trim().length >= 80 ? content.trim() : null;
  } catch {
    return null;
  }
}
'''
          text = text[:start] + replacement + text[end:]

          old_start = text.index('    const coachingLens = ')
          old_end = text.index('\n    if (finalDraft) return json({ advice: finalDraft });', old_start)
          new_flow = '''    const coachingLens = COACHING_LENSES[Math.floor(Math.random() * COACHING_LENSES.length)];
    const coachingMethod = COACHING_METHODS[Math.floor(Math.random() * COACHING_METHODS.length)];
    const generationNonce = crypto.randomUUID();

    const finalDraft = await requestGateway([
      { role: "system", content: `${buildSystemPrompt(tone)}\\n${buildFinalPrompt(tone)}` },
      {
        role: "user",
        content: `원래 고민:\\n${concern}\\n\\n이번 사고 관점: ${coachingLens}\\n이번 답변 방식: ${coachingMethod}\\n이번 생성 식별자: ${generationNonce}\\n\\n이 답변은 진단 보고서가 아니라 실제 사명자가 지금 사용할 수 있는 코칭이어야 한다. 먼저 사용자의 질문에 대한 결론을 직접 말하고, 그 결론을 뒷받침하는 구체적인 근거를 설명한 뒤, 실제 행동과 필요하면 대화 문장을 제시한다. 사용자가 적은 사실이 부족한 부분은 추측으로 채우지 않는다. 같은 문장이나 '소통해봐 → 대화해봐 → 확인해봐' 같은 기본 답변을 반복하지 말고, 이번 고민에서 가장 중요한 판단을 새롭게 내려라.`,
      },
    ], 3200);
'''
          text = text[:old_start] + new_flow + text[old_end:]

          old = '    if (finalDraft) return json({ advice: finalDraft });\n    return json({ advice: tone === "direct" ? FALLBACK_DIRECT : FALLBACK_EMPATHETIC });'
          new = '    if (finalDraft) return json({ advice: finalDraft });\n    return json({ error: "코칭을 생성하지 못했어요. 잠시 후 다시 시도해주세요." }, 503);'
          if old not in text:
              raise SystemExit('coaching fallback block not found')
          text = text.replace(old, new, 1)

          old = '    return json({ advice: tone === "direct" ? FALLBACK_DIRECT : FALLBACK_EMPATHETIC });\n  }\n}'
          new = '    return json({ error: "코칭을 생성하지 못했어요. 잠시 후 다시 시도해주세요." }, 503);\n  }\n}'
          if old not in text:
              raise SystemExit('coaching catch fallback block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          path = Path('workers/ai-gateway/src/index.ts')
          text = path.read_text()
          old = ''' if(task==="coaching"){
   if(specificWords.length>=2 && matchedSpecificWords===0)return false;
   if(userText.length>=12 && !directAnswerPattern.test(clean.slice(0,900)))return false;
   if(clean.length<120)return false;
   return true;
 }'''
          new = ''' if(task==="coaching"){
   return clean.length>=120;
 }'''
          if old not in text:
              raise SystemExit('coaching quality gate block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Deploy AI gateway
        run: |
          cd workers/ai-gateway
          npm ci
          npx wrangler deploy

      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-fix-coaching-flow.yml
          git add workers/ai-gateway/src/coachingFeature.ts workers/ai-gateway/src/index.ts
          git commit -m "Fix coaching fallback and generation flow" || exit 0
          git push
