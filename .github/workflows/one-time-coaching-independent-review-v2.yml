name: One-time coaching independent review v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch coaching generation flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("workers/ai-gateway/src/coachingFeature.ts")
          text = path.read_text()
          start_marker = "    const firstDraft = await requestGateway(["
          end_marker = "    return json({ advice: finalDraft || firstDraft });"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)

          replacement = '''    const diagnosis = await requestGateway([
      {
        role: "system",
        content: `너는 강릉학생회 리더십 코칭의 원인 분석가다.
최종 답변을 쓰지 말고 내부 분석 자료만 만든다.
사용자의 실제 질문을 1개로 요약하고, 직접 확인되는 사실과 추측을 분리한다.
가능한 원인을 최소 3개 비교하고 각각의 근거를 적는다.
그중 가장 가능성이 높은 원인과 그 판단을 뒤집을 수 있는 반대 증거를 적는다.
마지막으로 이 원인에 맞는 대응 전략을 2개 제안하고 각각의 장단점을 적는다.
'소통 부족'을 기본 원인으로 사용하지 않는다. 근거가 있을 때만 선택한다.
JSON 형식으로만 답한다.`
      },
      {
        role: "user",
        content: `강릉학생회 사명자의 실제 고민을 분석해라.
이번 생성의 사고 관점: ${coachingLens}
이번 답변 방식: ${coachingMethod}
이번 생성 식별자: ${generationNonce}

${concern}`,
      },
    ]);

    if (!diagnosis) return json({ advice: tone === "direct" ? FALLBACK_DIRECT : FALLBACK_EMPATHETIC });

    const finalDraft = await requestGateway([
      {
        role: "system",
        content: `${buildSystemPrompt(tone)}
[독립 최종 작성]
앞의 분석 자료를 문장별로 고쳐 쓰는 방식으로 답하지 않는다. 원래 고민을 다시 읽고 처음부터 최종 코칭을 판단한다.
분석 자료의 결론이 틀렸다고 판단하면 수정한다.
이전 답변과 같은 원인·도입·행동 순서를 반복하지 않는다.
이번 고민의 구체적인 사실을 최소 2개 이상 실제 판단에 사용한다.
질문의 핵심 판단을 첫 부분에서 분명하게 말하고, 실제 학생회 현장에서 언제 누구에게 무엇을 어떻게 할지 구체적으로 제시한다.
질문과 직접 연결되지 않는 일반적인 리더십 강의는 넣지 않는다.`
      },
      {
        role: "user",
        content: `원래 고민:
${concern}

독립 분석 자료:
${diagnosis}

이번 생성의 사고 관점: ${coachingLens}
이번 답변 방식: ${coachingMethod}
이번 생성 식별자: ${generationNonce}

독립 분석 자료를 참고하되 그것을 그대로 답변으로 변환하지 마라. 원래 고민에 대한 최종 답변을 새로 판단해서 작성해라.`
      },
    ]);

    return json({ advice: finalDraft || diagnosis });'''

          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/ai-gateway/src/coachingFeature.ts
          git rm .github/workflows/one-time-coaching-independent-review-v2.yml
          git commit -m "Make coaching final answer independently reasoned"
          git push
