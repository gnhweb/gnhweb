name: Bump Bible MBTI cache
on:
  push:
    branches: [main]
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump MBTI image URL cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/bibleMbtiEnhanced/page.tsx')
          s = p.read_text()
          s2 = s.replace('20260909-4', '20260909-5')
          if s2 == s:
              raise SystemExit('cache version not found')
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/bibleMbtiEnhanced/page.tsx
          git commit -m 'fix Bible MBTI missing image cache'
          git push
