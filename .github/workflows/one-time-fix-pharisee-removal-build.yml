name: One-time fix Pharisee removal build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale JSX from Pharisee GameView
        run: python .github/scripts/remove_pharisee_voice_interrogation.py
      - name: Commit and clean temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/pharisee/GameView.tsx
          git rm -f .github/workflows/one-time-fix-pharisee-removal-build.yml .github/scripts/remove_pharisee_voice_interrogation.py
          git commit -m "fix: complete Pharisee voice and interrogation removal"
          git push
