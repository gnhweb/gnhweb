name: One-time AI gateway deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[ai-gateway-deploy]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy AI gateway Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/ai-gateway
          command: deploy --config wrangler.jsonc
      - name: Remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-ai-gateway-deploy.yml
          git commit -m "Remove one-time AI gateway deploy workflow [ai-gateway-deploy]"
          git push
