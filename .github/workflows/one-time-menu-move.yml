name: one-time-menu-move
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch menu
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/feature/Navbar.tsx')
          s=p.read_text()
          old="""    { path: '/missions/wall', label: '사명 인증 게시판', icon: 'ri-gallery-line' },\n"""
          new=old+"""    { path: '/missions', label: '작은 사명 관리', icon: 'ri-medal-line' },\n    { path: '/missions/leaderboard', label: '이달의 사명왕', icon: 'ri-trophy-line' },\n"""
          assert old in s
          community=s.split('const COMMUNITY_CATEGORY',1)[1].split('const GAME_CATEGORY',1)[0]
          assert "label: '작은 사명 관리'" not in community
          s=s.replace(old,new,1)
          old2="""  { label: '미션', items: [\n    { path: '/missions', label: '작은 사명 관리', icon: 'ri-medal-line' },\n    { path: '/missions/leaderboard', label: '이달의 사명왕', icon: 'ri-trophy-line' },\n  ]},\n"""
          assert old2 in s
          s=s.replace(old2,'',1)
          p.write_text(s)
          PY
          rm .github/workflows/one-time-menu-move.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/feature/Navbar.tsx .github/workflows/one-time-menu-move.yml
          git commit -m "Move mission menu items to community"
          git push
