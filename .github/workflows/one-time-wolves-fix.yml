name: One-time Wolves Stability Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-wolves:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted stability fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/games/wolves-and-sheep/GameManger.ts")
          text = path.read_text(encoding="utf-8")
          original = text

          if "private joinedAt: number;" not in text:
              text = text.replace(
                  '  private subscribed = false;\n',
                  '  private subscribed = false;\n'
                  '  /** 현재 GameManager 인스턴스가 방에 처음 들어온 시각. 재연결/앱 복귀 때도 유지해서 호스트 순서가 흔들리지 않게 한다. */\n'
                  '  private joinedAt: number;\n'
              )

          if "private blockedKillVictims = new Set<string>();" not in text:
              text = text.replace(
                  '  private unbindVisibility: (() => void) | null = null;\n',
                  '  private unbindVisibility: (() => void) | null = null;\n'
                  '  /** 동일한 보호 대상에 대한 동시 kill 이벤트가 중복 도착해 보호가 뚫리는 것을 막는다. */\n'
                  '  private blockedKillVictims = new Set<string>();\n'
              )

          text = text.replace(
              '    this.userName = userName;\n    this.channel = supabase.channel',
              '    this.userName = userName;\n'
              '    this.joinedAt = Date.now();\n'
              '    this.channel = supabase.channel'
          )

          text = text.replace(
              '      joinedAt: Date.now(),\n',
              '      joinedAt: this.joinedAt,\n',
              1,
          )

          text = text.replace(
              '    this.protectedId = null;\n    this.shepherdUsedThisRound = false;',
              '    this.protectedId = null;\n'
              '    this.blockedKillVictims.clear();\n'
              '    this.shepherdUsedThisRound = false;',
              1,
          )

          old = '''  private applyKill(payload: { victimId: string; x: number; y: number; victimName: string }) {\n    if (payload.victimId === this.protectedId) {\n      // 목자의 보호로 생존 — 보호는 1회성으로 소모되고 아무도 이 사실을 알 수 없음\n      this.protectedId = null;\n      this.emit("kill-blocked", payload.victimId);\n      return;\n    }\n    const p = this.players.get(payload.victimId);\n    if (p) p.alive = false;\n    this.deadBodies.push({ id: payload.victimId, x: payload.x, y: payload.y, victimName: payload.victimName });\n    this.emit("player-killed", payload.victimId);\n    this.checkWin();\n  }'''

          new = '''  private applyKill(payload: { victimId: string; x: number; y: number; victimName: string }) {\n    // 네트워크 지연/동시 입력으로 같은 kill 이벤트가 여러 번 들어와도 한 번만 처리한다.\n    if (this.blockedKillVictims.has(payload.victimId)) return;\n\n    const p = this.players.get(payload.victimId);\n    if (!p || !p.alive) return;\n\n    if (payload.victimId === this.protectedId) {\n      // 목자의 보호로 생존 — 같은 순간에 여러 kill 이벤트가 도착해도 모두 차단한다.\n      this.protectedId = null;\n      this.blockedKillVictims.add(payload.victimId);\n      this.emit("kill-blocked", payload.victimId);\n      return;\n    }\n\n    p.alive = false;\n    if (!this.deadBodies.some((body) => body.id === payload.victimId)) {\n      this.deadBodies.push({ id: payload.victimId, x: payload.x, y: payload.y, victimName: payload.victimName });\n    }\n    this.emit("player-killed", payload.victimId);\n    this.checkWin();\n  }'''

          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace(
              '    if (p && !p.alive) {\n      p.alive = true;\n',
              '    if (p && !p.alive) {\n      p.alive = true;\n      this.blockedKillVictims.delete(payload.targetId);\n',
              1,
          )

          if text == original:
              raise SystemExit("No changes were applied")

          if "this.joinedAt = Date.now();" not in text:
              raise SystemExit("joinedAt initialization was not applied")
          if "joinedAt: this.joinedAt" not in text:
              raise SystemExit("joinedAt tracking was not applied")
          if "private blockedKillVictims" not in text:
              raise SystemExit("kill guard field was not applied")
          if "if (!p || !p.alive) return;" not in text:
              raise SystemExit("kill idempotency guard was not applied")

          path.write_text(text, encoding="utf-8")

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/wolves-and-sheep/GameManger.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize wolves and sheep multiplayer state"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-wolves-fix.yml
          git commit -m "chore: remove one-time wolves fix workflow"
          git push
