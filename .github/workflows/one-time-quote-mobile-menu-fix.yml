name: One-time quote mobile menu fix
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor == 'gnhweb' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Patch mobile mission menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/feature/Navbar.tsx')
          s = p.read_text()
          old = '''<div className=\"grid grid-cols-3 gap-1\"><MenuGridCard icon=\"ri-user-star-line\" label=\"리더십 코칭\" colorClass=\"bg-accent-100 text-accent-600\" active={isActive('/leadership-diary')} onClick={() => { navigate('/leadership-diary'); setMobileOpen(false); }} /></div>'''
          new = '''<div className=\"grid grid-cols-2 gap-1\"><MenuGridCard icon=\"ri-user-star-line\" label=\"리더십 코칭\" colorClass=\"bg-accent-100 text-accent-600\" active={isActive('/leadership-diary')} onClick={() => { navigate('/leadership-diary'); setMobileOpen(false); }} /><MenuGridCard icon=\"ri-chat-quote-line\" label=\"어록 관리\" colorClass=\"bg-accent-100 text-accent-600\" active={isActive('/teacher-dashboard/quote-manage')} onClick={() => { navigate('/teacher-dashboard/quote-manage'); setMobileOpen(false); }} /></div>'''
          if old not in s:
              raise SystemExit('actual mobile quote menu block not found')
          p.write_text(s.replace(old, new, 1))
          print('patched mobile quote menu')
          PY
      - run: npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/feature/Navbar.tsx .github/workflows/one-time-quote-mobile-menu-fix.yml
          git commit -m 'fix: show quote management in missioner mobile menu'
          git rm .github/workflows/one-time-quote-mobile-menu-fix.yml
          git commit -m 'chore: remove one-time quote mobile menu workflow'
          git push
