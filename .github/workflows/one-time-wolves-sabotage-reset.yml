name: One-time wolves sabotage reset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reset sabotage state on round transitions
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('src/games/wolves-and-sheep/GameManger.ts')
          s = path.read_text()
          marker = '// WOLVES-SABOTAGE-RESET-V1'
          if marker in s:
              raise SystemExit(0)
          for fn in ['applyReturnToLobby','applyGameStart','applyGameEnd','applyMeetingStart']:
              needle = f'private {fn}('
              pos = s.find(needle)
              if pos < 0:
                  raise RuntimeError(f'{fn} not found')
              brace = s.find('{', pos)
              if brace < 0:
                  raise RuntimeError(f'{fn} brace not found')
              s = s[:brace+1] + '\n    this.activeSabotageKind = null;' + s[brace+1:]
          anchor = '  private isValidCoordinate(value: number, max: number) {\n'
          if anchor not in s:
              raise RuntimeError('hardening helper anchor not found')
          s = s.replace(anchor, '  // WOLVES-SABOTAGE-RESET-V1\n' + anchor, 1)
          path.write_text(s)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add',str(path)], check=True)
          subprocess.run(['git','commit','-m','fix: reset wolves sabotage state across rounds and meetings'], check=True)
          subprocess.run(['git','push'], check=True)
      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-wolves-sabotage-reset.yml
          git commit -m "chore: remove one-time wolves sabotage reset workflow"
          git push
