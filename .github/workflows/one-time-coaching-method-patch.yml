name: One-time coaching method patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch coaching method diversity
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'workers/ai-gateway/src/coachingFeature.ts';
          let text = fs.readFileSync(path, 'utf8');

          const lensMarker = 'const FALLBACK_EMPATHETIC = `';
          const methods = `const COACHING_METHODS = [\n  "핵심 원인 판별형: 가능한 원인 3개를 짧게 비교하고 가장 근거가 강한 원인 1개를 선택한 뒤, 그 원인을 확인할 사실과 대응을 제시한다.",\n  "대화 설계형: 문제 분석보다 실제 대화 설계가 핵심인 경우로 보고, 첫 문장·핵심 전달·경계선 또는 요청·후속 약속까지 실제 문장으로 구성한다.",\n  "리더 자기점검형: 상대를 고치는 것보다 리더 자신의 판단·지시·위임·확인 방식에서 놓친 점을 먼저 찾고, 고칠 부분과 상대의 책임을 분리한다.",\n  "책임 구조형: 누가 무엇을 책임져야 하는지, 역할과 완료 기준이 어디서 흐려졌는지 분석하고 책임을 다시 세우는 방법을 제시한다.",\n  "현장 행동형: 오늘 또는 다음 모임에서 실제로 무엇을 할지 중심으로 판단하고, 행동 순서와 확인 시점을 가장 구체적으로 제시한다.",\n  "반대 가설형: 처음 떠오르는 해석이 틀렸다고 가정하고 최소 2개의 다른 원인을 비교한 뒤, 현재 정보로 가장 타당한 판단을 선택한다.",\n];\n\n`;
          if (!text.includes('const COACHING_METHODS = [')) {
            text = text.replace(lensMarker, methods + lensMarker);
          }

          const oldSelection = 'const coachingLens = COACHING_LENSES[Math.floor(Math.random() * COACHING_LENSES.length)];\n    const generationNonce = crypto.randomUUID();';
          const newSelection = 'const coachingLens = COACHING_LENSES[Math.floor(Math.random() * COACHING_LENSES.length)];\n    const coachingMethod = COACHING_METHODS[Math.floor(Math.random() * COACHING_METHODS.length)];\n    const generationNonce = crypto.randomUUID();';
          if (!text.includes('const coachingMethod = COACHING_METHODS[')) {
            if (!text.includes(oldSelection)) throw new Error('selection marker not found');
            text = text.replace(oldSelection, newSelection);
          }

          const oldFirst = '이번 생성의 사고 관점: ${coachingLens}\\n이번 생성 식별자: ${generationNonce}\\n이 관점은 답변에 그대로 이름 붙여 설명하지 말고 실제 판단 방식에만 반영하라.';
          const newFirst = '이번 생성의 사고 관점: ${coachingLens}\\n이번 답변 방식: ${coachingMethod}\\n이번 생성 식별자: ${generationNonce}\\n사고 관점과 답변 방식은 최종 답변에 이름 붙여 설명하지 말고 실제 판단과 구성에만 반영하라.';
          if (!text.includes('이번 답변 방식: ${coachingMethod}')) {
            if (!text.includes(oldFirst)) throw new Error('first prompt marker not found');
            text = text.replace(oldFirst, newFirst);
          }

          const oldReview = '이번 검수의 사고 관점: ${coachingLens}\\n이번 생성 식별자: ${generationNonce}\\n위 초안을 원래 고민에 맞춰 다시 검수하고, 더 정확한 원인 판단과 실행 방법이 드러나는 최종 답변으로 고쳐라.';
          const newReview = '이번 검수의 사고 관점: ${coachingLens}\\n이번 답변 방식: ${coachingMethod}\\n이번 생성 식별자: ${generationNonce}\\n위 초안을 원래 고민에 맞춰 다시 검수하고, 선택된 답변 방식이 실제 최종 답변의 구조와 판단에 드러나도록 더 정확한 원인 판단과 실행 방법이 드러나는 최종 답변으로 고쳐라.';
          if (!text.includes('이번 검수의 사고 관점: ${coachingLens}\\n이번 답변 방식: ${coachingMethod}')) {
            if (!text.includes(oldReview)) throw new Error('review prompt marker not found');
            text = text.replace(oldReview, newReview);
          }

          const oldFinal = '초안의 구조와 문장을 무조건 유지하지 말고 질문에 가장 적합한 방식으로 다시 구성해라. 특히 초안과 표현·구조·우선순위가 지나치게 같다면 다른 타당한 판단 경로를 선택해 다시 작성하라.';
          const newFinal = '초안의 구조와 문장을 무조건 유지하지 말고 선택된 답변 방식에 맞춰 질문에 가장 적합한 방식으로 다시 구성해라. 특히 초안과 표현·구조·우선순위가 지나치게 같다면 다른 타당한 판단 경로를 선택해 다시 작성하라. 같은 고민이라도 매번 같은 도입·원인·행동 순서를 복사하지 말고, 이번 답변 방식이 요구하는 핵심을 우선하라.';
          if (!text.includes('이번 답변 방식이 요구하는 핵심을 우선하라.')) {
            if (!text.includes(oldFinal)) throw new Error('final prompt marker not found');
            text = text.replace(oldFinal, newFinal);
          }

          fs.writeFileSync(path, text);
          NODE

      - name: Commit coaching patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/ai-gateway/src/coachingFeature.ts
          git diff --cached --quiet || git commit -m 'Diversify leadership coaching reasoning methods'
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm .github/workflows/one-time-coaching-method-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-coaching-method-patch.yml
          git commit -m 'Remove one-time coaching method patch workflow [coaching-method-cleanup]'
          git push
