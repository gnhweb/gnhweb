name: One-time wolves replay fix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/one-time-wolves-reset-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch GameManager replay/reset logic
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/games/wolves-and-sheep/GameManger.ts')
          s = p.read_text()

          s = s.replace(
              '  private pendingTimeouts = new Set<ReturnType<typeof setTimeout>>();\n',
              '  private pendingTimeouts = new Set<ReturnType<typeof setTimeout>>();\n  private lastRoleAssignment: Record<string, Role> | null = null;\n  private returnToLobbyInFlight = false;\n'
          )

          s = s.replace(
              '  returnToLobby() {\n    if (!this.isHost || this.phase !== "ended") return;\n',
              '  returnToLobby() {\n    if (!this.isHost || this.phase !== "ended" || this.returnToLobbyInFlight) return;\n    this.returnToLobbyInFlight = true;\n'
          )

          s = s.replace(
              '    this.winner = null;\n    this.intercessorUsedThisGame = false;\n',
              '    this.winner = null;\n    this.myRole = "sheep";\n    this.taskAssignments = {};\n    this.completedTaskIds = {};\n    this.totalTasksRequired = 0;\n    this.totalTasksCompleted = 0;\n    this.myCompletedTasks.clear();\n    this.meetingReason = "";\n    this.meetingCallType = null;\n    this.meetingEndsAt = 0;\n    this.meetingSubPhase = "discuss";\n    this.meetingVotesResetForReplay();\n    this.killCooldownUntil = 0;\n    this.sabotageCooldownUntil = 0;\n    this.blackoutEndsAt = 0;\n    this.blackoutProgress = 0;\n    this.reactorEndsAt = 0;\n    this.reactorLeftFixed = false;\n    this.reactorRightFixed = false;\n    this.doorLockEndsAt = 0;\n    this.candleEndsAt = 0;\n    this.candleAProgress = 0;\n    this.candleBProgress = 0;\n    this.candleAFixed = false;\n    this.candleBFixed = false;\n    this.pipeEndsAt = 0;\n    this.pipeAFixed = false;\n    this.pipeBFixed = false;\n    this.intercessorUsedThisGame = false;\n'
          )

          s = s.replace(
              '    this.phase = "lobby";\n    this.emit("phase-change", "lobby");\n',
              '    this.phase = "lobby";\n    this.returnToLobbyInFlight = false;\n    this.emit("phase-change", "lobby");\n'
          )

          marker = '  // ---------- game start ----------\n'
          helper = '''  private meetingVotesResetForReplay() {\n    this.votes.clear();\n    this.chatLog = [];\n    this.ghostChatLog = [];\n  }\n\n  private shuffleIds(ids: string[]) {\n    const shuffled = [...ids];\n    for (let i = shuffled.length - 1; i > 0; i -= 1) {\n      const j = Math.floor(Math.random() * (i + 1));\n      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];\n    }\n    return shuffled;\n  }\n\n  private sameRoleAssignment(a: Record<string, Role> | null, b: Record<string, Role>) {\n    if (!a) return false;\n    const aIds = Object.keys(a);\n    const bIds = Object.keys(b);\n    if (aIds.length !== bIds.length) return false;\n    return aIds.every((id) => a[id] === b[id]);\n  }\n\n'''
          if helper not in s:\n              s = s.replace(marker, helper + marker)

          s = s.replace(
              '  startGame() {\n    if (!this.isHost || this.presenceOrder.length < 3) return;\n    const ids = this.presenceOrder.map((p) => p.id);\n    const shuffled = [...ids].sort(() => Math.random() - 0.5);\n',
              '  startGame() {\n    if (!this.isHost || this.phase !== "lobby" || this.presenceOrder.length < 3) return;\n    const ids = this.presenceOrder.map((p) => p.id);\n    let shuffled = this.shuffleIds(ids);\n'
          )

          old = '''    const roles: Record<string, Role> = {};\n    wolfIds.forEach((id, i) => {\n      roles[id] = useSpecial && i === 0 ? "falseProphet" : "wolf";\n    });\n    sheepIds.forEach((id, i) => {\n      if (useSpecial && i === 0) roles[id] = "shepherd";\n      else if (useSpecial && i === 1 && sheepIds.length >= 2) roles[id] = "prophet";\n      else if (useSpecial && useIntercessor && i === 2 && sheepIds.length >= 3) roles[id] = "intercessor";\n      else roles[id] = "sheep";\n    });\n'''

          new = '''    let roles: Record<string, Role> = {};\n    for (let attempt = 0; attempt < 12; attempt += 1) {\n      if (attempt > 0) shuffled = this.shuffleIds(ids);\n      const candidateWolfCount = Math.max(1, Math.floor(ids.length / 4));\n      const candidateWolfIds = shuffled.slice(0, candidateWolfCount);\n      const candidateSheepIds = shuffled.slice(candidateWolfCount);\n      const candidate: Record<string, Role> = {};\n      candidateWolfIds.forEach((id, i) => {\n        candidate[id] = useSpecial && i === 0 ? "falseProphet" : "wolf";\n      });\n      candidateSheepIds.forEach((id, i) => {\n        if (useSpecial && i === 0) candidate[id] = "shepherd";\n        else if (useSpecial && i === 1 && candidateSheepIds.length >= 2) candidate[id] = "prophet";\n        else if (useSpecial && useIntercessor && i === 2 && candidateSheepIds.length >= 3) candidate[id] = "intercessor";\n        else candidate[id] = "sheep";\n      });\n      roles = candidate;\n      if (!this.sameRoleAssignment(this.lastRoleAssignment, roles) || attempt === 11) break;\n    }\n    const wolfIds = Object.entries(roles).filter(([, role]) => isWolfFaction(role)).map(([id]) => id);\n    const sheepIds = Object.entries(roles).filter(([, role]) => isSheepFaction(role)).map(([id]) => id);\n    this.lastRoleAssignment = { ...roles };\n'''
          if old not in s:
              raise SystemExit('role block not found')
          s = s.replace(old, new)

          s = s.replace(
              '    const wolfCount = Math.max(1, Math.floor(ids.length / 4));\n    const wolfIds = shuffled.slice(0, wolfCount);\n    const sheepIds = shuffled.slice(wolfCount);\n',
              ''
          )

          p.write_text(s)

      - name: Patch mobile search placement and label
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/feature/Navbar.tsx')
          s = p.read_text()

          s = s.replace('aria-label="사이트 검색"', 'aria-label="검색"')
          s = s.replace('aria-label="사이트 검색 열기"', 'aria-label="검색"')
          s = s.replace('title="사이트 검색"', 'title="검색"')

          old_mobile_actions = '''            <div className="flex md:hidden items-center gap-2">
              {user && <button onClick={() => setNotificationsOpen(!notificationsOpen)} className="w-9 h-9 rounded-full flex items-center justify-center hover:bg-background-200 transition-colors cursor-pointer relative"><i className="ri-notification-3-line text-lg text-foreground-600"></i><AnimatePresence>{notificationCount > 0 && <motion.span key={notificationCount} initial={{ scale: 0.6 }} animate={{ scale: [1.25, 1] }} transition={{ duration: 0.25, ease: 'easeOut' }} className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-gradient-to-br from-accent-500 to-primary-500 text-white text-[9px] font-bold flex items-center justify-center shadow-card">{notificationCount > 99 ? '99+' : notificationCount}</motion.span></AnimatePresence></button>}
              <button onClick={() => setMobileOpen(!mobileOpen)} className="w-9 h-9 rounded-full flex items-center justify-center hover:bg-background-200 transition-colors cursor-pointer"><i className={`text-xl text-foreground-700 ${mobileOpen ? 'ri-close-line' : 'ri-menu-line'}`}></i></button>
            </div>'''

          new_mobile_actions = '''            <div className="flex md:hidden items-center gap-1.5">
              <button type="button" onClick={() => { setNotificationsOpen(false); setMobileOpen(false); navigate('/search'); }} aria-label="검색" title="검색" className="w-10 h-10 rounded-full flex items-center justify-center hover:bg-background-200 active:bg-background-200 transition-colors cursor-pointer"><i className="ri-search-line text-[20px] text-foreground-700"></i></button>
              {user && <button onClick={() => setNotificationsOpen(!notificationsOpen)} className="w-10 h-10 rounded-full flex items-center justify-center hover:bg-background-200 transition-colors cursor-pointer relative"><i className="ri-notification-3-line text-lg text-foreground-600"></i><AnimatePresence>{notificationCount > 0 && <motion.span key={notificationCount} initial={{ scale: 0.6 }} animate={{ scale: [1.25, 1] }} transition={{ duration: 0.25, ease: 'easeOut' }} className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-gradient-to-br from-accent-500 to-primary-500 text-white text-[9px] font-bold flex items-center justify-center shadow-card">{notificationCount > 99 ? '99+' : notificationCount}</motion.span></AnimatePresence></button>}
              <button onClick={() => setMobileOpen(!mobileOpen)} aria-label={mobileOpen ? '메뉴 닫기' : '메뉴 열기'} title={mobileOpen ? '메뉴 닫기' : '메뉴 열기'} className="w-10 h-10 rounded-full flex items-center justify-center hover:bg-background-200 transition-colors cursor-pointer"><i className={`text-xl text-foreground-700 ${mobileOpen ? 'ri-close-line' : 'ri-menu-line'}`}></i></button>
            </div>'''

          if old_mobile_actions not in s:
              raise SystemExit('mobile action block not found')
          s = s.replace(old_mobile_actions, new_mobile_actions, 1)

          old_mobile_search = '''              <form onSubmit={(e) => { e.preventDefault(); const q = globalSearch.trim(); navigate(q ? `/search?q=${encodeURIComponent(q)}` : '/search'); setMobileOpen(false); }} className="relative mb-4">
                <i className="ri-search-line pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-lg text-foreground-400"></i>
                <input value={globalSearch} onChange={(e) => setGlobalSearch(e.target.value)} placeholder="사이트 검색" enterKeyHint="search" autoComplete="off" className="w-full rounded-2xl border border-background-200 bg-background-100 py-3.5 pl-11 pr-4 text-[16px] outline-none focus:border-primary-300 focus:ring-4 focus:ring-primary-50" />
              </form>
'''
          if old_mobile_search not in s:
              raise SystemExit('mobile search form not found')
          s = s.replace(old_mobile_search, '', 1)

          p.write_text(s)

          sp = Path('src/pages/search/page.tsx')
          ss = sp.read_text()
          ss = ss.replace('>사이트 검색</h1>', '>검색</h1>')
          ss = ss.replace('aria-label="사이트 검색"', 'aria-label="검색"')
          sp.write_text(ss)

      - name: Check TypeScript source
        run: |
          grep -n "ri-search-line" src/components/feature/Navbar.tsx
          grep -n ">검색</h1>" src/pages/search/page.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/wolves-and-sheep/GameManger.ts src/components/feature/Navbar.tsx src/pages/search/page.tsx
          git commit -m "fix: move mobile search to navbar and rename search" || exit 0
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/one-time-wolves-reset-fix.yml || true
          git rm .github/workflows/one-time-navbar-search-fix.yml || true
          git commit -m "chore: remove one-time fix workflows" || true
          git push || true

# one-time trigger
