name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_CF_REALTIME_URL: https://gnhweb-realtime.gemini19840314.workers.dev

jobs:
  deploy-site:
    name: Deploy gnhweb site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Deploy site Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc

  deploy-realtime:
    name: Deploy gnhweb realtime Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy realtime Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/realtime
          command: deploy --config wrangler.jsonc

  deploy-storage:
    name: Deploy gnhweb storage Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy storage Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/storage
          command: deploy --config wrangler.jsonc

  deploy-api:
    name: Deploy gnhweb API Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/api
          command: deploy --config wrangler.jsonc

  deploy-ai-gateway:
    name: Deploy gnhweb AI gateway Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy AI gateway Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/ai-gateway
          command: deploy --config wrangler.jsonc

  verify-ai-gateway:
    name: Verify gnhweb AI gateway /nim-mbti POST
    needs: deploy-ai-gateway
    runs-on: ubuntu-latest
    steps:
      - name: POST /nim-mbti smoke test
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --request POST --header 'Content-Type: application/json' --data '{"answers":["1"]}' 'https://gnhweb-ai-gateway.gemini19840314.workers.dev/nim-mbti')
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"character"'

  verify-prayer-relay:
    name: Verify gnhweb API /prayer-relay
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: GET /prayer-relay smoke test
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --request GET 'https://gnhweb-api.gemini19840314.workers.dev/prayer-relay?status=active&limit=1')
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"relays"'

  verify-quiz-leaderboard:
    name: Verify gnhweb API /quiz-leaderboard
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: GET /quiz-leaderboard smoke test
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --request GET 'https://gnhweb-api.gemini19840314.workers.dev/quiz-leaderboard?monthly=true&limit=1')
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"scores"'

  verify-quiz-report:
    name: Verify gnhweb API /quiz-report auth guard
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: POST /quiz-report without auth must be rejected
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/quiz-report-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"question_text":"smoke test"}' 'https://gnhweb-api.gemini19840314.workers.dev/quiz-report')
          cat /tmp/quiz-report-response.json
          test "$status" = "401"

  verify-streak-tracker:
    name: Verify gnhweb API /streak-tracker
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: GET /streak-tracker smoke test
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --request GET 'https://gnhweb-api.gemini19840314.workers.dev/streak-tracker')
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"individual"'

  verify-bible-streak-update:
    name: Verify gnhweb API /bible-streak-update auth guard
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: POST /bible-streak-update without auth must be rejected
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/bible-streak-update-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"userId":"smoke-test"}' 'https://gnhweb-api.gemini19840314.workers.dev/bible-streak-update')
          cat /tmp/bible-streak-update-response.json
          test "$status" = "401"

  verify-bible-pick-v2:
    name: Verify gnhweb API /bible-pick-v2 auth-safe response
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: POST /bible-pick-v2 smoke test
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --request POST --header 'Content-Type: application/json' --data '{"userText":"시험 결과가 걱정돼요"}' 'https://gnhweb-api.gemini19840314.workers.dev/bible-pick-v2')
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"reference"'
