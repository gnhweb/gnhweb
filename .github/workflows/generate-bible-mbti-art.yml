name: Generate Bible MBTI figure assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip mbti art]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore supplied figure crops
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/figures public/bible-mbti/figures
          base64 -d public/bible-mbti/figures.bundle.b64 > /tmp/figures.tgz
          tar -xzf /tmp/figures.tgz -C /tmp/figures
          cp /tmp/figures/*.webp public/bible-mbti/figures/

      - name: Apply direct per-figure image rules
        shell: bash
        run: |
          set -euo pipefail
          cat > src/bible-mbti-supplied-art.css <<'EOF'
/* Bible MBTI: use the supplied 20-person artwork as one independent image per result slot. */
svg[aria-label$="성경인물 프로필"] {
  background-color: transparent;
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
}
svg[aria-label$="성경인물 프로필"] > * { visibility: hidden; }
svg[aria-label*="모세 성경인물 프로필"] { background-image: url("/bible-mbti/figures/moses.webp"); }
svg[aria-label*="아브라함 성경인물 프로필"] { background-image: url("/bible-mbti/figures/abraham.webp"); }
svg[aria-label*="여호수아 성경인물 프로필"] { background-image: url("/bible-mbti/figures/joshua.webp"); }
svg[aria-label*="다윗 성경인물 프로필"] { background-image: url("/bible-mbti/figures/david.webp"); }
svg[aria-label*="요셉 성경인물 프로필"] { background-image: url("/bible-mbti/figures/joseph.webp"); }
svg[aria-label*="룻 성경인물 프로필"] { background-image: url("/bible-mbti/figures/ruth.webp"); }
svg[aria-label*="에스더 성경인물 프로필"] { background-image: url("/bible-mbti/figures/esther.webp"); }
svg[aria-label*="다니엘 성경인물 프로필"] { background-image: url("/bible-mbti/figures/daniel.webp"); }
svg[aria-label*="바울 성경인물 프로필"] { background-image: url("/bible-mbti/figures/paul.webp"); }
svg[aria-label*="베드로 성경인물 프로필"] { background-image: url("/bible-mbti/figures/peter.webp"); }
svg[aria-label*="느헤미야 성경인물 프로필"] { background-image: url("/bible-mbti/figures/nehemiah.webp"); }
svg[aria-label*="디모데 성경인물 프로필"] { background-image: url("/bible-mbti/figures/timothy.webp"); }
svg[aria-label*="바나바 성경인물 프로필"] { background-image: url("/bible-mbti/figures/barnabas.webp"); }
svg[aria-label*="마리아 성경인물 프로필"] { background-image: url("/bible-mbti/figures/mary.webp"); }
svg[aria-label*="엘리야 성경인물 프로필"] { background-image: url("/bible-mbti/figures/elijah.webp"); }
svg[aria-label*="이사야 성경인물 프로필"] { background-image: url("/bible-mbti/figures/isaiah.webp"); }
svg[aria-label*="예레미야 성경인물 프로필"] { background-image: url("/bible-mbti/figures/jeremiah.webp"); }
svg[aria-label*="사무엘 성경인물 프로필"] { background-image: url("/bible-mbti/figures/samuel.webp"); }
svg[aria-label*="마르다 성경인물 프로필"] { background-image: url("/bible-mbti/figures/martha.webp"); }
svg[aria-label*="요한 성경인물 프로필"] { background-image: url("/bible-mbti/figures/john.webp"); }
EOF

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/bible-mbti/figures src/bible-mbti-supplied-art.css
          rm -f public/bible-mbti/figures.bundle.b64
          git add public/bible-mbti/figures.bundle.b64
          git rm -f .github/workflows/generate-bible-mbti-art.yml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'fix: use individual supplied Bible MBTI figure assets [skip mbti art]'
          git push origin HEAD:main
