name: Generate Bible MBTI figure assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip mbti art]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore supplied figure crops
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/figures public/bible-mbti/figures
          cat > /tmp/figures.tgz.b64 <<'EOF'
[...]
EOF
          base64 -d /tmp/figures.tgz.b64 > /tmp/figures.tgz
          tar -xzf /tmp/figures.tgz -C /tmp/figures
          cp /tmp/figures/*.webp public/bible-mbti/figures/

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/bible-mbti/figures
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'fix: split Bible MBTI supplied artwork into individual assets [skip mbti art]'
          git push origin HEAD:main
