name: Generate Bible MBTI figure assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip mbti art]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate independent figure assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 <<'PY'
          import base64, pathlib, re, subprocess
          from PIL import Image

          svg = subprocess.check_output(['git', 'show', 'da2402ea47a9e7ea3434d297ffdd9f4baf9d3252:public/bible-mbti/characters.svg'], text=True)
          match = re.search(r'data:image/webp;base64,([^\" ]+)', svg)
          if not match:
              raise SystemExit('reference characters.svg does not contain an embedded WebP image')
          encoded = match.group(1)
          if len(encoded) % 4:
              raise SystemExit(f'reference characters.svg has invalid base64 length: {len(encoded)}')
          raw = base64.b64decode(encoded, validate=True)
          pathlib.Path('/tmp/sheet.webp').write_bytes(raw)
          sheet = Image.open('/tmp/sheet.webp').convert('RGBA')
          print('reference source sheet:', sheet.size)
          if sheet.size[0] < 5 or sheet.size[1] < 4:
              raise SystemExit('reference source sheet is too small for the 5x4 figure grid')

          names = ['moses','abraham','joshua','david','joseph','ruth','esther','daniel','paul','peter','nehemiah','timothy','barnabas','mary','elijah','isaiah','jeremiah','samuel','martha','john']
          out_dir = pathlib.Path('public/bible-mbti/figures')
          out_dir.mkdir(parents=True, exist_ok=True)
          w, h = sheet.size
          cell_w, cell_h = w / 5, h / 4
          for i, name in enumerate(names):
              row, col = divmod(i, 5)
              left, top = round(col * cell_w), round(row * cell_h)
              right, bottom = round((col + 1) * cell_w), round((row + 1) * cell_h)
              crop = sheet.crop((left, top, right, bottom)).resize((160,160), Image.Resampling.LANCZOS)
              png = pathlib.Path('/tmp') / f'{name}.png'
              crop.save(png, 'PNG', optimize=True)
              data = base64.b64encode(png.read_bytes()).decode('ascii')
              doc = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img"><image href="data:image/png;base64,{data}" width="160" height="160"/></svg>\n'''
              (out_dir / f'{name}.svg').write_text(doc, encoding='utf-8')
          print('generated', len(names), 'figure assets')
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/bible-mbti/figures
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'fix: split Bible MBTI supplied artwork into individual assets [skip mbti art]'
          git push origin HEAD:main
