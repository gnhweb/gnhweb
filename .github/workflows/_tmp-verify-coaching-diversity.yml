name: _tmp verify coaching diversity

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Call production coaching three times
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          url='https://gnhweb-ai-gateway.gemini19840314.workers.dev/nim-coaching'
          payload=json.dumps({'concern':'동아리원이 맡은 일을 계속 미루고 내 말을 잘 듣지 않아요. 여러 번 부탁했는데도 달라지지 않습니다. 이 상황의 원인이 무엇인지 찾고 제가 어떻게 행동해야 하는지 알려주세요.','tone':'direct'})
          answers=[]
          for i in range(3):
              raw=subprocess.check_output(['curl','-fsS','-X','POST',url,'-H','Content-Type: application/json','--data',payload], text=True)
              data=json.loads(raw)
              advice=data.get('advice','').strip()
              print(f'--- response {i+1} ---')
              print(advice)
              assert len(advice) >= 120
              answers.append(advice)
          unique=len(set(answers))
          print(f'unique_answers={unique}/3')
          assert unique >= 2, 'Three production coaching responses were identical'
          PY
