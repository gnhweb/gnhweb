name: One-time account recovery login patch

on:
  push:
    branches: [account-password-migration]

permissions:
  contents: write

jobs:
  patch-login:
    if: ${{ !contains(github.event.head_commit.message, 'apply legacy login migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account-password-migration
          fetch-depth: 0

      - name: Patch login fallback
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/login/page.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const needle = `const { error: err, user: signedInUser } = await signIn(email, password);\n        if (signedInUser) {`;
          const replacement = `let { error: err, user: signedInUser } = await signIn(email, password);\n        if (!signedInUser && err) {\n          const apiUrl = String(import.meta.env.VITE_CLOUDFLARE_API_URL || 'https://gnhweb-api.gemini19840314.workers.dev').trim();\n          const anonKey = String(import.meta.env.VITE_PUBLIC_SUPABASE_ANON_KEY || '').trim();\n          if (apiUrl && anonKey) {\n            try {\n              const migrationResponse = await fetch(\`${apiUrl}/account-password-migration\`, {\n                method: 'POST',\n                headers: { 'Content-Type': 'application/json' },\n                body: JSON.stringify({ email, password, anonKey }),\n              });\n              if (migrationResponse.ok) {\n                const retry = await signIn(email, password);\n                err = retry.error;\n                signedInUser = retry.user;\n              }\n            } catch (migrationError) {\n              console.warn('[Login] Legacy password migration unavailable:', migrationError);\n            }\n          }\n        }\n        if (signedInUser) {`;
          if (!source.includes(needle)) throw new Error('Expected login block not found');
          source = source.replace(needle, replacement);
          fs.writeFileSync(path, source);
          NODE

      - name: Commit patched login
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/login/page.tsx
          git diff --cached --quiet || git commit -m "fix: apply legacy login migration"
          git push origin account-password-migration
