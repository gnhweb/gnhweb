name: One-time deploy current main

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  dispatch-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/gnhweb/gnhweb/actions/workflows/deploy-cloudflare.yml/dispatches" \
            -d '{"ref":"main"}'
