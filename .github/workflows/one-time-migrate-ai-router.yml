name: One-time migrate NIM functions to AI router

on:
  push:
    paths:
      - .github/workflows/one-time-migrate-ai-router.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rewrite provider endpoint
        shell: python
        run: |
          from pathlib import Path
          old = 'https://integrate.api.nvidia.com/v1/chat/completions'
          new = 'https://ceearwcfvcbjhmkuuqzv.supabase.co/functions/v1/ai-gateway'
          changed = []
          for p in sorted(Path('supabase/functions').glob('nim-*/index.ts')):
              s = p.read_text(encoding='utf-8')
              ns = s.replace(old, new)
              ns = ns.replace('Authorization: `Bearer ${apiKey}`', 'Authorization: req.headers.get("Authorization") || ""')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              raise SystemExit('No NIM functions needed migration')
          print('\n'.join(changed))

      - name: Validate
        run: |
          if grep -R -n "https://integrate.api.nvidia.com/v1/chat/completions" supabase/functions/nim-*/index.ts; then exit 1; fi
          grep -R -n "functions/v1/ai-gateway" supabase/functions/nim-*/index.ts | head -50
          git diff --check

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/nim-*/index.ts
          git commit -m "feat: route NIM functions through AI gateway"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-migrate-ai-router.yml
          git commit -m "chore: remove one-time AI router migration workflow"
          git push
