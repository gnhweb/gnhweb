name: Apply home UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch home page
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/home/page.tsx';
          let s = fs.readFileSync(path, 'utf8');
          if (!s.includes("import LeaderboardModal from '@/pages/bibleQuiz/components/LeaderboardModal';")) {
            s = s.replace("import { useIsMobile } from '@/hooks/useIsMobile';\n", "import { useIsMobile } from '@/hooks/useIsMobile';\nimport LeaderboardModal from '@/pages/bibleQuiz/components/LeaderboardModal';\n");
          }
          if (!s.includes('const [showLeaderboard, setShowLeaderboard]')) {
            s = s.replace('  const [attendanceError, setAttendanceError] = useState(false);\n', '  const [attendanceError, setAttendanceError] = useState(false);\n  const [showLeaderboard, setShowLeaderboard] = useState(false);\n');
          }
          const start = s.indexOf('      {/* ═══ 5-0. 확정된 지난달 수상 동아리');
          const end = s.indexOf('      {/* ═══ 7. 오늘의 출석 현황 요약 ═══ */}', start);
          if (start < 0 || end < 0) throw new Error('ranking markers not found');
          const block = `      {/* ═══ 홈 상단 핵심: 확정 수상 + 실시간 랭킹 ═══ */}\n      {(confirmedQuiz || confirmedMarathon) && (\n        <section className="max-w-6xl mx-auto px-4 md:px-6 mt-8 mb-6">\n          <div className="relative overflow-hidden rounded-card border border-accent-300/40 bg-background-100 shadow-card-lg">\n            <div className="absolute -right-16 -top-20 h-48 w-48 rounded-full bg-accent-400/10 blur-2xl" />\n            <div className="relative p-4 md:p-6">\n              <div className="flex items-center justify-between gap-3 mb-4">\n                <div className="flex items-center gap-3 min-w-0"><span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-card bg-accent-500 text-white shadow-card"><i className="ri-award-fill text-lg" /></span><div className="min-w-0"><p className="text-[10px] font-bold tracking-[0.14em] text-accent-600 dark:text-accent-300">HONOR ROLL</p><h2 className="text-base md:text-lg font-black text-foreground-950 truncate">{confirmedQuiz?.month ?? confirmedMarathon?.month}월 확정 수상</h2></div></div>\n                <Link to="/hall-of-fame" className="shrink-0 inline-flex min-h-11 items-center gap-1 rounded-chip px-3 text-xs font-bold text-accent-700 dark:text-accent-200 hover:bg-accent-50 dark:hover:bg-accent-900/30">명예의 전당 <i className="ri-arrow-right-line" /></Link>\n              </div>\n              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">\n                {confirmedQuiz && <div className="rounded-card border border-accent-300/30 bg-background-50 dark:bg-background-200/70 p-4"><p className="text-[10px] font-bold text-accent-600 dark:text-accent-300 flex items-center gap-1"><i className="ri-trophy-fill" /> 성경퀴즈 1위</p><p className="mt-1 font-black text-base md:text-lg text-foreground-950 truncate">{confirmedQuiz.club_label}</p><p className="mt-0.5 text-xs font-semibold text-foreground-600 dark:text-foreground-300">{confirmedQuiz.value.toLocaleString()}점</p></div>}\n                {confirmedMarathon && <div className="rounded-card border border-primary-300/30 bg-background-50 dark:bg-background-200/70 p-4"><p className="text-[10px] font-bold text-primary-600 dark:text-primary-300 flex items-center gap-1"><i className="ri-book-open-fill" /> 성경완독 1위</p><p className="mt-1 font-black text-base md:text-lg text-foreground-950 truncate">{confirmedMarathon.club_label}</p><p className="mt-0.5 text-xs font-semibold text-foreground-600 dark:text-foreground-300">{confirmedMarathon.value.toLocaleString()}장 완독</p></div>}\n              </div>\n            </div>\n          </div>\n        </section>\n      )}\n\n      <section className="max-w-6xl mx-auto px-4 md:px-6 mb-8">\n        <div className="relative overflow-hidden rounded-card bg-gradient-to-br from-background-100 via-background-100 to-background-200 border border-background-300 shadow-card-lg">\n          <div className="absolute -left-20 -top-20 h-48 w-48 rounded-full bg-primary-500/10 blur-2xl" /><div className="absolute -right-16 -bottom-20 h-48 w-48 rounded-full bg-accent-500/10 blur-2xl" />\n          <div className="relative p-4 md:p-6">\n            <div className="flex items-end justify-between gap-3 mb-4">\n              <div><div className="flex items-center gap-2 mb-1.5"><span className="inline-flex h-8 w-8 items-center justify-center rounded-card bg-accent-500 text-white shadow-card"><i className="ri-bar-chart-grouped-line" /></span><p className="text-[10px] font-black tracking-[0.14em] text-accent-600 dark:text-accent-300">LIVE RANKING</p></div><h2 className="text-xl md:text-2xl font-black text-foreground-950">{new Date().getMonth() + 1}월 실시간 성경 랭킹</h2><p className="mt-1 text-xs text-foreground-600 dark:text-foreground-300">지금 이 순간의 순위입니다. 이번 달이 끝나면 자동으로 확정돼요.</p></div>\n              <span className="hidden sm:inline-flex items-center gap-1.5 rounded-chip bg-primary-100 dark:bg-primary-900/40 px-3 py-1.5 text-[10px] font-black text-primary-700 dark:text-primary-200"><span className="h-1.5 w-1.5 rounded-full bg-primary-500 animate-pulse" /> 실시간</span>\n            </div>\n            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">\n              {monthlyChampion && <div className="relative overflow-hidden rounded-card bg-gradient-to-br from-accent-400 via-accent-500 to-accent-700 p-4 md:p-5 shadow-card-lg"><div className="absolute -right-8 -top-8 h-28 w-28 rounded-full bg-white/10" /><div className="relative flex items-center justify-between gap-3"><div className="flex items-center gap-2.5 min-w-0"><span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-card bg-white/15 text-white backdrop-blur"><i className="ri-trophy-fill text-xl" /></span><div className="min-w-0"><p className="text-[10px] font-bold text-white/80">성경퀴즈 1위</p><p className="text-lg font-black text-white truncate">{monthlyChampion.topClub.club_name}</p></div></div><span className="shrink-0 text-sm font-black text-white">{monthlyChampion.topClub.total_score.toLocaleString()}점</span></div></div>}\n              {marathonChampion && <div className="relative overflow-hidden rounded-card bg-gradient-to-br from-primary-500 via-primary-600 to-primary-800 p-4 md:p-5 shadow-card-lg"><div className="absolute -right-8 -top-8 h-28 w-28 rounded-full bg-white/10" /><div className="relative flex items-center justify-between gap-3"><div className="flex items-center gap-2.5 min-w-0"><span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-card bg-white/15 text-white backdrop-blur"><i className="ri-book-open-fill text-xl" /></span><div className="min-w-0"><p className="text-[10px] font-bold text-white/80">성경완독 1위</p><p className="text-lg font-black text-white truncate">{marathonChampion.label}</p></div></div><span className="shrink-0 text-sm font-black text-white">{marathonChampion.chapters.toLocaleString()}장</span></div></div>}\n            </div>\n            <button type="button" onClick={() => setShowLeaderboard(true)} className="mt-3 flex min-h-14 w-full items-center justify-between gap-3 rounded-card border border-primary-300/40 bg-background-50/90 dark:bg-background-200/80 px-4 md:px-5 text-left shadow-card transition-all hover:border-primary-400/60 hover:shadow-card-lg active:scale-[0.99] cursor-pointer"><span className="flex items-center gap-3 min-w-0"><span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-card bg-primary-500 text-white shadow-card"><i className="ri-trophy-line text-lg" /></span><span className="min-w-0"><span className="block text-sm font-black text-foreground-950">실시간 리더보드</span><span className="block text-[11px] text-foreground-600 dark:text-foreground-300 truncate">전체 순위를 지금 바로 확인해보세요</span></span></span><i className="ri-arrow-right-line shrink-0 text-primary-600 dark:text-primary-300 text-xl" /></button>\n          </div>\n        </div>\n      </section>\n\n`;
          s = s.slice(0, start) + block + s.slice(end);
          const clubStart = s.indexOf('      {/* ═══ 3. 동아리 소개 ═══ */}');
          const attendanceStart = s.indexOf('      {/* ═══ 7. 오늘의 출석 현황 요약 ═══ */}');
          if (clubStart < 0 || attendanceStart < 0 || clubStart > attendanceStart) throw new Error('section markers not found');
          const club = s.slice(clubStart, attendanceStart);
          s = s.slice(0, clubStart) + s.slice(attendanceStart);
          const footer = s.indexOf('      {/* ═══ Footer ═══ */}');
          s = s.slice(0, footer) + club + `\n      <LeaderboardModal isOpen={showLeaderboard} onClose={() => setShowLeaderboard(false)} />\n\n` + s.slice(footer);
          fs.writeFileSync(path, s);
          NODE
          git rm .github/workflows/home-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/home/page.tsx
          git commit -m "feat: upgrade home ranking layout"
          git push origin HEAD:main
