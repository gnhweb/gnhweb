name: Apply requested Navbar changes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested Navbar changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/feature/Navbar.tsx')
          s = p.read_text()
          old_faith = """  { path: '/faith-storybook', label: '신앙 스토리북', icon: 'ri-bookmark-line' },
  { path: '/faith-journal', label: '신앙 일지', icon: 'ri-edit-line' },
  { path: '/repentance-journal', label: '회개 저널', icon: 'ri-hand-heart-line' },
"""
          new_faith = """  { path: '/faith-journal', label: '신앙일기', icon: 'ri-edit-line' },
"""
          old_mission = """    { path: '/pds-planner', label: '행사 기획 마법사', icon: 'ri-todo-line' },
    { path: '/event-ideas', label: '행사 기획 아이디어', icon: 'ri-lightbulb-flash-line' },
"""
          if old_faith not in s or old_mission not in s:
              raise SystemExit('Expected original Navbar blocks were not found')
          s = s.replace(old_faith, new_faith, 1).replace(old_mission, '', 1)
          p.write_text(s)
          PY
          rm .github/workflows/_apply_navbar_requested_changes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/Navbar.tsx .github/workflows/_apply_navbar_requested_changes.yml
          git commit -m "feat: apply only requested Navbar menu changes"
          git push
