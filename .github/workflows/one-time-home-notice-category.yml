name: One-time home notice category filter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch home notice category filter
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/home/page.tsx')
          s = p.read_text()

          old = "  const [homeTab, setHomeTab] = useState<'notice' | 'schedule' | 'news'>('notice');\n"
          new = old + "  const [homeNoticeCategory, setHomeNoticeCategory] = useState('전체');\n"
          if old not in s:
              raise SystemExit('homeTab anchor not found')
          if "homeNoticeCategory" not in s:
              s = s.replace(old, new, 1)

          old = "  // 달력\n"
          new = "  const HOME_NOTICE_CATEGORIES = ['전체', '일반', '긴급', '행사', '모집', '교육', '기도제목'];\n  const filteredHomeNotices = homeNoticeCategory === '전체'\n    ? notices\n    : notices.filter((notice) => (notice.category || '일반') === homeNoticeCategory);\n\n  // 달력\n"
          if "const HOME_NOTICE_CATEGORIES" not in s:
              if old not in s:
                  raise SystemExit('calendar anchor not found')
              s = s.replace(old, new, 1)

          old = '''              <Link to="/notices" className="text-xs text-primary-600 hover:text-primary-700 font-semibold flex items-center gap-0.5 whitespace-nowrap cursor-pointer">전체보기 <i className="ri-arrow-right-s-line text-sm"></i></Link>\n            </div>\n            <div className="space-y-2">'''
          new = '''              <Link to="/notices" className="text-xs text-primary-600 hover:text-primary-700 font-semibold flex items-center gap-0.5 whitespace-nowrap cursor-pointer">전체보기 <i className="ri-arrow-right-s-line text-sm"></i></Link>\n            </div>\n            <div className="mb-3 rounded-2xl border border-background-200 bg-background-100 p-2.5">\n              <div className="flex gap-2 overflow-x-auto scrollbar-hide pb-0.5" role="tablist" aria-label="최신 공지사항 카테고리">\n                {HOME_NOTICE_CATEGORIES.map((category) => {\n                  const count = category === '전체' ? notices.length : notices.filter((notice) => (notice.category || '일반') === category).length;\n                  const active = homeNoticeCategory === category;\n                  return (\n                    <button\n                      key={category}\n                      type="button"\n                      role="tab"\n                      aria-selected={active}\n                      onClick={() => setHomeNoticeCategory(category)}\n                      className={`min-h-10 shrink-0 rounded-chip px-3.5 text-xs font-bold transition-colors cursor-pointer ${active ? 'bg-primary-500 text-white shadow-card' : 'bg-background-200 text-foreground-600 hover:bg-background-300'}`}\n                    >\n                      {category}<span className={`ml-1.5 ${active ? 'text-white/80' : 'text-foreground-400'}`}>{count}</span>\n                    </button>\n                  );\n                })}\n              </div>\n            </div>\n            <div className="space-y-2">'''
          if old not in s:
              raise SystemExit('notice header anchor not found')
          s = s.replace(old, new, 1)

          # Only the home notice presentation uses these occurrences.
          marker = "{/* ── 공지사항 ── */}"
          start = s.index(marker)
          end = s.index("{/* ──", start + len(marker)) if "{/* ──" in s[start + len(marker):] else len(s)
          section = s[start:end]
          section2 = section.replace('notices.slice(0, 6)', 'filteredHomeNotices.slice(0, 6)').replace('{notices.map((notice) => {', '{filteredHomeNotices.map((notice) => {')
          if section == section2:
              raise SystemExit('notice list anchors not found')
          s = s[:start] + section2 + s[end:]

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/home/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: add category filters to latest home notices [skip ci]"
          git push
