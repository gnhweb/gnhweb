name: Account recovery deployment

on:
  push:
    branches:
      - account-password-migration

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: workers/api
        run: npm install --no-audit --no-fund

      - name: Validate API TypeScript
        run: npx tsc --noEmit -p workers/api/tsconfig.json

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/api
          command: deploy --config wrangler.jsonc

      - name: Configure DATABASE_URL when repository secret exists
        if: ${{ secrets.DATABASE_URL != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/api
          command: secret put DATABASE_URL
        env:
          WRANGLER_DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply login recovery patch
        run: node scripts/account-recovery-login-patch.mjs

      - name: Install site dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Type-check site
        run: npm run type-check

      - name: Lint site
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Deploy site Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
