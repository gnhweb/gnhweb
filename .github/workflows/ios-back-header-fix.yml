name: iOS PWA header back button
on:
  push:
    paths:
      - .github/workflows/ios-back-header-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile header
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/feature/Navbar.tsx')
          s = p.read_text()

          anchor = "  const toggleMobileAccordion = (key: string) => setMobileAccordion(prev => ({ ...prev, [key]: !prev[key] }));\n"
          helper = "\n  const handleMobileBack = () => {\n    if (window.history.length > 1) {\n      window.history.back();\n    } else if (location.pathname !== '/') {\n      navigate('/');\n    }\n  };\n\n  const isIosPwa = () => {\n    if (typeof window === 'undefined' || typeof navigator === 'undefined') return false;\n    const standalone = (navigator as Navigator & { standalone?: boolean }).standalone === true;\n    const displayModeStandalone = window.matchMedia?.('(display-mode: standalone)').matches === true;\n    return /iPhone|iPad|iPod/.test(navigator.userAgent) && (standalone || displayModeStandalone);\n  };\n"
          if 'const handleMobileBack = () =>' not in s:
              s = s.replace(anchor, anchor + helper)

          old = '<div className="flex items-center justify-between px-4 py-3 border-b border-background-200 flex-shrink-0"><Link to="/" onClick={() => setMobileOpen(false)} className="flex items-center gap-2 cursor-pointer"><div className="w-7 h-7 rounded-lg bg-primary-100 flex items-center justify-center"><i className="ri-cross-line text-primary-600 text-sm"></i></div><span className="text-sm font-bold text-foreground-950">강릉 학생회</span></Link><button onClick={() => setMobileOpen(false)} className="w-10 h-10 rounded-full bg-background-200 flex items-center justify-center cursor-pointer"><i className="ri-close-line text-xl text-foreground-700"></i></button></div>'
          new = '<div className="flex items-center justify-between px-4 py-3 border-b border-background-200 flex-shrink-0"><Link to="/" onClick={() => setMobileOpen(false)} className="flex items-center gap-2 cursor-pointer"><div className="w-7 h-7 rounded-lg bg-primary-100 flex items-center justify-center"><i className="ri-cross-line text-primary-600 text-sm"></i></div><span className="text-sm font-bold text-foreground-950">강릉 학생회</span></Link><div className="flex items-center gap-1.5">{isIosPwa() && <button onClick={handleMobileBack} aria-label="뒤로 가기" title="뒤로 가기" className="w-10 h-10 rounded-full bg-background-100 border border-background-200 flex items-center justify-center cursor-pointer active:scale-95"><i className="ri-arrow-left-line text-xl text-foreground-700"></i></button>}<button onClick={() => setMobileOpen(false)} aria-label="메뉴 닫기" className="w-10 h-10 rounded-full bg-background-200 flex items-center justify-center cursor-pointer"><i className="ri-close-line text-xl text-foreground-700"></i></button></div></div>'
          if old not in s:
              raise SystemExit('mobile header anchor not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/components/feature/Layout.tsx')
          s = p.read_text()
          start = "\n        {iosPwa && location.pathname !== '/' && ("
          i = s.find(start)
          if i != -1:
              j = s.find("\n        )}", i)
              if j == -1:
                  raise SystemExit('Layout back button end not found')
              j += len("\n        )}")
              s = s[:i] + s[j:]
          # iosPwa state is now only needed by the old floating button; remove its setup too.
          s = s.replace("  const [iosPwa, setIosPwa] = useState(false);\n", "")
          effect = """\n  useEffect(() => {\n    const updatePwaState = () => setIosPwa(isIosPwa());\n    updatePwaState();\n    const media = window.matchMedia?.('(display-mode: standalone)');\n    media?.addEventListener?.('change', updatePwaState);\n    return () => media?.removeEventListener?.('change', updatePwaState);\n  }, []);\n"""
          s = s.replace(effect, "\n")
          p.write_text(s)
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/Navbar.tsx src/components/feature/Layout.tsx
          git commit -m "fix: move iOS PWA back button beside mobile close icon" || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/ios-back-header-fix.yml
          git commit -m "chore: remove one-time iOS header workflow" || exit 0
          git push