name: Deploy AI Gateway Changes

on:
  push:
    branches: [main]
    paths:
      - "workers/ai-gateway/**"
      - ".github/workflows/deploy-ai-gateway-changes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy AI gateway Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/ai-gateway
          command: deploy --config wrangler.jsonc

      - name: Verify /nim-quiz authentication guard
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}'             --request POST             --header 'Content-Type: application/json'             --data '{"difficulty":"normal","count":1,"excludeQuestions":[],"source":"site"}'             'https://gnhweb-ai-gateway.gemini19840314.workers.dev/nim-quiz')
          echo "Worker HTTP $http_code"
          cat "$response_file"

          # The production frontend forwards the current Neon Auth JWT.
          # This CI smoke request has no user session, so it cannot fetch the
          # authenticated Neon Data API rows. Verify the auth-boundary response
          # instead of treating the missing JWT as a Worker outage.
          test "$http_code" = "500"
          grep -q '퀴즈를 불러오는 중 오류가 발생했습니다.' "$response_file"
