name: One-time coaching diversity patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[coaching-diversity-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch coaching generation diversity
        shell: python
        run: |
          from pathlib import Path
          p = Path('workers/ai-gateway/src/coachingFeature.ts')
          s = p.read_text()
          marker = 'const FALLBACK_EMPATHETIC = `'
          if 'COACHING_LENSES' in s:
              raise SystemExit('patch already present')
          insert = '''const COACHING_LENSES = [\n  "원인 추적 관점: 표면적인 갈등보다 역할·기대·정보·역량·시간·책임 구조를 먼저 구분해 진단한다.",\n  "관찰자 관점: 같은 상황을 상대방, 리더, 제3자의 세 시선에서 보고 서로 다른 해석을 비교한다.",\n  "현장 실행 관점: 오늘 실제 학생회 현장에서 바로 적용할 행동과 다음 확인 시점을 중심으로 판단한다.",\n  "책임 경계 관점: 리더가 책임질 부분과 상대가 책임질 부분을 분리하고 둘 중 하나로 몰아가지 않는다.",\n  "반대 가설 관점: 처음 떠오른 원인이 틀렸다고 가정하고 다른 설명이 가능한지 먼저 검증한다.",\n  "성장 관점: 당장의 문제 해결뿐 아니라 이 상황에서 사명자가 배워야 할 리더십 한 가지를 찾는다.",\n  "관계와 기준 관점: 관계를 지키는 것과 기준을 세우는 것을 동시에 놓고 어느 균형이 필요한지 판단한다.",\n  "재발 방지 관점: 이번 일을 해결하는 것에서 끝내지 않고 같은 문제가 반복되지 않을 구조까지 생각한다.",\n];\n\n'''
          s = s.replace(marker, insert + marker, 1)
          anchor = '    const firstDraft = await requestGateway(['
          repl = '''    const coachingLens = COACHING_LENSES[Math.floor(Math.random() * COACHING_LENSES.length)];\n    const generationNonce = crypto.randomUUID();\n\n    const firstDraft = await requestGateway(['''
          if anchor not in s:
              raise SystemExit('firstDraft anchor not found')
          s = s.replace(anchor, repl, 1)
          old = '원인을 하나로 단정하기 전에 최소 2개의 가능성을 검토하고, 그중 근거가 가장 강한 것을 중심으로 답하라. 질문을 일반적인 리더십 문제로 바꾸지 마라.\\n\\n${concern}'
          new = '원인을 하나로 단정하기 전에 최소 2개의 가능성을 검토하고, 그중 근거가 가장 강한 것을 중심으로 답하라. 질문을 일반적인 리더십 문제로 바꾸지 마라.\\n\\n이번 생성의 사고 관점: ${coachingLens}\\n이번 생성 식별자: ${generationNonce}\\n이 관점은 답변에 그대로 이름 붙여 설명하지 말고 실제 판단 방식에만 반영하라. 이전 답변에서 흔히 쓰는 일반론을 반복하지 말고, 이번 고민의 구체적 사실에 맞는 다른 판단 경로를 선택하라.\\n\\n${concern}'
          if old not in s:
              raise SystemExit('first prompt anchor not found')
          s = s.replace(old, new, 1)
          old2 = '초안 답변:\\n${firstDraft}\\n\\n위 초안을 원래 고민에 맞춰 다시 검수하고, 더 정확한 원인 판단과 실행 방법이 드러나는 최종 답변으로 고쳐라. 초안의 구조를 무조건 유지하지 말고 질문에 가장 적합한 방식으로 다시 구성해라.'
          new2 = '초안 답변:\\n${firstDraft}\\n\\n이번 검수의 사고 관점: ${coachingLens}\\n이번 생성 식별자: ${generationNonce}\\n위 초안을 원래 고민에 맞춰 다시 검수하고, 더 정확한 원인 판단과 실행 방법이 드러나는 최종 답변으로 고쳐라. 초안의 구조와 문장을 무조건 유지하지 말고 질문에 가장 적합한 방식으로 다시 구성해라. 특히 초안과 표현·구조·우선순위가 지나치게 같다면 다른 타당한 판단 경로를 선택해 다시 작성하라.'
          if old2 not in s:
              raise SystemExit('review prompt anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add workers/ai-gateway/src/coachingFeature.ts
          git commit -m "Improve coaching response diversity [coaching-diversity-patch]"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-coaching-diversity-patch.yml
          git commit -m "Remove one-time coaching patch workflow [coaching-diversity-cleanup]"
          git push
