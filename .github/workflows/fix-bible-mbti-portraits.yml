name: Fix Bible MBTI portraits

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix portrait rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/bibleMbti/page.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = r"function CharacterIllustration\(\{ name, className \}: \{ name: string; className\?: string \}\) \{.*?\n\}\n\nconst axisLabels"
          replacement = '''function CharacterIllustration({ name, className }: { name: string; className?: string }) {
            const index = MBTI_CHARACTER_INDEX[name];
            if (index === undefined) return <div className={className} aria-hidden="true" />;
            const column = index % 5;
            const row = Math.floor(index / 5);
            const x = column * 25;
            const y = row * (100 / 3);

            return (
              <div
                role="img"
                aria-label={`${name} 성경인물 일러스트`}
                className={`bg-no-repeat ${className ?? ''}`}
                style={{
                  backgroundImage: 'url(/bible-mbti/characters-cute.svg)',
                  backgroundPosition: `${x}% ${y}%`,
                  backgroundSize: '500% 400%',
                }}
              />
            );
          }

          const axisLabels'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('bibleMbti CharacterIllustration block not found')
          p.write_text(s2, encoding='utf-8')

          p = Path('src/pages/bibleMbtiEnhanced/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''function FigureIllustration({name,className}:{name:Figure;className:string}){\n return <img src={figureImagePaths[name]} alt={`${name} 성경인물 프로필`} className={`object-cover object-center ${className}`} />;\n}'''
          new = '''function FigureIllustration({name,className}:{name:Figure;className:string}){
 const index = figureOrder.indexOf(name);
 const column = index % 5;
 const row = Math.floor(index / 5);
 return <div role="img" aria-label={`${name} 성경인물 프로필`} className={`bg-no-repeat ${className}`} style={{backgroundImage:'url(/bible-mbti/figure-portraits.webp)',backgroundPosition:`${column * 25}% ${row * (100 / 3)}%`,backgroundSize:'500% 400%'}}/>;
}'''
          if old not in s:
              raise SystemExit('bibleMbtiEnhanced FigureIllustration block not found')
          s = s.replace(old, new, 1)
          s = s.replace("import { figureImagePaths } from './figureImages';\n", '', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/bibleMbti/page.tsx src/pages/bibleMbtiEnhanced/page.tsx .github/workflows/fix-bible-mbti-portraits.yml
          git commit -m "fix: render Bible MBTI portraits from existing assets"
          git rm .github/workflows/fix-bible-mbti-portraits.yml
          git commit -m "chore: remove temporary portrait fix workflow"
          git push
