name: One-time check coaching after secrets
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production coaching
        shell: bash
        run: |
          set -u
          body='{"concern":"학생회에서 맡은 일을 계속 미루는 학생이 있어요. 여러 번 부탁했는데도 달라지지 않아요. 어떻게 지도해야 하나요?","tone":"direct"}'
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data "$body" 'https://gnhweb-ai-gateway.gemini19840314.workers.dev/nim-coaching')
          echo "HTTP $http_code"
          cat "$response_file"
          rm -f "$response_file"
