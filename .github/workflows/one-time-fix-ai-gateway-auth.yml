name: One-time fix AI gateway auth

on:
  push:
    paths:
      - .github/workflows/one-time-fix-ai-gateway-auth.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix gateway authorization forwarding
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          root = Path('supabase/functions')
          for p in sorted(root.glob('nim-*/index.ts')):
              s = p.read_text(encoding='utf-8')
              if 'functions/v1/ai-gateway' not in s:
                  continue
              old = s
              s = s.replace("'Authorization': `Bearer ${apiKey}`", "'Authorization': req.headers.get('Authorization') || ''")
              s = s.replace('Authorization: `Bearer ${apiKey}`', "Authorization: req.headers.get('Authorization') || ''")
              s = s.replace('Authorization: `Bearer ${key}`', "Authorization: req.headers.get('Authorization') || ''")
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          if not changed:
              raise SystemExit('No gateway auth usages needed fixing')
          print('\n'.join(changed))

      - name: Validate
        run: |
          if grep -R -n "functions/v1/ai-gateway" supabase/functions/nim-*/index.ts >/dev/null; then
            if grep -R -n -E "Authorization.*Bearer \$\{(apiKey|key)\}" supabase/functions/nim-*/index.ts; then
              echo "A migrated function still forwards a provider key to the gateway"; exit 1
            fi
          fi
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/nim-*/index.ts
          git commit -m "fix: forward user auth to AI gateway"
          git push

      - name: Remove workflow
        run: |
          git rm .github/workflows/one-time-fix-ai-gateway-auth.yml
          git commit -m "chore: remove one-time AI gateway auth fix workflow"
          git push
