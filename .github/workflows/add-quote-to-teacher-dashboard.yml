name: Add quote management to teacher dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch dashboard
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/teacherDashboard/page.tsx')
          text = path.read_text(encoding='utf-8')
          anchor = '''            <Link to="/teacher-dashboard/quiz-manage" className="bg-background-100 border border-background-200 rounded-[20px] p-4 text-center hover:border-amber-300 transition-colors cursor-pointer"><i className="ri-question-answer-line text-2xl text-amber-500 mb-2 block"></i><span className="text-xs font-semibold text-foreground-700">성경퀴즈 출제</span></Link>\n'''
          quote = '''            <Link to="/teacher-dashboard/quote-manage" className="bg-background-100 border border-background-200 rounded-[20px] p-4 text-center hover:border-primary-300 transition-colors cursor-pointer"><i className="ri-chat-quote-line text-2xl text-primary-500 mb-2 block"></i><span className="text-xs font-semibold text-foreground-700">어록 관리</span></Link>\n'''
          if quote in text:
              changed = False
          elif anchor in text:
              text = text.replace(anchor, anchor + quote, 1)
              path.write_text(text, encoding='utf-8')
              changed = True
          else:
              raise SystemExit('dashboard quick-link anchor not found')

          workflow = Path('.github/workflows/add-quote-to-teacher-dashboard.yml')
          if changed:
              workflow.unlink(missing_ok=True)
          else:
              raise SystemExit('quote link already exists')
      - name: Commit patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/teacherDashboard/page.tsx .github/workflows/add-quote-to-teacher-dashboard.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "add quote management to teacher dashboard"
          git push origin main
