name: one-time-club-qna-ui-fix

on:
  push:
    paths:
      - '.github/workflows/one-time-club-qna-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch club QnA UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pages/clubs/detail/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = """          createdAt: q.created_at,\n"""
          new = """          createdAt: new Date(q.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\\s/g, ''),\n"""
          if old not in text:
              raise SystemExit('createdAt target not found')
          text = text.replace(old, new, 1)

          old = """  // 질문 작성자 본인 또는 동아리 사명자만 질문을 수정/삭제할 수 있어요.\n  const canManageQnaQuestion = (item: ClubQnA) =>\n    isClubLeader || (!!user && !!item.authorId && item.authorId === user.id);\n"""
          new = """  // 질문은 작성자 본인만 수정/삭제할 수 있어요.\n  const canManageQnaQuestion = (item: ClubQnA) =>\n    !!user && !!item.authorId && item.authorId === user.id;\n"""
          if old not in text:
              raise SystemExit('ownership target not found')
          text = text.replace(old, new, 1)

          old = """                            {!item.answer && <span className=\\"text-xs px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700\\">답변 대기</span>}\n"""
          new = """                            {!item.answer && <span className=\\"inline-flex flex-shrink-0 items-center justify-center min-w-[72px] h-8 px-3 rounded-full bg-amber-100 text-amber-800 text-xs font-semibold whitespace-nowrap\\">답변 대기</span>}\n"""
          if old not in text:
              raise SystemExit('answer-waiting badge target not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -n "createdAt: new Date(q.created_at)" src/pages/clubs/detail/page.tsx
          grep -n "const canManageQnaQuestion" src/pages/clubs/detail/page.tsx
          grep -n "min-w-\[72px\].*답변 대기" src/pages/clubs/detail/page.tsx

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clubs/detail/page.tsx
          git commit -m "fix: tidy club QnA date and ownership controls"
          git push

# one-time trigger