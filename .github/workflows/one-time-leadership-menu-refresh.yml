name: one-time-leadership-menu-refresh

on:
  push:
    paths:
      - '.github/workflows/one-time-leadership-menu-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh leadership coaching menu bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/feature/Navbar.tsx')
          text = p.read_text(encoding='utf-8')
          old = 'MenuGridCard icon="ri-book-read-line" label="리더십 코칭" colorClass="bg-accent-100 text-accent-600" active={isActive(\'/leadership-diary\')} onClick={() => { navigate(\'/leadership-diary\'); setMobileOpen(false); }}'
          new = 'MenuGridCard icon="ri-user-star-line" label="리더십 코칭" colorClass="bg-accent-100 text-accent-600" active={isActive(\'/leadership-diary\')} onClick={() => { navigate(\'/leadership-diary\'); setMobileOpen(false); }}'
          if old not in text:
              raise SystemExit('expected leadership coaching menu item not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/Navbar.tsx
          git rm .github/workflows/one-time-leadership-menu-refresh.yml
          git commit -m "fix: refresh mobile leadership coaching menu"
          git push
