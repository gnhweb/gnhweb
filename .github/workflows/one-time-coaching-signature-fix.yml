name: one-time coaching signature fix
on:
  push:
    paths:
      - .github/workflows/one-time-coaching-signature-fix.yml
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'one-time coaching signature fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix requestGateway arguments
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('workers/ai-gateway/src/coachingFeature.ts')
          s = p.read_text()
          old = '''async function requestGateway(\n  messages: Array<{ role: "system" | "user"; content: string }>,\n  maxTokens = 3000,\n) {'''
          new = '''async function requestGateway(\n  messages: Array<{ role: "system" | "user"; content: string }>,\n  _env: Record<string, string | undefined>,\n  maxTokens = 3000,\n) {'''
          assert s.count(old) == 1, f'expected one requestGateway signature, found {s.count(old)}'
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          npm ci
          npm run type-check
          npx wrangler deploy --dry-run --config workers/ai-gateway/wrangler.jsonc
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/ai-gateway/src/coachingFeature.ts
          git commit -m 'fix: pass coaching gateway token limit correctly'
          git push
