name: one-time bug repair 20260902 v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip repair 20260902]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply repairs
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text missing in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, count))

          # Suggestions UI stores no display name for anonymous submissions.
          replace('src/pages/suggestions/page.tsx', '          author_name: profile.name,\n', '          author_name: isAnonymous ? null : profile.name,\n')
          replace('src/pages/suggestions/page.tsx', '  author_name: string;', '  author_name: string | null;')

          # Bible Pick CTA.
          replace('src/pages/biblePick/components/VerseResult.tsx', '            나의 히스토리\n', '            히스토리 바로가기\n')

          # Memory uploads use an owner-scoped storage path; DB/RLS remains the source of truth.
          replace('src/pages/memoryBoard/page.tsx', '      const path = `memories/${safeName}`;', '      const path = `memories/${user!.id}/${safeName}`;')
          replace('src/pages/memoryBoard/page.tsx', '          onDelete={isEditor ? handleDeleteAtIndex : undefined}\n', '          onDelete={isEditor ? handleDeleteAtIndex : undefined}\n          canDelete={isEditor ? (index) => filteredPhotos[index]?.author_id === user?.id : undefined}\n')
          replace('src/components/feature/PhotoLightbox.tsx', '  onDelete?: (index: number) => void;\n  deletingIndex?: number | null;', '  onDelete?: (index: number) => void;\n  canDelete?: (index: number) => boolean;\n  deletingIndex?: number | null;')
          replace('src/components/feature/PhotoLightbox.tsx', 'export default function PhotoLightbox({ photos, initialIndex, onClose, captions, onDelete, deletingIndex }: PhotoLightboxProps) {', 'export default function PhotoLightbox({ photos, initialIndex, onClose, captions, onDelete, canDelete, deletingIndex }: PhotoLightboxProps) {')
          replace('src/components/feature/PhotoLightbox.tsx', '            {onDelete && (', '            {onDelete && (!canDelete || canDelete(index)) && (')

          # PIN unlock session: timestamped expiry, not a permanent unlocked flag.
          replace('src/lib/simplePin.ts', 'function lockedFlagKey(userId: string): string {\n  return `simple_pin_locked_${userId}`;\n}\n', 'function lockedFlagKey(userId: string): string {\n  return `simple_pin_locked_${userId}`;\n}\n\nfunction unlockExpiresKey(userId: string): string {\n  return `simple_pin_unlock_expires_${userId}`;\n}\n')
          replace('src/lib/simplePin.ts', '    localStorage.removeItem(lockedFlagKey(userId));\n', '    localStorage.removeItem(lockedFlagKey(userId));\n    localStorage.removeItem(unlockExpiresKey(userId));\n')
          marker = 'export function setPinExplicitLock(userId: string, locked: boolean): void {'
          p = Path('src/lib/simplePin.ts')
          s = p.read_text()
          if marker not in s: raise SystemExit('simplePin marker missing')
          insert = '''export function setPinUnlockExpiration(userId: string, expiresAt: number): void {\n  try { localStorage.setItem(unlockExpiresKey(userId), String(expiresAt)); } catch { /* ignore */ }\n}\n\nexport function clearPinUnlockSession(userId: string): void {\n  try {\n    localStorage.removeItem(unlockExpiresKey(userId));\n    localStorage.removeItem(lockedFlagKey(userId));\n  } catch { /* ignore */ }\n}\n\nexport function getPinUnlockExpiration(userId: string): number {\n  try {\n    const value = Number(localStorage.getItem(unlockExpiresKey(userId)) || 0);\n    return Number.isFinite(value) ? value : 0;\n  } catch { return 0; }\n}\n\nexport function isPinUnlockValid(userId: string): boolean {\n  return getPinUnlockExpiration(userId) > Date.now();\n}\n\n'''
          p.write_text(s.replace(marker, insert + marker, 1))

          # Auth restore logic and expiry updates.
          replace('src/hooks/useAuth.tsx', '  markPinActivity, setPinExplicitLock,\n', '  markPinActivity, setPinExplicitLock, isPinUnlockValid, setPinUnlockExpiration, clearPinUnlockSession, getAutoLogoutMinutes,\n')
          replace('src/hooks/useAuth.tsx', "          if (deviceHasPin) {\n            setPinLocked(true);\n            setPinExplicitLock(currentUser.id, true);\n            setPinSetupNeeded(false);\n          } else {", "          if (deviceHasPin) {\n            const unlockValid = isPinUnlockValid(currentUser.id);\n            setPinLocked(!unlockValid);\n            setPinExplicitLock(currentUser.id, !unlockValid);\n            setPinSetupNeeded(false);\n          } else {")
          replace('src/hooks/useAuth.tsx', "    setPinExplicitLock(user.id, false);\n    setPinSetupNeeded(false);\n    markPinActivity(user.id);\n    return { error: null };", "    setPinExplicitLock(user.id, false);\n    setPinSetupNeeded(false);\n    setPinUnlockExpiration(user.id, Date.now() + getAutoLogoutMinutes(user.id) * 60 * 1000);\n    markPinActivity(user.id);\n    return { error: null };", 1)
          replace('src/hooks/useAuth.tsx', "    if (ok) {\n      setPinLocked(false);\n      setPinExplicitLock(user.id, false);\n      markPinActivity(user.id);\n    }", "    if (ok) {\n      setPinLocked(false);\n      setPinExplicitLock(user.id, false);\n      setPinUnlockExpiration(user.id, Date.now() + getAutoLogoutMinutes(user.id) * 60 * 1000);\n      markPinActivity(user.id);\n    }", 1)
          replace('src/hooks/useAuth.tsx', "    if (!result.error) {\n      setPinLocked(false);\n      setPinExplicitLock(user.id, false);\n      markPinActivity(user.id);\n      return true;", "    if (!result.error) {\n      setPinLocked(false);\n      setPinExplicitLock(user.id, false);\n      setPinUnlockExpiration(user.id, Date.now() + getAutoLogoutMinutes(user.id) * 60 * 1000);\n      markPinActivity(user.id);\n      return true;", 1)
          replace('src/hooks/useAuth.tsx', "  const lockApp = useCallback(() => {\n    if (user && hasSimplePin(user.id)) {\n      setPinLocked(true);\n      setPinExplicitLock(user.id, true);\n    }\n  }, [user]);", "  const lockApp = useCallback(() => {\n    if (user && hasSimplePin(user.id)) {\n      setPinLocked(true);\n      clearPinUnlockSession(user.id);\n      setPinExplicitLock(user.id, true);\n    }\n  }, [user]);")
          replace('src/hooks/useAuth.tsx', "    setPinSetupNeeded(false);\n    clearAllAuthStorage();\n    await supabase.auth.signOut({ scope: 'local' })", "    setPinSetupNeeded(false);\n    if (user) clearPinUnlockSession(user.id);\n    clearAllAuthStorage();\n    await supabase.auth.signOut({ scope: 'local' })")

          # Layout no longer forces a lock on every pagehide/reload.
          p = Path('src/components/feature/Layout.tsx')
          s = p.read_text()
          s, n = re.subn(r"\n useEffect\(\(\)=>\{\n   if\(typeof window==='undefined'\) return;\n   const key='gnh_pin_session_unlocked';[\s\S]*?\n \},\[user\?\.id\]\);\n", '\n', s, count=1)
          if n != 1: raise SystemExit(f'Layout session gate removal count={n}')
          s, n = re.subn(r"\n // Mobile/PWA background lock:[\s\S]*?\n \},\[user\?\.id,hasPin,lockApp\]\);\n", '\n', s, count=1)
          if n != 1: raise SystemExit(f'Layout background lock removal count={n}')
          if "import { isPinUnlockValid } from '@/lib/simplePin';" not in s:
              s = s.replace("import { listPasskeys } from '@/lib/passkey';\n", "import { listPasskeys } from '@/lib/passkey';\nimport { isPinUnlockValid } from '@/lib/simplePin';\n", 1)
          replace_layout_old = ' if(pinLocked)return <AppLockScreen/>; if(pinSetupNeeded)return <PinSetupPrompt/>;'
          replace_layout_new = ' const persistedPinUnlocked = !!user && hasPin && isPinUnlockValid(user.id);\n if(pinLocked && !persistedPinUnlocked)return <AppLockScreen/>; if(pinSetupNeeded)return <PinSetupPrompt/>;'
          if replace_layout_old not in s: raise SystemExit('Layout lock render marker missing')
          s = s.replace(replace_layout_old, replace_layout_new, 1)
          old = ' if(loading||!user||!hasPin||pinLocked||passkeyAttemptedRef.current===user.id)return;'
          new = ' if(loading||!user||!hasPin||(!pinLocked && isPinUnlockValid(user.id))||passkeyAttemptedRef.current===user.id)return;'
          if old not in s: raise SystemExit('Layout passkey marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # PIN timer follows fixed expiry for PIN users; no-PIN users retain inactivity logout.
          replace('src/hooks/useAutoLogout.ts', "import { markPinActivity, AUTO_LOGOUT_STORAGE_KEY, DEFAULT_AUTO_LOGOUT_MINUTES, AUTO_LOGOUT_CHANGE_EVENT } from '@/lib/simplePin';", "import { markPinActivity, AUTO_LOGOUT_STORAGE_KEY, DEFAULT_AUTO_LOGOUT_MINUTES, AUTO_LOGOUT_CHANGE_EVENT, getPinUnlockExpiration, setPinUnlockExpiration } from '@/lib/simplePin';")
          replace('src/hooks/useAutoLogout.ts', "    if (user && hasPin) {\n      const now = Date.now();\n      if (now - lastPersistRef.current > ACTIVITY_PERSIST_INTERVAL_MS) {\n        lastPersistRef.current = now;\n        markPinActivity(user.id);\n      }\n    }\n\n    const mins = timeoutMinutesRef.current;\n    if (mins <= 0 || !user) return;\n    timerRef.current = setTimeout(timeoutAction, mins * 60 * 1000);", "    const mins = timeoutMinutesRef.current;\n    if (mins <= 0 || !user) return;\n\n    if (hasPin) {\n      const expiresAt = getPinUnlockExpiration(user.id);\n      const delay = expiresAt > Date.now() ? expiresAt - Date.now() : 0;\n      timerRef.current = setTimeout(timeoutAction, delay);\n      return;\n    }\n\n    const now = Date.now();\n    if (now - lastPersistRef.current > ACTIVITY_PERSIST_INTERVAL_MS) {\n      lastPersistRef.current = now;\n      markPinActivity(user.id);\n    }\n    timerRef.current = setTimeout(timeoutAction, mins * 60 * 1000);")
          replace('src/hooks/useAutoLogout.ts', "    if (timerRef.current) clearTimeout(timerRef.current);\n    if (minutes > 0 && user) timerRef.current = setTimeout(timeoutAction, minutes * 60 * 1000);", "    if (timerRef.current) clearTimeout(timerRef.current);\n    if (minutes > 0 && user) {\n      if (hasPin) {\n        setPinUnlockExpiration(user.id, Date.now() + minutes * 60 * 1000);\n        timerRef.current = setTimeout(timeoutAction, minutes * 60 * 1000);\n      } else {\n        timerRef.current = setTimeout(timeoutAction, minutes * 60 * 1000);\n      }\n    }")

          # Exact timeout choices requested by the user.
          p = Path('src/pages/profile/page.tsx')
          s = p.read_text()
          s, n = re.subn(r"<option value=\{5\}>5분</option>[\s\S]*?<option value=\{300\}>5시간</option>\n                  <option value=\{0\}>안 함</option>", "<option value={1}>1분</option>\n                  <option value={5}>5분</option>\n                  <option value={30}>30분</option>\n                  <option value={60}>1시간</option>\n                  <option value={300}>5시간</option>", s, count=1)
          if n != 1: raise SystemExit(f'Profile timeout options replacement count={n}')
          p.write_text(s)

          # Fix the GitHub source drift in the already-deployed gateway version of meeting-copilot.
          p = Path('supabase/functions/meeting-copilot/index.ts')
          s = p.read_text()
          pattern = r"\n    const encoder = new TextEncoder\(\);\n    const ssePayload = `data: \$\{JSON\.stringify\(\{ content \}\)\}.*?\n    return new Response\(stream, \{[\s\S]*?\n  \} catch \(err\) \{"
          replacement = "\n    const encoder = new TextEncoder();\n    const ssePayload = `data: ${JSON.stringify({ content })}\\n\\ndata: [DONE]\\n\\n`;\n    return new Response(encoder.encode(ssePayload), {\n      headers: { ...CORS_HEADERS, \"Content-Type\": \"text/event-stream\", \"Cache-Control\": \"no-cache\", \"Connection\": \"keep-alive\" },\n    });\n  } catch (err) {"
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1: raise SystemExit(f'meeting-copilot tail replacement count={n}')
          p.write_text(s)

          # Reproducible source migration for the DB security changes already applied directly to production.
          Path('supabase/migrations/20260902000000_harden_suggestions_memory.sql').write_text('''-- 2026-09-02 privacy hardening.\nalter table public.suggestions enable row level security;\ndrop policy if exists "누구나 건의사항 조회 가능" on public.suggestions;\ndrop policy if exists "suggestions_select_own" on public.suggestions;\ncreate policy "suggestions_select_own" on public.suggestions for select using (auth.uid() = author_id);\ndrop policy if exists "suggestions_select_elevated" on public.suggestions;\ncreate policy "suggestions_select_elevated" on public.suggestions for select using (get_user_role() = any(array['teacher'::text,'chief'::text]));\ndrop policy if exists "Non-member can delete photos" on storage.objects;\ndrop policy if exists "memory_photos_delete_own" on public.memory_photos;\ncreate policy "memory_photos_delete_own" on public.memory_photos for delete using (auth.uid() = author_id);\ndrop policy if exists "memory_objects_delete_own" on storage.objects;\ncreate policy "memory_objects_delete_own" on storage.objects for delete to authenticated using (bucket_id = 'Public' and name like 'memories/' || auth.uid()::text || '/%');\n''')

          Path('.github/workflows/repair-20260902.yml').unlink()
          Path('.github/workflows/repair-20260902-v2.yml').unlink()

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src supabase/migrations/20260902000000_harden_suggestions_memory.sql
          git add -u .github/workflows
          git commit -m 'fix: repair privacy history memory lock and AI flows [skip repair 20260902]'
          git push origin HEAD:main
