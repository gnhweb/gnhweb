name: One-time restore coaching patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore coaching file
        run: |
          git config user.name gnhweb
          git config user.email gemini19840314@gmail.com
          git checkout 5115587ab166a539fcb525a37ec31ec0cddc8700 -- workers/ai-gateway/src/coachingFeature.ts
          git add workers/ai-gateway/src/coachingFeature.ts
          git commit -m 'Revert bad coaching patch' || true
          git push
