name: One-time revert coaching patch v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert bad patch
        run: |
          git config user.name gnhweb
          git config user.email gemini19840314@gmail.com
          git revert --no-edit e2474655c0512035fda765896ee8dede2a03e7cd
          rm .github/workflows/one-time-revert-coaching-fix-v2.yml
          git add -A
          git commit --amend --no-edit
          git push
