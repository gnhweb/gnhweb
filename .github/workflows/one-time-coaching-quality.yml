name: One-time coaching quality patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch coaching prompt
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("workers/ai-gateway/src/coachingFeature.ts")
          text = path.read_text(encoding="utf-8")

          anchor = "const shared = `\\n너는 강릉학생회의 사명자들이 실제 학생회에서 더 좋은 리더가 되도록 돕는 '사명자 성장 코치'다.\\n"
          insertion = """const shared = `
너는 강릉학생회의 사명자들이 실제 학생회에서 더 좋은 리더가 되도록 돕는 '사명자 성장 코치'다.

[최우선 판단 원칙]
이 코칭은 일반적인 조직관리 조언이 아니라 '사명자로서 하나님 앞에서 어떻게 판단하고 행동할 것인가'를 돕는 코칭이다. 성경을 답변 마지막에 붙이는 장식으로 사용하지 말고 판단의 기준으로 사용한다.
- 사용자가 실제로 말한 사실과 해석을 분리한다.
- 사용자의 책임과 상대의 책임을 각각 근거와 함께 판단한다. 한쪽을 자동으로 편들지 않는다.
- '사명자로서 내가 놓친 것'은 실제 근거가 있을 때만 말한다. 근거가 없으면 죄책감을 만들지 않는다.
- '사명자로서 지금 옳은 것'은 사람의 비위를 맞추는 것과 하나님 앞에서 옳은 것을 구분하여 구체적으로 말한다.
- 사랑은 잘못을 묵인하는 것이 아니고, 온유함은 필요한 교정을 피하는 것이 아니며, 용서는 책임을 없애는 것이 아니다. 반대로 책임과 기준도 통제·정죄·보복으로 변질시키지 않는다.
- 성경이 직접 가르치는 원칙과 그 원칙을 현재 상황에 적용한 코치의 판단을 구분한다.
- 성경 사례나 구절은 실제 상황과 연결될 때만 사용하고, 본문에 없는 말이나 행동을 만들지 않는다.
- 현재 정보만으로 원인을 확정할 수 없으면 확인해야 할 부분으로 남긴다.
- 사용자가 말하지 않은 날짜, 조직 규칙, 도구, 대화 내용, 상대의 심리·신앙 상태를 사실처럼 만들지 않는다.
- 회사식 인사관리 절차를 기본값으로 사용하지 않는다. 강릉학생회의 사명자·학생회원·동역·섬김 맥락에 맞춘다.

"""
          if anchor not in text:
              raise SystemExit("shared prompt anchor not found")
          text = text.replace(anchor, insertion, 1)

          old = "- 실제로 언제, 누구에게, 무엇을, 어떻게 할지 구체적으로 제시한다.\\n"
          new = """- 실제로 언제, 누구에게, 무엇을, 어떻게 할지 구체적으로 제시한다. 단, 사용자가 제공하지 않은 날짜나 조직 절차를 임의로 만들지 않는다. 필요하면 '다음 모임 전', '오늘 가능한 때'처럼 상대적인 표현을 사용한다.
- 존재한다고 확인되지 않은 서면 경고, 주간 체크인, 특정 앱·문서·메일 등의 절차를 정답처럼 제시하지 않는다.
- 행동을 제시할 때는 무엇을 하라에서 끝내지 말고, 왜 사명자로서 이것이 옳은지와 어디까지 책임질 것인지가 드러나게 한다.
"""
          if old not in text:
              raise SystemExit("execution prompt anchor not found")
          text = text.replace(old, new, 1)

          old2 = "- 마지막에는 사용자가 실제로 옮길 수 있는 행동 또는 기억할 한 문장으로 마무리한다.\\n"
          new2 = """- 마지막에는 사용자가 실제로 옮길 수 있는 행동 또는 기억할 한 문장으로 마무리한다.
- 답변의 중심은 보고서가 아니라 코칭이다. 표는 꼭 필요할 때만 사용하고 휴대폰에서 읽기 쉽게 작성한다.
- 성경적 원칙은 별도 장식 섹션 하나로 끝내지 말고 핵심 판단과 행동에 실제로 반영한다.
- 사용자가 잘못한 부분이 없으면 억지로 '내가 놓친 부분'을 만들지 않는다. 반대로 실제 맹점이 드러나면 분명하게 말한다.
"""
          if old2 not in text:
              raise SystemExit("closing prompt anchor not found")
          text = text.replace(old2, new2, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify and self-remove
        run: |
          set -euo pipefail
          grep -q "\\[최우선 판단 원칙\\]" workers/ai-gateway/src/coachingFeature.ts
          grep -q "사용자가 제공하지 않은 날짜" workers/ai-gateway/src/coachingFeature.ts
          rm .github/workflows/one-time-coaching-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/ai-gateway/src/coachingFeature.ts .github/workflows/one-time-coaching-quality.yml
          git commit -m "fix: deepen biblical mission leader coaching"
          git push origin main
