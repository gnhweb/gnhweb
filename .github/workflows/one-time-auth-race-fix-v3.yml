name: One-time Auth Race Fix v3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch auth bootstrap race
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/hooks/useAuth.tsx')
          s = p.read_text()

          if 'const authEventVersionRef = useRef(0);' not in s:
              s, n = re.subn(
                  r'(const refreshFailureHandledRef = useRef\(false\);\n)',
                  r'\1  // Monotonically increases for auth actions/events to prevent stale bootstrap overwrites.\n  const authEventVersionRef = useRef(0);\n',
                  s,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('failed to insert authEventVersionRef')

          if 'const getSessionVersion = authEventVersionRef.current;' not in s:
              s, n = re.subn(
                  r'\n    supabase\.auth\.getSession\(\)\n',
                  '\n    const getSessionVersion = authEventVersionRef.current;\n\n    supabase.auth.getSession()\n',
                  s,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('failed to insert getSessionVersion')

          guard = "        if (authEventVersionRef.current !== getSessionVersion) {\n          sessionRestoredRef.current = true;\n          return;\n        }\n"
          target = "        if (!isMounted) return;\n        sessionRestoredRef.current = true;\n"
          if guard not in s:
              if target not in s:
                  raise SystemExit('failed to find getSession success block')
              s = s.replace(target, "        if (!isMounted) return;\n" + guard + "        sessionRestoredRef.current = true;\n", 1)

          catch_guard = "        if (authEventVersionRef.current !== getSessionVersion) {\n          sessionRestoredRef.current = true;\n          return;\n        }\n"
          catch_target = "      .catch((err) => {\n        if (!isMounted) return;\n"
          if catch_guard not in s:
              if catch_target not in s:
                  raise SystemExit('failed to find getSession catch block')
              s = s.replace(catch_target, catch_target + catch_guard, 1)

          if 'authEventVersionRef.current += 1;\n\n      if (event ===' not in s:
              pattern = r'(const \{ data: \{ subscription \} \} = supabase\.auth\.onAuthStateChange\(\(event, session\) => \{\n\s*if \(!isMounted\) return;\n)'
              s, n = re.subn(pattern, r'\1      authEventVersionRef.current += 1;\n\n', s, count=1)
              if n != 1:
                  raise SystemExit('failed to patch auth listener')

          if 'Mark successful sign-in newer than the initial bootstrap read.' not in s:
              pattern = r'(const signedInUser = data\.user \?\? null;\n\s*if \(signedInUser\) \{\n)'
              repl = r'\1        // Mark successful sign-in newer than the initial bootstrap read.\n        authEventVersionRef.current += 1;\n'
              s, n = re.subn(pattern, repl, s, count=1)
              if n != 1:
                  raise SystemExit('failed to patch signIn')

          if 'const signOut = useCallback(async () => {\n    authEventVersionRef.current += 1;' not in s:
              pattern = r'(const signOut = useCallback\(async \(\) => \{\n)'
              s, n = re.subn(pattern, r'\1    authEventVersionRef.current += 1;\n', s, count=1)
              if n != 1:
                  raise SystemExit('failed to patch signOut')

          p.write_text(s)

      - name: Verify patch markers
        run: |
          grep -q "const authEventVersionRef = useRef(0);" src/hooks/useAuth.tsx
          grep -q "const getSessionVersion = authEventVersionRef.current;" src/hooks/useAuth.tsx
          grep -q "authEventVersionRef.current += 1;" src/hooks/useAuth.tsx

      - name: Commit patch and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-auth-race-fix-v3.yml
          git add src/hooks/useAuth.tsx .github/workflows/one-time-auth-race-fix-v3.yml
          git commit -m "fix: prevent stale auth bootstrap from overwriting login state"
          git push
