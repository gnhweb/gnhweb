name: Fix worship insights lint

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove unused import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/feature/WorshipAttendanceInsights.tsx')
          text = path.read_text()
          text = text.replace("import { ROLE_HIERARCHY } from '@/types/auth';\n", '')
          path.write_text(text)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/WorshipAttendanceInsights.tsx
          git commit -m "fix: remove unused worship insights import"
          git rm .github/workflows/fix-worship-insights-lint.yml
          git commit -m "chore: remove temporary lint fix workflow"
          git push origin main
