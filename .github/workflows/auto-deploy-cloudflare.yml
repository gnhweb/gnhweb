name: Auto Deploy Cloudflare

# Single production pipeline: one push to main deploys the site and all
# production Workers from the exact same commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-auto-deploy
  cancel-in-progress: true

env:
  VITE_CF_REALTIME_URL: https://gnhweb-realtime.gemini19840314.workers.dev

jobs:
  regression-guard:
    name: Guard critical pages against accidental regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check critical file changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push; diff guard skipped."
            exit 0
          fi

          # Large rewrites of critical UI files are blocked by default. This
          # prevents an accidental whole-file replacement from reaching
          # production. Intentional large refactors must be explicitly marked
          # in the commit message with [large-change-approved].
          check_large_change() {
            local path="$1"
            local limit="$2"
            local stats
            stats=$(git diff --numstat "$BEFORE_SHA" "$HEAD_SHA" -- "$path" || true)
            if [ -z "$stats" ]; then
              return 0
            fi

            local added deleted total
            added=$(awk '{sum += $1} END {print sum + 0}' <<< "$stats")
            deleted=$(awk '{sum += $2} END {print sum + 0}' <<< "$stats")
            total=$((added + deleted))
            echo "$path: added=$added deleted=$deleted total=$total limit=$limit"

            if [ "$total" -gt "$limit" ] && [[ "$COMMIT_MESSAGE" != *"[large-change-approved]"* ]]; then
              echo "ERROR: $path changed by $total lines."
              echo "For an intentional large refactor, include [large-change-approved] in the commit message."
              exit 1
            fi
          }

          # Club detail is especially sensitive because it contains the detail
          # UI, Q&A, save flow, and photo handling in one page.
          check_large_change "src/pages/clubs/detail/page.tsx" 300
          check_large_change "router/config.tsx" 250
          check_large_change "src/hooks/useAuth.tsx" 250

      - name: Verify club detail structural invariants
        run: |
          set -euo pipefail
          file="src/pages/clubs/detail/page.tsx"
          for marker in \
            "saveClubDetail" \
            "handlePhotoUpload" \
            "PhotoLightbox"; do
            if ! grep -q "$marker" "$file"; then
              echo "ERROR: critical club detail marker missing: $marker"
              echo "If this is intentional, review the page manually before deployment."
              exit 1
            fi
          done


  preflight-production:
    name: Preflight production deployment
    needs: regression-guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_MISSION_EMAIL: ${{ secrets.E2E_MISSION_EMAIL }}
      E2E_MISSION_PASSWORD: ${{ secrets.E2E_MISSION_PASSWORD }}
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required CI secrets
        run: |
          set -euo pipefail
          missing=0
          check_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "ERROR: Missing GitHub Actions secret: $name"
              missing=1
            fi
          }
          check_secret "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN"
          check_secret "NEON_DATABASE_URL" "$NEON_DATABASE_URL"
          check_secret "E2E_MEMBER_EMAIL" "$E2E_MEMBER_EMAIL"
          check_secret "E2E_MEMBER_PASSWORD" "$E2E_MEMBER_PASSWORD"
          check_secret "E2E_MISSION_EMAIL" "$E2E_MISSION_EMAIL"
          check_secret "E2E_MISSION_PASSWORD" "$E2E_MISSION_PASSWORD"
          check_secret "E2E_TEACHER_EMAIL" "$E2E_TEACHER_EMAIL"
          check_secret "E2E_TEACHER_PASSWORD" "$E2E_TEACHER_PASSWORD"
          if [ "$missing" -ne 0 ]; then
            echo "Production deployment stopped before any Cloudflare deployment."
            exit 1
          fi
          case "$NEON_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "ERROR: NEON_DATABASE_URL is not a PostgreSQL connection URL."
              exit 1
              ;;
          esac

      - name: Validate Cloudflare authentication
        run: npx wrangler@4 whoami

      - name: Validate AI Gateway runtime configuration
        working-directory: workers/ai-gateway
        run: |
          set -euo pipefail

          # Coaching uses the Cloudflare Workers AI binding as its primary
          # provider. External API keys are optional fallbacks, so their
          # absence must not block a deployment.
          node <<'NODE'
          const fs = require('node:fs');
          const config = fs.readFileSync('wrangler.jsonc', 'utf8');

          if (!/"ai"\s*:\s*\{[\s\S]*?"binding"\s*:\s*"AI"/.test(config)) {
            console.error('ERROR: workers/ai-gateway/wrangler.jsonc does not declare the required AI binding.');
            process.exit(1);
          }

          console.log('Cloudflare Workers AI binding verified: env.AI');
          NODE

          secrets="$(npx wrangler@4 secret list --config wrangler.jsonc --format json)"
          SECRET_LIST_JSON="$secrets" node <<'NODE'
          const optionalFallbacks = [
            'OPENROUTER_API_KEY',
            'GEMINI_API_KEY',
            'MISTRAL_API_KEY',
            'XAI_API_KEY',
          ];

          let payload;
          try {
            payload = JSON.parse(process.env.SECRET_LIST_JSON ?? '');
          } catch (error) {
            console.error('ERROR: Cloudflare AI Gateway secret list was not valid JSON.');
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          }

          if (!Array.isArray(payload)) {
            console.error('ERROR: Cloudflare AI Gateway secret list response is not an array.');
            process.exit(1);
          }

          const names = new Set(
            payload
              .filter((entry) => entry && typeof entry === 'object')
              .map((entry) => entry.name)
              .filter((name) => typeof name === 'string'),
          );

          const available = optionalFallbacks.filter((name) => names.has(name));

          if (available.length === 0) {
            console.log('No optional external coaching provider secrets configured; Workers AI will be the only coaching provider.');
          } else {
            console.log(`Optional external coaching fallback secret(s) configured: ${available.join(', ')}`);
          }
          NODE

      - name: Validate existing API Worker secrets
        working-directory: workers/api
        run: |
          set -euo pipefail

          secrets="$(npx wrangler@4 secret list --config wrangler.jsonc --format json)"
          printf '%s\n' "$secrets"

          SECRET_LIST_JSON="$secrets" node <<'NODE'
          const required = [
            'WEB_PUSH_VAPID_PUBLIC_KEY',
            'WEB_PUSH_VAPID_PRIVATE_KEY',
            'WEB_PUSH_VAPID_SUBJECT',
          ];

          let payload;
          try {
            payload = JSON.parse(process.env.SECRET_LIST_JSON ?? '');
          } catch (error) {
            console.error('ERROR: Cloudflare secret list was not valid JSON.');
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          }

          if (!Array.isArray(payload)) {
            console.error('ERROR: Cloudflare secret list response is not an array.');
            process.exit(1);
          }

          const names = new Set(
            payload
              .filter((entry) => entry && typeof entry === 'object')
              .map((entry) => entry.name)
              .filter((name) => typeof name === 'string'),
          );

          const missing = required.filter((name) => !names.has(name));

          if (missing.length > 0) {
            console.error(`ERROR: Missing production API Worker secrets: ${missing.join(', ')}`);
            console.error('Production deployment stopped before any Cloudflare deployment.');
            process.exit(1);
          }

          console.log('Production API Worker required secrets verified.');
          NODE

      - name: Install site dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline
      - name: Type-check site before deployment
        run: npm run type-check
      - name: Lint site before deployment
        run: npm run lint
      - name: Build site before deployment
        run: npm run build
        env:
          VITE_CF_REALTIME_URL: ${{ env.VITE_CF_REALTIME_URL }}
      - name: Build Pages Functions before deployment
        run: npx wrangler@4 pages functions build functions --outdir out --output-routes-path out/_routes.json --minify

      - name: Upload verified Pages build
        uses: actions/upload-artifact@v4
        with:
          name: production-pages-build-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 2

      - name: Install API Worker dependencies
        working-directory: workers/api
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Dry-run API Worker
        working-directory: workers/api
        run: npx wrangler@4 deploy --config wrangler.jsonc --dry-run
      - name: Dry-run AI Gateway Worker
        working-directory: workers/ai-gateway
        run: npx wrangler@4 deploy --config wrangler.jsonc --dry-run
      - name: Dry-run realtime Worker
        working-directory: workers/realtime
        run: npx wrangler@4 deploy --config wrangler.jsonc --dry-run
      - name: Dry-run storage Worker
        working-directory: workers/storage
        run: npx wrangler@4 deploy --config wrangler.jsonc --dry-run
      - name: Dry-run storage migration Worker
        working-directory: workers/storage-migrate
        run: npx wrangler@4 deploy --config wrangler.jsonc --dry-run

  deploy-site:
    name: Deploy gnhweb Cloudflare Pages site
    needs: [verify-api, verify-storage-cors, deploy-realtime, deploy-storage-migrate, verify-ai-gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node22-deps-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-deps-
      - name: Install site dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline
      - name: Type-check site
        run: npm run type-check
      - name: Lint site
        run: npm run lint
      - name: Build site
        run: npm run build
        env:
          VITE_CF_REALTIME_URL: ${{ env.VITE_CF_REALTIME_URL }}
      - name: Build Pages Functions
        run: npx wrangler pages functions build functions --outdir out --output-routes-path out/_routes.json --minify
      - name: Download verified Pages build
        uses: actions/download-artifact@v4
        with:
          name: production-pages-build-${{ github.sha }}
          path: out

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          command: pages deploy out --project-name gnhweb



  deploy-realtime:
    name: Deploy gnhweb realtime Worker
    needs: [regression-guard, preflight-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/realtime
          command: deploy --config wrangler.jsonc

  deploy-storage:
    name: Deploy gnhweb storage Worker
    needs: [regression-guard, preflight-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/storage
          command: deploy --config wrangler.jsonc

  verify-storage-cors:
    name: Verify gnhweb storage CORS preflight
    needs: deploy-storage
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pages origin preflight
        run: |
          set -euo pipefail
          headers_file=$(mktemp)
          status=$(curl --silent --show-error --dump-header "$headers_file" --output /tmp/storage-options.txt --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://gnhwebw.pages.dev' \
            --header 'Access-Control-Request-Method: PUT' \
            --header 'Access-Control-Request-Headers: authorization,content-type,x-upsert,cache-control' \
            'https://gnhweb-storage.gemini19840314.workers.dev/v1/storage/public/memories/cors-check.jpg')
          cat /tmp/storage-options.txt
          cat "$headers_file"
          test "$status" = "204"
          grep -iq '^access-control-allow-origin: https://gnhwebw.pages.dev' "$headers_file"
          grep -iq '^access-control-allow-methods:.*PUT' "$headers_file"
          grep -iq '^access-control-allow-headers:.*authorization' "$headers_file"
      - name: Verify actual PUT request returns a CORS-visible auth response
        run: |
          set -euo pipefail
          headers_file=$(mktemp)
          response_file=$(mktemp)
          status=$(curl --silent --show-error --dump-header "$headers_file" --output "$response_file" --write-out '%{http_code}' \
            --request PUT \
            --header 'Origin: https://gnhwebw.pages.dev' \
            --header 'Authorization: Bearer invalid-test-token' \
            --header 'Content-Type: image/jpeg' \
            --header 'X-Upsert: true' \
            --data-binary 'storage-cors-put-check' \
            'https://gnhweb-storage.gemini19840314.workers.dev/v1/storage/public/memories/cors-check.jpg')
          cat "$response_file"
          cat "$headers_file"
          test "$status" = "401"
          grep -iq '^access-control-allow-origin: https://gnhwebw.pages.dev' "$headers_file"
          grep -iq '^access-control-allow-methods:.*PUT' "$headers_file"
          grep -iq '^access-control-allow-headers:.*authorization' "$headers_file"

      - name: Verify unknown Pages deployment origin is not blocked by CORS
        run: |
          set -euo pipefail
          headers_file=$(mktemp)
          status=$(curl --silent --show-error --dump-header "$headers_file" --output /tmp/storage-options-preview.txt --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://preview-123.gnhwebw.pages.dev' \
            --header 'Access-Control-Request-Method: PUT' \
            --header 'Access-Control-Request-Headers: authorization,content-type,x-upsert' \
            'https://gnhweb-storage.gemini19840314.workers.dev/v1/storage/public/memories/cors-check.jpg')
          cat /tmp/storage-options-preview.txt
          cat "$headers_file"
          test "$status" = "204"
          grep -iq '^access-control-allow-origin: https://preview-123.gnhwebw.pages.dev' "$headers_file"

  deploy-storage-migrate:
    name: Deploy gnhweb storage migration Worker
    needs: [regression-guard, preflight-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/storage-migrate
          command: deploy --config wrangler.jsonc

  deploy-api:
    name: Deploy gnhweb API Worker
    needs: [regression-guard, preflight-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync production API Worker database secret
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL"
          printf '%s' "$NEON_DATABASE_URL" | npx wrangler@4 secret put DATABASE_URL --config wrangler.jsonc

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/api
          command: deploy --config wrangler.jsonc

      - name: Verify production API Worker secret state
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(npx wrangler@4 secret list --config wrangler.jsonc --format json)"
          printf '%s\n' "$existing"
          SECRET_LIST_JSON="$existing" node <<'NODE'
          let payload;
          try {
            payload = JSON.parse(process.env.SECRET_LIST_JSON ?? '');
          } catch (error) {
            console.error('ERROR: Cloudflare secret list was not valid JSON after synchronization.');
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          }

          if (!Array.isArray(payload)) {
            console.error('ERROR: Cloudflare secret list response is not an array after synchronization.');
            process.exit(1);
          }

          const hasDatabaseUrl = payload.some(
            (entry) => entry && typeof entry === 'object' && entry.name === 'DATABASE_URL',
          );

          if (!hasDatabaseUrl) {
            console.error('ERROR: DATABASE_URL is missing after synchronization.');
            process.exit(1);
          }

          console.log('Production API Worker DATABASE_URL secret verified after synchronization.');
          NODE

  verify-api:
    name: Verify gnhweb API public routes
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: Verify Web Push VAPID public key
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            'https://gnhweb-api.gemini19840314.workers.dev/web-push-public-key')
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Eq '"publicKey":"[^"]{20,}"'

      - name: Verify account migration CORS preflight
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/account-migration-options.json --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://gnhwebw.pages.dev' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            'https://gnhweb-api.gemini19840314.workers.dev/account-password-migration')
          cat /tmp/account-migration-options.json
          test "$status" = "204"
      - name: Verify account migration rejects incomplete requests
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/account-migration-post.json --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://gnhwebw.pages.dev' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            'https://gnhweb-api.gemini19840314.workers.dev/account-password-migration')
          cat /tmp/account-migration-post.json
          test "$status" = "400"
      - name: Verify prayer relay auth guard
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/prayer-relay-response.json --write-out '%{http_code}' --request GET 'https://gnhweb-api.gemini19840314.workers.dev/prayer-relay?status=active&limit=1')
          cat /tmp/prayer-relay-response.json
          test "$status" = "401"

      - name: Verify passkey route auth guard
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/passkey-response.json --write-out '%{http_code}' --request GET 'https://gnhweb-api.gemini19840314.workers.dev/passkey?action=list')
          cat /tmp/passkey-response.json
          test "$status" = "401"


  deploy-ai-gateway:
    name: Deploy gnhweb AI gateway Worker
    needs: [regression-guard, preflight-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/ai-gateway
          command: deploy --config wrangler.jsonc

  verify-production-smoke:
    name: Verify critical production flows
    needs: [deploy-site, deploy-ai-gateway, cloudflare-health]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://gnhwebw.pages.dev
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_MISSION_EMAIL: ${{ secrets.E2E_MISSION_EMAIL }}
      E2E_MISSION_PASSWORD: ${{ secrets.E2E_MISSION_PASSWORD }}
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm and Playwright downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
            node_modules
          key: ${{ runner.os }}-node20-e2e-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-e2e-
      - name: Install test dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Check production reachability
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL")
            echo "attempt=$attempt status=$status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then exit 0; fi
            sleep 5
          done
          echo "Production did not become reachable: $E2E_BASE_URL"
          exit 1
      # Shared E2E accounts are intentionally exercised serially.
      - name: Verify home memory carousel
        run: npx playwright test tests/e2e/home-memory-carousel.spec.ts
      - name: Verify memory board upload and delete
        run: npx playwright test tests/e2e/memory-board-crud-production.spec.ts --project=mobile-chromium
      - name: Verify home calendar event dots
        run: npx playwright test tests/e2e/home-calendar-production.spec.ts --project=mobile-chromium
      - name: Verify authenticated Small Mission
        run: npx playwright test tests/e2e/small-mission-production.spec.ts --project=mobile-chromium
      - name: Verify authenticated attendance
        run: npx playwright test tests/e2e/attendance-production.spec.ts --project=mobile-chromium
      - name: Verify authenticated Bible quiz
        run: npx playwright test tests/e2e/bible-quiz-production.spec.ts --project=mobile-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-critical-smoke-report
          path: playwright-report/
          if-no-files-found: ignore
  verify-ai-gateway:
    name: Verify AI gateway
    needs: deploy-ai-gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: POST /nim-mbti smoke test
        run: |
          set -euo pipefail
