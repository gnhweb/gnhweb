name: Auto Deploy Cloudflare

# Single production pipeline: one push to main deploys the site and all
# production Workers from the exact same commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-auto-deploy
  cancel-in-progress: true

env:
  VITE_CF_REALTIME_URL: https://gnhweb-realtime.gemini19840314.workers.dev

jobs:
  regression-guard:
    name: Guard critical pages against accidental regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check critical file changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push; diff guard skipped."
            exit 0
          fi

          # Large rewrites of critical UI files are blocked by default. This
          # prevents an accidental whole-file replacement from reaching
          # production. Intentional large refactors must be explicitly marked
          # in the commit message with [large-change-approved].
          check_large_change() {
            local path="$1"
            local limit="$2"
            local stats
            stats=$(git diff --numstat "$BEFORE_SHA" "$HEAD_SHA" -- "$path" || true)
            if [ -z "$stats" ]; then
              return 0
            fi

            local added deleted total
            added=$(awk '{sum += $1} END {print sum + 0}' <<< "$stats")
            deleted=$(awk '{sum += $2} END {print sum + 0}' <<< "$stats")
            total=$((added + deleted))
            echo "$path: added=$added deleted=$deleted total=$total limit=$limit"

            if [ "$total" -gt "$limit" ] && [[ "$COMMIT_MESSAGE" != *"[large-change-approved]"* ]]; then
              echo "ERROR: $path changed by $total lines."
              echo "For an intentional large refactor, include [large-change-approved] in the commit message."
              exit 1
            fi
          }

          # Club detail is especially sensitive because it contains the detail
          # UI, Q&A, save flow, and photo handling in one page.
          check_large_change "src/pages/clubs/detail/page.tsx" 300
          check_large_change "router/config.tsx" 250
          check_large_change "src/hooks/useAuth.tsx" 250

      - name: Verify club detail structural invariants
        run: |
          set -euo pipefail
          file="src/pages/clubs/detail/page.tsx"
          for marker in \
            "saveClubDetail" \
            "handlePhotoUpload" \
            "PhotoLightbox"; do
            if ! grep -q "$marker" "$file"; then
              echo "ERROR: critical club detail marker missing: $marker"
              echo "If this is intentional, review the page manually before deployment."
              exit 1
            fi
          done

  deploy-site:
    name: Deploy gnhweb Cloudflare Pages site
    needs: regression-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install site dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline
      - name: Type-check site
        run: npm run type-check
      - name: Lint site
        run: npm run lint
      - name: Build site
        run: npm run build
        env:
          VITE_CF_REALTIME_URL: ${{ env.VITE_CF_REALTIME_URL }}
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          command: pages deploy out --project-name gnhweb


  production-load-test:
    name: Measure production homepage loading
    needs: deploy-site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOAD_TEST_BASE_URL: https://gnhwebw.pages.dev
      LOAD_TEST_HOLD_SECONDS: '30'
      LOAD_TEST_NAVIGATION_TIMEOUT_MS: '30000'
      LOAD_TEST_WORKLOAD: mixed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm and Playwright downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-load-test-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-load-test-${{ hashFiles('package.json') }}-
            ${{ runner.os }}-load-test-

      - name: Install test dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check production reachability
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' "$LOAD_TEST_BASE_URL")
            echo "attempt=$attempt status=$status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then exit 0; fi
            sleep 10
          done
          echo "Production did not become reachable: $LOAD_TEST_BASE_URL"
          exit 1

      - name: Run production load test
        run: |
          set -euo pipefail
          export LOAD_TEST_HOLD_MS=$((LOAD_TEST_HOLD_SECONDS * 1000))
          mkdir -p load-test-results
          node scripts/load-test-production.mjs | tee load-test-results/result.txt

      - name: Add load-test summary
        if: always()
        run: |
          {
            echo '## Production Load Test'
            echo
            echo "- Target: $LOAD_TEST_BASE_URL"
            echo '- Stages: 1 → 10 → 30 → 50 → 75 → 100 concurrent sessions'
            echo '- Mixed public-route navigation (schedule/clubs/notices/games/tools/faith/news/search)'
            echo
            echo '```text'
            cat load-test-results/result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload load-test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-load-test-result
          path: load-test-results/result.txt
          if-no-files-found: error
      - name: Publish load-test telemetry to GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f load-test-results/result.txt ]; then
            gh issue comment 65 --repo gnhweb/gnhweb --body "## Production load test

          - Commit: \`${GITHUB_SHA}\`
          - Result file was not produced. Check the load-test job logs." || true
            exit 0
          fi
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path("load-test-results/result.txt").read_text(encoding="utf-8")
          match = re.search(r"=== LOAD_TEST_RESULT_JSON ===\s*(\{.*\})\s*$", text, re.S)
          if not match:
              body = "## Production load test\n\n- Could not parse LOAD_TEST_RESULT_JSON. See workflow artifact/logs."
          else:
              data = json.loads(match.group(1))
              lines = [
                  "## Production load test",
                  "",
                  f"- Commit: `${GITHUB_SHA}`",
                  f"- Generated: `{data.get('generatedAt', 'unknown')}`",
                  f"- Target: `{data.get('baseUrl', 'unknown')}`",
              ]
              for result in data.get("stages", []):
                  lines.append(
                      f"- {result['concurrency']} concurrent: "
                      f"success={result['success']}/{result['total']}, "
                      f"failure={result['failureRate']}%, "
                      f"TTFB median/p95={result['ttfbMedianMs']}/{result['ttfbP95Ms']}ms, "
                      f"DCL median/p95={result['domContentLoadedMedianMs']}/{result['domContentLoadedP95Ms']}ms, "
                      f"total median/p95={result['medianMs']}/{result['p95Ms']}ms"
                  )
              body = "\n".join(lines)
          Path("/tmp/load-test-issue-body.md").write_text(body, encoding="utf-8")
          PY
          gh issue comment 65 --repo gnhweb/gnhweb --body-file /tmp/load-test-issue-body.md || true

  production-home-e2e:
    name: Verify production home after Pages deploy
    needs: deploy-site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      E2E_BASE_URL: https://gnhwebw.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm and Playwright downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-e2e-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-${{ hashFiles('package.json') }}-
            ${{ runner.os }}-e2e-
      - name: Install test dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check production reachability
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL")
            echo "attempt=$attempt status=$status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then exit 0; fi
            sleep 10
          done
          echo "Production did not become reachable: $E2E_BASE_URL"
          exit 1

      - name: Verify home memory carousel
        env:
          E2E_MISSION_EMAIL: ${{ secrets.E2E_MISSION_EMAIL }}
          E2E_MISSION_PASSWORD: ${{ secrets.E2E_MISSION_PASSWORD }}
        run: npx playwright test tests/e2e/home-memory-carousel.spec.ts --project=mobile-chromium

      - name: Verify home calendar event dots
        env:
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
        run: npx playwright test tests/e2e/home-calendar-production.spec.ts --project=mobile-chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-home-memory-carousel-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy-realtime:
    name: Deploy gnhweb realtime Worker
    needs: regression-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/realtime
          command: deploy --config wrangler.jsonc

  deploy-storage:
    name: Deploy gnhweb storage Worker
    needs: regression-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/storage
          command: deploy --config wrangler.jsonc

  verify-storage-cors:
    name: Verify gnhweb storage CORS preflight
    needs: deploy-storage
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pages origin preflight
        run: |
          set -euo pipefail
          headers_file=$(mktemp)
          status=$(curl --silent --show-error --dump-header "$headers_file" --output /tmp/storage-options.txt --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://gnhwebw.pages.dev' \
            --header 'Access-Control-Request-Method: PUT' \
            --header 'Access-Control-Request-Headers: authorization,content-type,x-upsert,cache-control' \
            'https://gnhweb-storage.gemini19840314.workers.dev/v1/storage/public/memories/cors-check.jpg')
          cat /tmp/storage-options.txt
          cat "$headers_file"
          test "$status" = "204"
          grep -iq '^access-control-allow-origin: https://gnhwebw.pages.dev' "$headers_file"
          grep -iq '^access-control-allow-methods:.*PUT' "$headers_file"
          grep -iq '^access-control-allow-headers:.*authorization' "$headers_file"
      - name: Verify actual PUT request returns a CORS-visible auth response
        run: |
          set -euo pipefail
          headers_file=$(mktemp)
          response_file=$(mktemp)
          status=$(curl --silent --show-error --dump-header "$headers_file" --output "$response_file" --write-out '%{http_code}' \
            --request PUT \
            --header 'Origin: https://gnhwebw.pages.dev' \
            --header 'Authorization: Bearer invalid-test-token' \
            --header 'Content-Type: image/jpeg' \
            --header 'X-Upsert: true' \
            --data-binary 'storage-cors-put-check' \
            'https://gnhweb-storage.gemini19840314.workers.dev/v1/storage/public/memories/cors-check.jpg')
          cat "$response_file"
          cat "$headers_file"
          test "$status" = "401"
          grep -iq '^access-control-allow-origin: https://gnhwebw.pages.dev' "$headers_file"
          grep -iq '^access-control-allow-methods:.*PUT' "$headers_file"
          grep -iq '^access-control-allow-headers:.*authorization' "$headers_file"

      - name: Verify unknown Pages deployment origin is not blocked by CORS
        run: |
          set -euo pipefail
          headers_file=$(mktemp)
          status=$(curl --silent --show-error --dump-header "$headers_file" --output /tmp/storage-options-preview.txt --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://preview-123.gnhwebw.pages.dev' \
            --header 'Access-Control-Request-Method: PUT' \
            --header 'Access-Control-Request-Headers: authorization,content-type,x-upsert' \
            'https://gnhweb-storage.gemini19840314.workers.dev/v1/storage/public/memories/cors-check.jpg')
          cat /tmp/storage-options-preview.txt
          cat "$headers_file"
          test "$status" = "204"
          grep -iq '^access-control-allow-origin: https://preview-123.gnhwebw.pages.dev' "$headers_file"

  deploy-storage-migrate:
    name: Deploy gnhweb storage migration Worker
    needs: regression-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/storage-migrate
          command: deploy --config wrangler.jsonc

  deploy-api:
    name: Deploy gnhweb API Worker
    needs: regression-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/api
          command: deploy --config wrangler.jsonc
      - name: Sync production API Worker secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$NEON_DATABASE_URL"

          printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL --config wrangler.jsonc

          existing="$(npx wrangler secret list --config wrangler.jsonc)"
          printf '%s\n' "$existing"
          for name in WEB_PUSH_VAPID_PUBLIC_KEY WEB_PUSH_VAPID_PRIVATE_KEY WEB_PUSH_VAPID_SUBJECT; do
            if ! printf '%s\n' "$existing" | grep -q "\"name\": \"$name\""; then
              echo "ERROR: Missing Cloudflare Worker secret: $name"
              echo "Run the one-time Bootstrap Web Push VAPID workflow before deploying the API Worker."
              exit 1
            fi
          done


  verify-api:
    name: Verify gnhweb API public routes
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: Verify Web Push VAPID public key
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            'https://gnhweb-api.gemini19840314.workers.dev/web-push-public-key')
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Eq '"publicKey":"[^"]{20,}"'

      - name: Verify account migration CORS preflight
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/account-migration-options.json --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://gnhwebw.pages.dev' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            'https://gnhweb-api.gemini19840314.workers.dev/account-password-migration')
          cat /tmp/account-migration-options.json
          test "$status" = "204"
      - name: Verify account migration rejects incomplete requests
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/account-migration-post.json --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://gnhwebw.pages.dev' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            'https://gnhweb-api.gemini19840314.workers.dev/account-password-migration')
          cat /tmp/account-migration-post.json
          test "$status" = "400"
      - name: Verify prayer relay auth guard
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/prayer-relay-response.json --write-out '%{http_code}' --request GET 'https://gnhweb-api.gemini19840314.workers.dev/prayer-relay?status=active&limit=1')
          cat /tmp/prayer-relay-response.json
          test "$status" = "401"

      - name: Verify passkey route auth guard
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/passkey-response.json --write-out '%{http_code}' --request GET 'https://gnhweb-api.gemini19840314.workers.dev/passkey?action=list')
          cat /tmp/passkey-response.json
          test "$status" = "401"


  deploy-ai-gateway:
    name: Deploy gnhweb AI gateway Worker
    needs: regression-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/ai-gateway
          command: deploy --config wrangler.jsonc

  verify-production-quiz:
    name: Verify authenticated production Bible quiz
    needs: [deploy-site, deploy-ai-gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://gnhwebw.pages.dev
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm and Playwright downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-e2e-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-
      - name: Install test dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated Bible quiz smoke test
        run: npx playwright test tests/e2e/bible-quiz-production.spec.ts --project=mobile-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bible-quiz-report
          path: playwright-report/
          if-no-files-found: ignore

  verify-production-attendance:
    name: Verify authenticated production attendance
    # E2E_MISSION_* is shared by the home memory and Small Mission tests.
    # Attendance starts only after the shared-account flow has finished.
    needs: [deploy-site, verify-production-small-mission]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://gnhwebw.pages.dev
      E2E_MISSION_EMAIL: ${{ secrets.E2E_MISSION_EMAIL }}
      E2E_MISSION_PASSWORD: ${{ secrets.E2E_MISSION_PASSWORD }}
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm and Playwright downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-e2e-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-
      - name: Install test dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated attendance smoke test
        run: npx playwright test tests/e2e/attendance-production.spec.ts --project=mobile-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-attendance-report
          path: playwright-report/
          if-no-files-found: ignore

  verify-production-small-mission:
    name: Verify authenticated production Small Mission
    # This job shares E2E_MISSION_* with the production home memory test.
    # Keep the shared Neon Auth account out of concurrent browser sessions.
    needs: [deploy-site, production-home-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://gnhwebw.pages.dev
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm and Playwright downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-e2e-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-
      - name: Install test dependencies
        run: npm install --include=dev --no-audit --no-fund --prefer-offline
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated Small Mission smoke test
        run: npx playwright test tests/e2e/small-mission-production.spec.ts --project=mobile-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-small-mission-report
          path: playwright-report/
          if-no-files-found: ignore

  verify-ai-gateway:
    name: Verify AI gateway
    needs: deploy-ai-gateway
    runs-on: ubuntu-latest
    steps:
      - name: POST /nim-mbti smoke test
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --request POST --header 'Content-Type: application/json' --data '{"answers":["1"]}' 'https://gnhweb-ai-gateway.gemini19840314.workers.dev/nim-mbti')
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '\"character\"'
      - name: POST /nim-coaching production smoke test
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          http_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
