name: Fix enhanced Bible MBTI images

on:
  push:
    paths:
      - '.github/workflows/fix-enhanced-mbti-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace sprite renderer with direct character assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/pages/bibleMbtiEnhanced/page.tsx')
          text = path.read_text(encoding='utf-8')
          pattern = r"function FigureIllustration\(\{name,className\}:\{name:Figure;className:string\}\)\{.*?\n\}\n\nfunction calculate"
          replacement = '''function FigureIllustration({name,className}:{name:Figure;className:string}){
           const slugs:Record<Figure,string>={다니엘:'daniel',요셉:'joseph',룻:'ruth',바나바:'barnabas',베드로:'peter',느헤미야:'nehemiah',에스더:'esther',디모데:'timothy',다윗:'david',마리아:'mary',아브라함:'abraham',모세:'moses',여호수아:'joshua',사무엘:'samuel',엘리야:'elijah',이사야:'isaiah',예레미야:'jeremiah',바울:'paul',요한:'john',마르다:'martha'};
           const slug=slugs[name];
           return <div role="img" aria-label={`${name} 성경인물 프로필`} className={`overflow-hidden ${className}`}>
             <img src={`/bible-mbti/characters-new/${slug}.svg?v=20260909-3`} alt="" aria-hidden="true" loading="lazy" decoding="async" className="h-full w-full object-contain" />
           </div>;
          }

          function calculate'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('FigureIllustration block was not found exactly once; refusing to modify the file.')
          path.write_text(new_text, encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/bibleMbtiEnhanced/page.tsx
          git rm .github/workflows/fix-enhanced-mbti-images.yml
          git commit -m 'fix enhanced Bible MBTI character images'
          git push
