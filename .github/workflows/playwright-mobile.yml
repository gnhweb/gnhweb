name: Playwright Mobile E2E

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: development
  E2E_BASE_URL: https://gnhweb.vercel.app
  E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
  E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
  E2E_MISSION_EMAIL: ${{ secrets.E2E_MISSION_EMAIL }}
  E2E_MISSION_PASSWORD: ${{ secrets.E2E_MISSION_PASSWORD }}
  E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
  E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
  E2E_CHIEF_EMAIL: ${{ secrets.E2E_CHIEF_EMAIL }}
  E2E_CHIEF_PASSWORD: ${{ secrets.E2E_CHIEF_PASSWORD }}
  E2E_PRESIDENT_EMAIL: ${{ secrets.E2E_PRESIDENT_EMAIL }}
  E2E_PRESIDENT_PASSWORD: ${{ secrets.E2E_PRESIDENT_PASSWORD }}
  E2E_ASSIGNED_TEACHER_EMAIL: ${{ secrets.E2E_ASSIGNED_TEACHER_EMAIL }}
  E2E_ASSIGNED_TEACHER_PASSWORD: ${{ secrets.E2E_ASSIGNED_TEACHER_PASSWORD }}

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --include=dev --cache "/tmp/npm-cache-${{ github.run_id }}"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check production reachability
        run: |
          for attempt in {1..30}; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL")
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then exit 0; fi
            sleep 10
          done
          echo "Production did not become reachable: $E2E_BASE_URL"
          exit 1
      - name: Run mobile E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
