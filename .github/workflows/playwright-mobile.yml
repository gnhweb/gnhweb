name: Playwright Mobile E2E

on:
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: development
  E2E_BASE_URL: http://127.0.0.1:8788

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev --cache "/tmp/npm-cache-${{ github.run_id }}"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build site for local Pages runtime
        run: npm run build

      - name: Start local Cloudflare Pages runtime
        run: |
          npx --yes wrangler@4.143.0 pages dev out --ip 127.0.0.1 --port 8788 > /tmp/gnhweb-pages.log 2>&1 &
          echo $! > /tmp/gnhweb-pages.pid

      - name: Check local Pages reachability
        run: |
          for attempt in {1..30}; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL" || true)
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then exit 0; fi
            sleep 2
          done
          echo "Local Pages runtime did not become reachable: $E2E_BASE_URL"
          cat /tmp/gnhweb-pages.log
          exit 1

      - name: Run mobile E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
