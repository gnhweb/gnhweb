name: Playwright Mobile E2E

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://gnhweb.vercel.app' }}
  E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
  E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
  E2E_MISSION_EMAIL: ${{ secrets.E2E_MISSION_EMAIL }}
  E2E_MISSION_PASSWORD: ${{ secrets.E2E_MISSION_PASSWORD }}
  E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
  E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
  E2E_CHIEF_EMAIL: ${{ secrets.E2E_CHIEF_EMAIL }}
  E2E_CHIEF_PASSWORD: ${{ secrets.E2E_CHIEF_PASSWORD }}
  E2E_PRESIDENT_EMAIL: ${{ secrets.E2E_PRESIDENT_EMAIL }}
  E2E_PRESIDENT_PASSWORD: ${{ secrets.E2E_PRESIDENT_PASSWORD }}
  E2E_ASSIGNED_TEACHER_EMAIL: ${{ secrets.E2E_ASSIGNED_TEACHER_EMAIL }}
  E2E_ASSIGNED_TEACHER_PASSWORD: ${{ secrets.E2E_ASSIGNED_TEACHER_PASSWORD }}

jobs:
  mobile-e2e:
    name: Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check authentication test configuration
        shell: bash
        run: |
          missing=0
          for name in \
            E2E_MEMBER_EMAIL E2E_MEMBER_PASSWORD \
            E2E_MISSION_EMAIL E2E_MISSION_PASSWORD \
            E2E_TEACHER_EMAIL E2E_TEACHER_PASSWORD \
            E2E_CHIEF_EMAIL E2E_CHIEF_PASSWORD \
            E2E_PRESIDENT_EMAIL E2E_PRESIDENT_PASSWORD \
            E2E_ASSIGNED_TEACHER_EMAIL E2E_ASSIGNED_TEACHER_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then exit 1; fi
      - name: List Playwright tests
        run: npx playwright test tests/e2e/mobile-smoke.spec.ts tests/e2e/site-audit.spec.ts --list > playwright-list.log 2>&1
      - name: Run mobile smoke
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/mobile-smoke.spec.ts 2>&1 | tee mobile-smoke.log
      - name: Run authenticated site audit
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/site-audit.spec.ts 2>&1 | tee site-audit.log
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-diagnostics
          path: |
            playwright-list.log
            mobile-smoke.log
            site-audit.log
            playwright-report/
            test-results/
          retention-days: 14
