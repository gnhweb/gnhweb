name: Playwright Mobile E2E

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Always test the live production site, including pull_request runs.
  E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://gnhweb.vercel.app' }}
  E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
  E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
  E2E_MISSION_EMAIL: ${{ secrets.E2E_MISSION_EMAIL }}
  E2E_MISSION_PASSWORD: ${{ secrets.E2E_MISSION_PASSWORD }}
  E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
  E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
  E2E_CHIEF_EMAIL: ${{ secrets.E2E_CHIEF_EMAIL }}
  E2E_CHIEF_PASSWORD: ${{ secrets.E2E_CHIEF_PASSWORD }}
  E2E_PRESIDENT_EMAIL: ${{ secrets.E2E_PRESIDENT_EMAIL }}
  E2E_PRESIDENT_PASSWORD: ${{ secrets.E2E_PRESIDENT_PASSWORD }}
  E2E_ASSIGNED_TEACHER_EMAIL: ${{ secrets.E2E_ASSIGNED_TEACHER_EMAIL }}
  E2E_ASSIGNED_TEACHER_PASSWORD: ${{ secrets.E2E_ASSIGNED_TEACHER_PASSWORD }}

jobs:
  mobile-e2e:
    name: Mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Check authentication test configuration
        shell: bash
        run: |
          missing=0
          for name in \
            E2E_MEMBER_EMAIL E2E_MEMBER_PASSWORD \
            E2E_MISSION_EMAIL E2E_MISSION_PASSWORD \
            E2E_TEACHER_EMAIL E2E_TEACHER_PASSWORD \
            E2E_CHIEF_EMAIL E2E_CHIEF_PASSWORD \
            E2E_PRESIDENT_EMAIL E2E_PRESIDENT_PASSWORD \
            E2E_ASSIGNED_TEACHER_EMAIL E2E_ASSIGNED_TEACHER_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Configure all 12 role-specific E2E secrets before running authenticated production E2E."
            exit 1
          fi

      - name: Run mobile E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-test-results
          path: test-results/
          retention-days: 14
