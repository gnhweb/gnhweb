name: Repair Bible MBTI supplied art

on:
  push:
    paths:
      - '.github/workflows/repair-bible-mbti-art.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the known-good sprite and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git show da2402ea47a9e7ea3434d297ffdd9f4baf9d3252^:public/bible-mbti/characters.svg > public/bible-mbti/characters.svg
          rm -f .github/workflows/repair-bible-mbti-art.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/bible-mbti/characters.svg .github/workflows/repair-bible-mbti-art.yml
          git commit -m 'revert: restore Bible MBTI sprite after failed repair'
          git push
