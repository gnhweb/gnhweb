name: Finalize Bible MBTI art

on:
  push:
    paths:
      - '.github/workflows/repair-bible-mbti-art.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point Bible MBTI to the downloaded character art
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/bibleMbti/page.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = r"function CharacterIllustration\(\{ name, className \}: \{ name: string; className\?: string \}\) \{.*?\n\}\n\nconst axisLabels"
          replacement = '''const MBTI_CHARACTER_SLUG: Record<string, string> = {
            모세: 'moses', 아브라함: 'abraham', 여호수아: 'joshua', 다윗: 'david', 요셉: 'joseph',
            룻: 'ruth', 에스더: 'esther', 다니엘: 'daniel', 바울: 'paul', 베드로: 'peter',
            느헤미야: 'nehemiah', 디모데: 'timothy', 바나바: 'barnabas', 마리아: 'mary', 엘리야: 'elijah',
            이사야: 'isaiah', 예레미야: 'jeremiah', 사무엘: 'samuel', 마르다: 'martha', 요한: 'john',
          };

          function CharacterIllustration({ name, className }: { name: string; className?: string }) {
            const slug = MBTI_CHARACTER_SLUG[name];
            if (!slug) return <div className={className} aria-hidden="true" />;

            return (
              <div role="img" aria-label={`${name} 성경인물 일러스트`} className={`relative overflow-hidden ${className ?? ''}`}>
                <img
                  src={`/bible-mbti/characters/${slug}.webp`}
                  alt={`${name} 성경인물`}
                  loading="lazy"
                  decoding="async"
                  className="h-full w-full object-contain"
                  onError={(event) => {
                    const image = event.currentTarget;
                    if (image.dataset.fallback === 'true') return;
                    image.dataset.fallback = 'true';
                    image.src = `/bible-mbti/characters/${slug}.svg`;
                  }}
                />
              </div>
            );
          }

          const axisLabels'''
          updated, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('CharacterIllustration block not found')
          p.write_text(updated, encoding='utf-8')
          PY

          rm -f public/bible-mbti/characters-cute.svg public/bible-mbti/characters.svg public/bible-mbti/david-cute.svg public/bible-mbti/figure-portraits.webp public/bible-mbti/supplied-characters.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/bibleMbti/page.tsx public/bible-mbti
          git commit -m 'fix: use new Bible MBTI character art' || exit 0
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-bible-mbti-art.yml
          git commit -m 'chore: remove one-time MBTI art workflow'
          git push
