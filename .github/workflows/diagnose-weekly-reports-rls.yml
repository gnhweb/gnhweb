name: Diagnose Weekly Reports RLS

on:
  push:
    branches: [diagnose-weekly-reports-rls]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Verify Neon target and weekly report policies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL"
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align --field-separator=$'\t' -c "
            SELECT
              policyname,
              cmd,
              array_to_string(roles, ','),
              coalesce(qual, ''),
              coalesce(with_check, '')
            FROM pg_policies
            WHERE schemaname = 'public' AND tablename = 'weekly_reports'
            ORDER BY policyname;
          "
          echo "=== has_role_at_least definition ==="
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align -c "
            SELECT pg_get_functiondef(p.oid)
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' AND p.proname = 'has_role_at_least'
            ORDER BY p.oid;
          "
          echo "=== get_user_role definition ==="
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align -c "
            SELECT pg_get_functiondef(p.oid)
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' AND p.proname = 'get_user_role'
            ORDER BY p.oid;
          "
          echo "=== weekly report distribution ==="
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align -c "
            SELECT club, deleted_at IS NOT NULL AS deleted, status, count(*)
            FROM public.weekly_reports
            GROUP BY club, deleted_at IS NOT NULL, status
            ORDER BY club, deleted, status;
          "
          echo "=== active user roles ==="
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align -c "
            SELECT role, count(*)
            FROM public.user_roles
            WHERE is_active = true
            GROUP BY role
            ORDER BY role;
          "
          echo "=== weekly report constraints ==="
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align -c "
            SELECT conname, pg_get_constraintdef(oid)
            FROM pg_constraint
            WHERE conrelid = 'public.weekly_reports'::regclass
            ORDER BY conname;
          "
          echo "=== weekly report indexes ==="
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align -c "
            SELECT indexname, indexdef
            FROM pg_indexes
            WHERE schemaname = 'public' AND tablename = 'weekly_reports'
            ORDER BY indexname;
          "
          echo "=== teacher club assignments ==="
          psql "$NEON_DATABASE_URL" --set ON_ERROR_STOP=1 --tuples-only --no-align -c "
            SELECT club, count(*)
            FROM public.club_teachers
            GROUP BY club
            ORDER BY club;
          "
