name: Apply weekly report delete policy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-weekly-delete-policy]')
    runs-on: ubuntu-latest
    steps:
      - name: Apply production Neon policy
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL"
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          drop policy if exists "weekly_reports_delete_author_or_teacher_chief" on public.weekly_reports;

          create policy "weekly_reports_delete_author_or_teacher_chief"
          on public.weekly_reports
          for delete
          using (
            author_id = (select auth.uid())
            or get_user_role() in ('teacher', 'chief')
          );
          SQL
          echo "Weekly report DELETE policy applied."
