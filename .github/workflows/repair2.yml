name: Typecheck repair 2
on:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - name: Apply exact type fixes
        run: |
          python3 -c "from pathlib import Path; p=Path('src/lib/supabase.ts'); s=p.read_text(); s=s.replace(\"neonAuth.getJWTToken?.()\", \"neonAuth.getJWTToken?.(true)\"); s=s.replace(\"options?: { body?: unknown; method?: string }\", \"options?: { body?: unknown; method?: 'PUT' | 'DELETE' | 'GET' | 'POST' | 'PATCH' }\"); s=s.replace(\"target.invoke(functionName, options)\", \"target.invoke(functionName, options as Parameters<typeof target.invoke>[1])\"); s=s.replace(\"body: method === 'GET' || method === 'HEAD' ? undefined :\", \"body: method === 'GET' ? undefined :\"); start=s.index(\"      case 'removeChannel':\"); end=s.index(\"      case 'removeAllChannels':\", start); block=\"      case 'removeChannel':\\n        return (channel: ReturnType<typeof legacySupabase.channel> | CloudflareRealtimeChannel) => {\\n          const cloudflareChannel = channel as unknown as CloudflareRealtimeChannel;\\n          if (cloudflareChannels.has(cloudflareChannel)) {\\n            cloudflareChannels.delete(cloudflareChannel);\\n            void cloudflareChannel.unsubscribe();\\n            return Promise.resolve('ok' as const);\\n          }\\n          disposeNeonRealtimeChannel(channel as ReturnType<typeof legacySupabase.channel>);\\n          return Promise.resolve('ok' as const);\\n        };\\n\"; s=s[:start]+block+s[end:]; p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('src/pages/home/page.tsx'); s=p.read_text(); import re; s,n=re.subn(r'\\.catch\\(\\(\\) => \\{\\}\\);', '.then(undefined, () => {});', s, count=1); assert n==1, f'home promise handler not found: {n}'; p.write_text(s)"
          python3 -c "from pathlib import Path; import base64; p=Path('src/pages/notebookCopilot/page.tsx'); s=p.read_text(); old='          const pdfjs: any = await import(/* @vite-ignore */ \"https://esm.sh/pdfjs-dist@4.0.379/build/pdf.mjs\");'; new=base64.b64decode('').decode(); assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Type check
        run: npm run type-check
      - name: Commit repaired source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/supabase.ts src/pages/home/page.tsx src/pages/notebookCopilot/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: resolve remaining typecheck errors"
          git push
