name: Typecheck repair 2
on:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - name: Apply fixes
        run: |
          python3 -c "from pathlib import Path; p=Path('src/lib/supabase.ts'); s=p.read_text(); s=s.replace(\"neonAuth.getJWTToken?.()\", \"neonAuth.getJWTToken?.(true)\"); s=s.replace(\"options?: { body?: unknown; method?: string }\", \"options?: { body?: unknown; method?: 'PUT' | 'DELETE' | 'GET' | 'POST' | 'PATCH' }\"); s=s.replace(\"return target.invoke(functionName, options);\", \"return target.invoke(functionName, options as Parameters<typeof target.invoke>[1]);\"); s=s.replace(\"return (channel: ReturnType<typeof legacySupabase.channel>) => {\", \"return (channel: ReturnType<typeof legacySupabase.channel> | CloudflareRealtimeChannel) => {\"); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('src/pages/home/page.tsx'); s=p.read_text(); s=s.replace(\"      })\\n      .catch(() => {});\", \"      }, () => {});\", 1); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('src/pages/notebookCopilot/page.tsx'); s=p.read_text(); s=s.replace('const pdfjs: any = await import(/* @vite-ignore */ \\\"https://esm.sh/pdfjs-dist@4.0.379/build/pdf.mjs\\\");', 'const pdfjs = await import(/* @vite-ignore */ \\\"https://esm.sh/pdfjs-dist@4.0.379/build/pdf.mjs\\\");', 1); p.write_text(s)"
          mkdir -p src/types
          cat > src/types/remote-modules.d.ts <<'EOF'
          declare module "https://esm.sh/pdfjs-dist@4.0.379/build/pdf.mjs" {
            interface PdfPage { getTextContent(): Promise<{ items: Array<{ str?: string }> }>; }
            interface PdfDocument { numPages: number; getPage(pageNumber: number): Promise<PdfPage>; }
            interface PdfJsModule { GlobalWorkerOptions: { workerSrc: string }; getDocument(options: { data: ArrayBuffer }): { promise: Promise<PdfDocument> }; }
            const pdfjs: PdfJsModule;
            export = pdfjs;
          }
          EOF
      - run: npm run type-check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "fix: resolve typecheck errors" || exit 0
          git push