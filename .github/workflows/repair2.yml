name: Typecheck repair 2
on:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/lib/supabase.ts')
          s = p.read_text()
          s = s.replace("neonAuth.getJWTToken?.()", "neonAuth.getJWTToken?.(true)")
          s = s.replace("options?: { body?: unknown; method?: string }", "options?: { body?: unknown; method?: 'PUT' | 'DELETE' | 'GET' | 'POST' | 'PATCH' }")
          s = s.replace("target.invoke(functionName, options)", "target.invoke(functionName, options as Parameters<typeof target.invoke>[1])")
          s = s.replace("body: method === 'GET' || method === 'HEAD' ? undefined :", "body: method === 'GET' ? undefined :")
          old = '''      case 'removeChannel':
        return (channel: ReturnType<typeof legacySupabase.channel>) => {
          if (channel instanceof CloudflareRealtimeChannel) {
            cloudflareChannels.delete(channel);
            void channel.unsubscribe();
            return Promise.resolve('ok' as const);
          }
          disposeNeonRealtimeChannel(channel);
          return Promise.resolve('ok' as const);
        };'''
          new = '''      case 'removeChannel':
        return (channel: ReturnType<typeof legacySupabase.channel> | CloudflareRealtimeChannel) => {
          const cloudflareChannel = channel as unknown as CloudflareRealtimeChannel;
          if (cloudflareChannels.has(cloudflareChannel)) {
            cloudflareChannels.delete(cloudflareChannel);
            void cloudflareChannel.unsubscribe();
            return Promise.resolve('ok' as const);
          }
          disposeNeonRealtimeChannel(channel as ReturnType<typeof legacySupabase.channel>);
          return Promise.resolve('ok' as const);
        };'''
          if old in s:
              s = s.replace(old, new)
          else:
              pattern = r"      case 'removeChannel':[\s\S]*?        };"
              s, count = re.subn(pattern, new, s, count=1)
              if count != 1:
                  raise SystemExit('removeChannel block not found')
          p.write_text(s)

          p = Path('src/pages/home/page.tsx')
          s = p.read_text()
          s, count = re.subn(r'\.catch\(\(\) => \{\}\);', '.then(undefined, () => {});', s, count=1)
          if count != 1:
              raise SystemExit('home catch target not found')
          p.write_text(s)

          p = Path('src/pages/notebookCopilot/page.tsx')
          s = p.read_text()
          old = 'const pdfjs = await import(/* @vite-ignore */ "https://esm.sh/pdfjs-dist@4.0.379/build/pdf.mjs");'
          new = '''type PdfJsModule = {
            GlobalWorkerOptions: { workerSrc: string };
            getDocument(options: { data: ArrayBuffer }): {
              promise: Promise<{
                numPages: number;
                getPage(pageNumber: number): Promise<{
                  getTextContent(): Promise<{ items: Array<{ str?: string }> }>;
                }>;
              }>;
            };
          };
          const loadPdfJs = new Function('url', 'return import(url)') as (url: string) => Promise<PdfJsModule>;
          const pdfjs = await loadPdfJs('https://esm.sh/pdfjs-dist@4.0.379/build/pdf.mjs');'''
          if old in s:
              s = s.replace(old, new)
          else:
              pattern = r'const pdfjs = await import\(/\* @vite-ignore \*/ "https://esm\.sh/pdfjs-dist@4\.0\.379/build/pdf\.mjs"\);'
              s, count = re.subn(pattern, new, s, count=1)
              if count != 1:
                  raise SystemExit('pdfjs import target not found')
          p.write_text(s)
          PY
      - run: npm run type-check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "fix: resolve typecheck errors"
          git push