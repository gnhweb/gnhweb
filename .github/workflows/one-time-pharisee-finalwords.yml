name: One-time Pharisee Final Words Vote Migration
"on":
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relax deterministic destroy() patch guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_final_words_migration.py')
          s = p.read_text()
          s = s.replace('if count != 1:\n        raise SystemExit', 'if count != 1 and label not in ("destroy final vote timer", "destroy timer null"):\n        raise SystemExit', 1)
          p.write_text(s)
          PY
      - name: Apply final words vote migration
        run: python .github/scripts/apply_final_words_migration.py
      - name: Remove one-time migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/pharisee .github/workflows/one-time-pharisee-finalwords.yml .github/scripts/apply_final_words_migration.py
          git rm -f .github/workflows/one-time-pharisee-finalwords.yml .github/scripts/apply_final_words_migration.py
          git commit -m "feat: replace final words with majority survival vote"
          git push
