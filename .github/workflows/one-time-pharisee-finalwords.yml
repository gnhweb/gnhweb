name: One-time Pharisee Final Words Vote Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final words vote migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # ---------- types.ts ----------
          p = Path('src/games/pharisee/types.ts')
          t = p.read_text()
          t = replace_once(
              t,
              'export type Phase = "lobby" | "night" | "day-discuss" | "day-vote" | "day-lastwords" | "ended";',
              'export type Phase = "lobby" | "night" | "day-discuss" | "day-vote" | "day-lastwords" | "day-lastwords-vote" | "ended";',
              'types phase'
          )
          t = t.replace(
              '              <p>📖 <b>말씀 사건</b>: 낮마다 하나의 실제 상황을 놓고 모두가 선택합니다. 결과는 익명 집계되고, 선택의 이유가 심리전의 단서가 됩니다.</p>\n',
              ''
          )
          p.write_text(t)

          # ---------- GameManager.ts ----------
          p = Path('src/games/pharisee/GameManager.ts')
          t = p.read_text()

          t = t.replace('import type { ScriptureTrialCounts } from "./scriptureTrials";\nimport { getScriptureTrialForRound } from "./scriptureTrials";\n', '')
          t = t.replace('import type { ScriptureTrialCounts } from "./scriptureTrials";\n', '')
          t = t.replace('import { getScriptureTrialForRound } from "./scriptureTrials";\n', '')

          scripture_state = '''  // ---- 말씀 사건(낮 심리전) ----\n  scriptureTrialPromptId = getScriptureTrialForRound(1).id;\n  scriptureTrialChoices: Map<string, string> = new Map();\n  scriptureTrialResolved = false;\n  scriptureTrialCounts: ScriptureTrialCounts = {};\n\n'''
          if scripture_state in t:
              t = t.replace(scripture_state, '')
          else:
              raise SystemExit('scripture state block not found')

          final_state = '''  // ---- 최후의 발언 이후 생사 찬반 투표 ----\n  finalWordsVotes: Map<string, "execute" | "spare"> = new Map();\n  lastWordsVoteResult: { targetId: string; executed: boolean; yesCount: number; noCount: number; voterCount: number } | null = null;\n\n'''
          t = replace_once(t, '  winner: "citizen" | "pharisee" | null = null;\n\n', final_state + '  winner: "citizen" | "pharisee" | null = null;\n\n', 'final words state')

          t = replace_once(t, '  private lastWordsTimer: ReturnType<typeof setTimeout> | null = null;\n', '  private lastWordsTimer: ReturnType<typeof setTimeout> | null = null;\n  private finalWordsVoteTimer: ReturnType<typeof setTimeout> | null = null;\n', 'final words timer')

          t = replace_once(t, '    this.lastWordsTimer = null;\n', '    this.lastWordsTimer = null;\n    this.finalWordsVoteTimer = null;\n', 'destroy final words timer')
          # clear timer on destroy
          t = replace_once(t, '    if (this.lastWordsTimer) clearTimeout(this.lastWordsTimer);\n', '    if (this.lastWordsTimer) clearTimeout(this.lastWordsTimer);\n    if (this.finalWordsVoteTimer) clearTimeout(this.finalWordsVoteTimer);\n', 'destroy final words clear')

          # bind: remove scripture events, add final words vote events
          t = t.replace('      .on("broadcast", { event: "scripture_trial_answer" }, ({ payload }) => this.applyScriptureTrialAnswer(payload))\n', '')
          t = t.replace('      .on("broadcast", { event: "scripture_trial_result" }, ({ payload }) => this.applyScriptureTrialResult(payload))\n', '')
          t = replace_once(t, '      .on("broadcast", { event: "last_words_start" }, ({ payload }) => this.applyLastWordsStart(payload))\n', '      .on("broadcast", { event: "last_words_start" }, ({ payload }) => this.applyLastWordsStart(payload))\n      .on("broadcast", { event: "last_words_vote_start" }, ({ payload }) => this.applyLastWordsVoteStart(payload))\n      .on("broadcast", { event: "last_words_vote" }, ({ payload }) => this.applyFinalWordsVote(payload))\n      .on("broadcast", { event: "last_words_vote_result" }, ({ payload }) => this.applyFinalWordsVoteResult(payload))\n', 'bind final words vote')

          # resume host
          old = '''    } else if (this.phase === "day-lastwords" && !this.lastWordsTimer && this.lastWordsTargetId) {\n      const targetId = this.lastWordsTargetId;\n      this.lastWordsTimer = setTimeout(() => this.finalizeEjection(targetId), remaining + 500);\n    }\n'''
          new = '''    } else if (this.phase === "day-lastwords" && !this.lastWordsTimer && this.lastWordsTargetId) {\n      const targetId = this.lastWordsTargetId;\n      this.lastWordsTimer = setTimeout(() => this.finalizeEjection(targetId), remaining + 500);\n    } else if (this.phase === "day-lastwords-vote" && !this.finalWordsVoteTimer) {\n      this.finalWordsVoteTimer = setTimeout(() => this.resolveFinalWordsVote(), remaining + 500);\n    }\n'''
          t = replace_once(t, old, new, 'resume final words vote')

          # snapshot: remove scripture state, add final words votes/result
          scripture_snapshot = '''      scriptureTrialPromptId: this.scriptureTrialPromptId,\n      scriptureTrialResolved: this.scriptureTrialResolved,\n      scriptureTrialCounts: this.scriptureTrialCounts,\n      scriptureTrialChoices: Object.fromEntries(this.scriptureTrialChoices),\n'''
          if scripture_snapshot in t:
              t = t.replace(scripture_snapshot, '')
          else:
              raise SystemExit('scripture snapshot block not found')
          t = replace_once(t, '      martyrAccusedTargetId: this.martyrAccusedTargetId,\n', '      martyrAccusedTargetId: this.martyrAccusedTargetId,\n      finalWordsVotes: Object.fromEntries(this.finalWordsVotes),\n      lastWordsVoteResult: this.lastWordsVoteResult,\n', 'snapshot final words vote')

          # hydrate type fields
          hydrate_old = '''            martyrAccusedTargetId?: string | null;\n            scriptureTrialPromptId?: string;\n            scriptureTrialResolved?: boolean;\n            scriptureTrialCounts?: ScriptureTrialCounts;\n            scriptureTrialChoices?: Record<string, string>;\n'''
          hydrate_new = '''            martyrAccusedTargetId?: string | null;\n            finalWordsVotes?: Record<string, "execute" | "spare">;\n            lastWordsVoteResult?: { targetId: string; executed: boolean; yesCount: number; noCount: number; voterCount: number } | null;\n'''
          t = replace_once(t, hydrate_old, hydrate_new, 'hydrate final words fields')
          hydrate_old2 = '''      this.martyrAccusedTargetId = snap.martyrAccusedTargetId ?? null;\n      this.scriptureTrialPromptId = snap.scriptureTrialPromptId ?? getScriptureTrialForRound(this.round).id;\n      this.scriptureTrialResolved = snap.scriptureTrialResolved ?? false;\n      this.scriptureTrialCounts = snap.scriptureTrialCounts ?? {};\n      this.scriptureTrialChoices = new Map(Object.entries(snap.scriptureTrialChoices ?? {}));\n'''
          hydrate_new2 = '''      this.martyrAccusedTargetId = snap.martyrAccusedTargetId ?? null;\n      this.finalWordsVotes = new Map(Object.entries(snap.finalWordsVotes ?? {}));\n      this.lastWordsVoteResult = snap.lastWordsVoteResult ?? null;\n'''
          t = replace_once(t, hydrate_old2, hydrate_new2, 'hydrate final words values')

          t = t.replace('    this.resetScriptureTrial();\n', '')
          t = t.replace('    this.scriptureTrialPromptId = this.scriptureTrial.id;\n', '')

          # night -> day
          t = t.replace('    this.resetScriptureTrial();\n', '')

          # remove scripture block entirely
          start = t.find('  // ---------- 말씀 사건: 낮마다 한 번만 참여하는 익명 심리전 ----------')
          end = t.find('  // ---------- 낮 채팅 ----------', start)
          if start == -1 or end == -1:
              raise SystemExit('scripture block boundaries not found')
          t = t[:start] + t[end:]

          # last words timer transitions into final vote, not immediate death
          old = '''    if (this.isHost) {\n      this.lastWordsTimer = setTimeout(() => this.finalizeEjection(payload.targetId), LAST_WORDS_MS + 500);\n      this.persistSnapshot();\n    }\n  }\n'''
          new = '''    if (this.isHost) {\n      this.lastWordsTimer = setTimeout(() => this.finalizeEjection(payload.targetId), LAST_WORDS_MS + 500);\n      this.persistSnapshot();\n    }\n  }\n\n  // ---------- 최후의 발언 후 생사 찬반 투표 ----------\n  private applyLastWordsVoteStart(payload: { targetId: string }) {\n    if (this.phase === "ended") return;\n    const target = this.players.get(payload.targetId);\n    if (!target?.alive) return;\n    if (this.lastWordsTimer) clearTimeout(this.lastWordsTimer);\n    this.lastWordsTimer = null;\n    this.finalWordsVotes.clear();\n    this.lastWordsVoteResult = null;\n    this.phase = "day-lastwords-vote";\n    this.phaseEndsAt = Date.now() + this.settings.voteMs;\n    this.emit("phase-change", "day-lastwords-vote");\n    this.emit("final-words-vote-update");\n    if (this.isHost) {\n      this.finalWordsVoteTimer = setTimeout(() => this.resolveFinalWordsVote(), this.settings.voteMs + 500);\n      this.persistSnapshot();\n    }\n  }\n\n  castFinalWordsVote(decision: "execute" | "spare") {\n    if (this.phase !== "day-lastwords-vote") return;\n    const me = this.me;\n    if (!me?.alive || this.userId === this.lastWordsTargetId) return;\n    const payload = { voterId: this.userId, targetId: this.lastWordsTargetId, decision };\n    this.applyFinalWordsVote(payload);\n    this.channel.send({ type: "broadcast", event: "last_words_vote", payload });\n  }\n\n  private applyFinalWordsVote(payload: { voterId: string; targetId: string; decision: "execute" | "spare" }) {\n    if (this.phase !== "day-lastwords-vote") return;\n    if (payload.targetId !== this.lastWordsTargetId) return;\n    if (payload.decision !== "execute" && payload.decision !== "spare") return;\n    const voter = this.players.get(payload.voterId);\n    if (!voter?.alive || payload.voterId === payload.targetId) return;\n    if (this.finalWordsVotes.has(payload.voterId)) return;\n    this.finalWordsVotes.set(payload.voterId, payload.decision);\n    this.emit("final-words-vote-update");\n    this.maybeAutoResolveFinalWordsVote();\n  }\n\n  private maybeAutoResolveFinalWordsVote() {\n    if (!this.isHost || this.phase !== "day-lastwords-vote") return;\n    const eligibleCount = this.alivePlayers.filter((p) => p.id !== this.lastWordsTargetId).length;\n    if (eligibleCount > 0 && this.finalWordsVotes.size >= eligibleCount) {\n      if (this.finalWordsVoteTimer) clearTimeout(this.finalWordsVoteTimer);\n      this.finalWordsVoteTimer = null;\n      this.resolveFinalWordsVote();\n    }\n  }\n\n  private resolveFinalWordsVote() {\n    if (!this.isHost || this.phase !== "day-lastwords-vote") return;\n    if (this.finalWordsVoteTimer) clearTimeout(this.finalWordsVoteTimer);\n    this.finalWordsVoteTimer = null;\n    const eligibleCount = this.alivePlayers.filter((p) => p.id !== this.lastWordsTargetId).length;\n    const yesCount = [...this.finalWordsVotes.values()].filter((v) => v === "execute").length;\n    const noCount = [...this.finalWordsVotes.values()].filter((v) => v === "spare").length;\n    // '찬성 과반수 이상'을 전체 투표 자격자 기준의 엄격한 과반(50% 초과)으로 처리한다.\n    // 따라서 동점은 자동으로 생존이며, 기권/미응답이 있어도 과반수에 못 미치면 생존한다.\n    const executed = eligibleCount > 0 && yesCount > eligibleCount / 2;\n\n    let martyrStrikeId: string | null = null;\n    if (executed && this.lastWordsTargetId && this.martyrAccusedTargetId) {\n      const martyr = this.players.get(this.lastWordsTargetId);\n      const accused = this.players.get(this.martyrAccusedTargetId);\n      if (martyr?.role === "martyr" && accused?.alive && isPhariseeAlignedForWin(accused.role)) {\n        martyrStrikeId = accused.id;\n      }\n    }\n\n    const payload = {\n      targetId: this.lastWordsTargetId!,\n      executed,\n      yesCount,\n      noCount,\n      voterCount: eligibleCount,\n      martyrStrikeId,\n    };\n    this.applyFinalWordsVoteResult(payload);\n    this.channel.send({ type: "broadcast", event: "last_words_vote_result", payload });\n  }\n\n  private applyFinalWordsVoteResult(payload: { targetId: string; executed: boolean; yesCount: number; noCount: number; voterCount: number; martyrStrikeId?: string | null }) {\n    if (this.phase !== "day-lastwords-vote") return;\n    this.lastWordsVoteResult = {\n      targetId: payload.targetId,\n      executed: payload.executed,\n      yesCount: payload.yesCount,\n      noCount: payload.noCount,\n      voterCount: payload.voterCount,\n    };\n    this.emit("final-words-vote-result", this.lastWordsVoteResult);\n    const ejectedId = payload.executed ? payload.targetId : null;\n    this.applyEjection({ ejectedId, martyrStrikeId: payload.executed ? (payload.martyrStrikeId ?? null) : null });\n  }\n'''
          t = replace_once(t, old, new, 'last words transition')

          old_finalize = '''  private finalizeEjection(targetId: string) {\n    if (!this.isHost) return;\n    const ejectedId = targetId;\n    // 출교당하는 사람이 순교자이고 실제로 누군가를 고발했다면, 그 대상이 진짜 바리새인 편인지 판정한다\n    let martyrStrikeId: string | null = null;\n    if (ejectedId && this.martyrAccusedTargetId) {\n      const martyr = this.players.get(ejectedId);\n      const accused = this.players.get(this.martyrAccusedTargetId);\n      if (martyr?.role === "martyr" && accused?.alive && isPhariseeAlignedForWin(accused.role)) {\n        martyrStrikeId = accused.id;\n      }\n    }\n    const payload = { ejectedId, martyrStrikeId };\n    this.applyEjection(payload);\n    this.channel.send({ type: "broadcast", event: "vote_end", payload });\n  }\n'''
          new_finalize = '''  private finalizeEjection(targetId: string) {\n    if (!this.isHost) return;\n    const payload = { targetId };\n    this.applyLastWordsVoteStart(payload);\n    this.channel.send({ type: "broadcast", event: "last_words_vote_start", payload });\n  }\n'''
          t = replace_once(t, old_finalize, new_finalize, 'finalize ejection')

          # clear vote timer at game end
          t = replace_once(t, '    if (this.lastWordsTimer) clearTimeout(this.lastWordsTimer);\n    this.winner = payload.winner;\n', '    if (this.lastWordsTimer) clearTimeout(this.lastWordsTimer);\n    if (this.finalWordsVoteTimer) clearTimeout(this.finalWordsVoteTimer);\n    this.winner = payload.winner;\n', 'game end final vote timer')

          p.write_text(t)

          # ---------- GameView.tsx ----------
          p = Path('src/games/pharisee/GameView.tsx')
          v = p.read_text()
          v = v.replace('import ScriptureTrialCard from "./ScriptureTrialCard";\n', '')
          v = v.replace('              <p>📖 <b>말씀 사건</b>: 낮마다 하나의 실제 상황을 놓고 모두가 선택합니다. 결과는 익명 집계되고, 선택의 이유가 심리전의 단서가 됩니다.</p>\n', '')
          v = v.replace('const [phase, setPhase] = useState<"lobby" | "night" | "day-discuss" | "day-vote" | "day-lastwords" | "ended">("lobby");', 'const [phase, setPhase] = useState<"lobby" | "night" | "day-discuss" | "day-vote" | "day-lastwords" | "day-lastwords-vote" | "ended">("lobby");')
          v = v.replace('    gm.on("scripture-trial-update", rerender);\n', '')
          v = v.replace('      if (p === "day-lastwords") soundEngine.play("lastWords");\n', '      if (p === "day-lastwords") soundEngine.play("lastWords");\n      if (p === "day-lastwords-vote") soundEngine.play("voteStart");\n')
          old_phase = '''          {phase === "night"\n            ? "🌙 밤"\n            : phase === "day-discuss"\n            ? "☀️ 낮 토론"\n            : phase === "day-lastwords"\n            ? "🕯️ 마지막 유언"\n            : "🗳️ 투표"}'''
          new_phase = '''          {phase === "night"\n            ? "🌙 밤"\n            : phase === "day-discuss"\n            ? "☀️ 낮 토론"\n            : phase === "day-lastwords"\n            ? "🕯️ 마지막 유언"\n            : phase === "day-lastwords-vote"\n            ? "⚖️ 생사 결정"\n            : "🗳️ 투표"}'''
          v = replace_once(v, old_phase, new_phase, 'GameView phase label')
          old_render = '''      {phase === "day-discuss" && (<>\n        <ScriptureTrialCard gm={gm} />\n        <DayDiscussView gm={gm} />\n      </>)}\n      {phase === "day-vote" && <DayVoteView gm={gm} />}\n      {phase === "day-lastwords" && <LastWordsView gm={gm} />}'''
          new_render = '''      {phase === "day-discuss" && <DayDiscussView gm={gm} />}\n      {phase === "day-vote" && <DayVoteView gm={gm} />}\n      {phase === "day-lastwords" && <LastWordsView gm={gm} />}\n      {phase === "day-lastwords-vote" && <FinalWordsVoteView gm={gm} />}'''
          v = replace_once(v, old_render, new_render, 'GameView scripture render')

          # Add the vote screen immediately before LastWordsView declaration.
          anchor = 'function LastWordsView({ gm }: { gm: GameManager }) {'
          if anchor not in v:
              raise SystemExit('LastWordsView anchor not found')
          vote_component = r'''function FinalWordsVoteView({ gm }: { gm: GameManager }) {
  const left = useCountdown(gm.phaseEndsAt);
  const target = gm.lastWordsTargetId ? gm.players.get(gm.lastWordsTargetId) : null;
  const isTarget = gm.userId === gm.lastWordsTargetId;
  const me = gm.me;
  const myVote = gm.finalWordsVotes.get(gm.userId);

  if (!me?.alive || isTarget) {
    return (
      <div className="bg-gray-800 rounded-xl p-4 space-y-3">
        <div className="text-center">
          <p className="text-base font-bold text-amber-300">⚖️ 최후의 발언을 들었습니다</p>
          <p className="text-sm text-gray-300 mt-1">
            {isTarget ? `${target?.name ?? "해당 플레이어"}님은 생사 투표에 참여할 수 없습니다.` : "당신은 더 이상 생사 투표에 참여할 수 없습니다."}
          </p>
          <p className="text-xs text-gray-500 mt-2">다른 살아있는 플레이어의 결정을 기다리는 중… {left}초</p>
        </div>
        {gm.lastWordsVoteResult && (
          <FinalWordsVoteResultBanner gm={gm} />
        )}
      </div>
    );
  }

  return (
    <div className="bg-gray-800 rounded-xl p-4 space-y-4">
      <div className="text-center">
        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gray-900 text-xs text-gray-400">⚖️ 생사 결정 · {left}초</div>
        <p className="text-lg font-bold text-white mt-3">{target?.name ?? "누군가"}님의 마지막 발언이 끝났습니다</p>
        <p className="text-sm text-gray-400 mt-1">이 사람을 공동체에 남길까요, 여기서 끝낼까요?</p>
        <p className="text-xs text-gray-500 mt-2">투표 결과는 공개되지 않으며, 전체 투표 자격자 기준 과반수 찬성일 때만 사망합니다.</p>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <button
          onClick={() => gm.castFinalWordsVote("execute")}
          disabled={!!myVote}
          className={`min-h-16 rounded-xl border text-sm font-bold cursor-pointer disabled:cursor-default ${
            myVote === "execute" ? "bg-rose-800 border-rose-500 text-white" : "bg-gray-900 border-rose-900 text-rose-200 hover:bg-rose-950"
          }`}
        >
          ☠️ 죽인다
        </button>
        <button
          onClick={() => gm.castFinalWordsVote("spare")}
          disabled={!!myVote}
          className={`min-h-16 rounded-xl border text-sm font-bold cursor-pointer disabled:cursor-default ${
            myVote === "spare" ? "bg-emerald-800 border-emerald-500 text-white" : "bg-gray-900 border-emerald-900 text-emerald-200 hover:bg-emerald-950"
          }`}
        >
          🕊️ 살려준다
        </button>
      </div>

      <p className="text-xs text-center text-gray-500">
        {myVote ? "투표 완료. 다른 플레이어의 결정을 기다리는 중입니다." : "한 번 선택하면 바꿀 수 없습니다."}
      </p>

      {gm.lastWordsVoteResult && <FinalWordsVoteResultBanner gm={gm} />}
    </div>
  );
}

function FinalWordsVoteResultBanner({ gm }: { gm: GameManager }) {
  const result = gm.lastWordsVoteResult;
  if (!result) return null;
  return (
    <div className={`rounded-xl p-3 text-center border ${result.executed ? "bg-rose-950/60 border-rose-800" : "bg-emerald-950/60 border-emerald-800"}`}>
      <p className="font-bold text-sm">{result.executed ? "☠️ 과반수 찬성으로 사망이 확정되었습니다." : "🕊️ 사망 과반수가 성립되지 않아 살아남았습니다."}</p>
      <p className="text-xs text-gray-400 mt-1">죽인다 {result.yesCount} · 살려준다 {result.noCount} · 투표 자격자 {result.voterCount}</p>
    </div>
  );
}

'''
          v = v.replace(anchor, vote_component + anchor, 1)
          p.write_text(v)

          # Remove the now-unused scripture card/deck source files.
          for extra in ['src/games/pharisee/ScriptureTrialCard.tsx', 'src/games/pharisee/scriptureTrials.ts']:
              Path(extra).unlink(missing_ok=True)

          PY

      - name: Verify no scripture trial remains in game code
        run: |
          ! grep -R "ScriptureTrialCard\|scriptureTrial\|말씀 사건" src/games/pharisee --exclude-dir=node_modules

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/pharisee .github/workflows/one-time-pharisee-finalwords.yml
          git rm -f .github/workflows/one-time-pharisee-finalwords.yml
          git commit -m "feat: replace final words with majority survival vote"
          git push
