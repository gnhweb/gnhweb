name: One-time search final clean

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/one-time-search-final-clean.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix navbar search and remove bootstrap script
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/components/feature/Navbar.tsx')
          s = p.read_text(encoding='utf-8')

          # Make the second mobile navbar row a positioning context.
          s = s.replace(
              'className="flex items-center justify-between h-11 md:h-12"',
              'className="relative flex items-center justify-between h-11 md:h-12"',
              1,
          )

          # Remove any existing mobile menu search form so search is not duplicated in the menu.
          s, removed_form = re.subn(
              r'\s*<form onSubmit=\{\(e\) => \{ e\.preventDefault\(\); const q = globalSearch\.trim\(\); navigate\(q \? `/search\?q=\$\{encodeURIComponent\(q\)\}` : \'/search\'\); setMobileOpen\(false\); \}\} className="relative mb-4">[\s\S]*?</form>\n',
              '\n',
              s,
              count=1,
          )
          if removed_form != 1:
              raise SystemExit('mobile search form not found')

          # Remove a previously injected search button from mobile action group, if present.
          s = re.sub(
              r'\s*<button[^>]*data-mobile-search-button="true"[\s\S]*?</button>',
              '',
              s,
              count=1,
          )

          # Put the real search control on the far right of the mobile second row,
          # directly beneath the theme toggle in the row above.
          mobile_actions = re.search(
              r'(?P<actions><div className="flex md:hidden items-center gap-[^"]+">[\s\S]*?</div>)(?P<rowclose>\s*</div>\s*</div>\s*<AnimatePresence>)',
              s,
          )
          if not mobile_actions:
              raise SystemExit('mobile action group not found')
          search_button = '''\n              <Link to="/search" aria-label="검색" title="검색" className="absolute right-0 top-1/2 -translate-y-1/2 flex w-10 h-10 items-center justify-center rounded-full text-foreground-700 hover:bg-background-200 active:bg-background-200 transition-colors cursor-pointer">\n                <i className="ri-search-line text-[20px]"></i>\n              </Link>'''
          s = s[:mobile_actions.end('actions')] + search_button + s[mobile_actions.end('actions'):]

          # Keep the existing desktop search, but make its accessibility label simply "검색".
          s = s.replace('aria-label="사이트 검색"', 'aria-label="검색"')
          s = s.replace('aria-label="사이트 검색 열기"', 'aria-label="검색"')

          p.write_text(s, encoding='utf-8')

          h = Path('index.html')
          hs = h.read_text(encoding='utf-8')
          hs, removed_script = re.subn(
              r'\s*<script>\s*\(function \(\) \{\s*function renameSearchLabels\(\)[\s\S]*?</script>',
              '',
              hs,
              count=1,
          )
          if removed_script != 1:
              raise SystemExit('search bootstrap script not found')
          h.write_text(hs, encoding='utf-8')

      - name: Validate source shape
        shell: bash
        run: |
          grep -q 'to="/search" aria-label="검색"' src/components/feature/Navbar.tsx
          ! grep -q 'data-mobile-search-button' src/components/feature/Navbar.tsx
          ! grep -q 'placeholder="사이트 검색"' src/components/feature/Navbar.tsx
          ! grep -q 'function renameSearchLabels' index.html
          ! grep -q 'function placeMobileSearch' index.html
          ! grep -q 'MutationObserver' index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/Navbar.tsx index.html
          git commit -m "fix: render mobile search directly in navbar"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-search-final-clean.yml
          git commit -m "chore: remove one-time search cleanup workflow"
          git push
