name: repair-useauth-neon-signup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.sha == '5d0a8e09e38f5dd90a5b1d2c8b6085fc837e1d02'
    runs-on: ubuntu-latest
    steps:
      - name: Restore the previous auth hook and apply the minimal Neon signup fix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch useAuth.tsx
        shell: bash
        run: |
          git checkout b6dccdb481d98015a2ace063b6d23b0039465bdd -- src/hooks/useAuth.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/hooks/useAuth.tsx')
          s = p.read_text()
          old = "data: { name, role, club: club || null, birth_year: birthYear || null, gender: gender || null, birth_month: birthMonth || null, birth_day: birthDay || null, interests: interests || null, grade: grade || null },"
          new = "data: { name, club: club || null, birth_year: birthYear || null, gender: gender || null, birth_month: birthMonth || null, birth_day: birthDay || null, interests: interests || null, grade: grade || null },"
          if old not in s:
              raise SystemExit('Expected signup metadata line was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hooks/useAuth.tsx
          git commit -m 'fix: preserve auth hook and remove reserved signup role' || exit 0
          git push
