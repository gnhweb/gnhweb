name: One-time Bible MBTI image fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace data URI images with inline SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/bibleMbtiEnhanced/page.tsx')
          text = path.read_text()

          old = """function profileImage(name:Figure){const c=illustration[name];const svg=`<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" viewBox=\\\"0 0 240 240\\\"><rect width=\\\"240\\\" height=\\\"240\\\" rx=\\\"44\\\" fill=\\\"${c.bg}\\\"/><ellipse cx=\\\"120\\\" cy=\\\"222\\\" rx=\\\"72\\\" ry=\\\"12\\\" fill=\\\"#d7dbe3\\\"/><path d=\\\"M66 220c4-49 28-72 54-72s50 23 54 72\\\" fill=\\\"${c.robe}\\\"/><path d=\\\"M84 164c-10 18-19 31-25 51M156 164c10 18 19 31 25 51\\\" fill=\\\"none\\\" stroke=\\\"${c.robe}\\\" stroke-width=\\\"26\\\" stroke-linecap=\\\"round\\\"/><circle cx=\\\"120\\\" cy=\\\"96\\\" r=\\\"51\\\" fill=\\\"#d6a77a\\\"/><path d=\\\"M70 91c2-44 25-68 51-68 29 0 51 25 49 70-13-16-29-26-50-27-20 0-36 9-50 25z\\\" fill=\\\"${c.hair}\\\"/><path d=\\\"M82 119c9 21 23 31 38 31s29-10 38-31c-9 8-23 13-38 13s-29-5-38-13z\\\" fill=\\\"${c.hair}\\\" opacity=\\\".92\\\"/><circle cx=\\\"101\\\" cy=\\\"96\\\" r=\\\"4\\\" fill=\\\"#26313d\\\"/><circle cx=\\\"139\\\" cy=\\\"96\\\" r=\\\"4\\\" fill=\\\"#26313d\\\"/><path d=\\\"M105 120c9 6 21 6 30 0\\\" fill=\\\"none\\\" stroke=\\\"#7c4a32\\\" stroke-width=\\\"4\\\" stroke-linecap=\\\"round\\\"/><circle cx=\\\"177\\\" cy=\\\"55\\\" r=\\\"28\\\" fill=\\\"white\\\" opacity=\\\".82\\\"/><text x=\\\"177\\\" y=\\\"63\\\" text-anchor=\\\"middle\\\" font-size=\\\"25\\\" font-family=\\\"sans-serif\\\">${c.prop}</text><text x=\\\"120\\\" y=\\\"206\\\" text-anchor=\\\"middle\\\" font-size=\\\"13\\\" font-family=\\\"sans-serif\\\" font-weight=\\\"700\\\" fill=\\\"white\\\">${c.mark}</text></svg>`;return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;}"""

          new = """function FigureIllustration({name,className}:{name:Figure;className:string}){const c=illustration[name];return <svg aria-hidden=\"true\" viewBox=\"0 0 240 240\" className={className} role=\"img\"><rect width=\"240\" height=\"240\" rx=\"44\" fill={c.bg}/><ellipse cx=\"120\" cy=\"222\" rx=\"72\" ry=\"12\" fill=\"#d7dbe3\"/><path d=\"M66 220c4-49 28-72 54-72s50 23 54 72\" fill={c.robe}/><path d=\"M84 164c-10 18-19 31-25 51M156 164c10 18 19 31 25 51\" fill=\"none\" stroke={c.robe} strokeWidth=\"26\" strokeLinecap=\"round\"/><circle cx=\"120\" cy=\"96\" r=\"51\" fill=\"#d6a77a\"/><path d=\"M70 91c2-44 25-68 51-68 29 0 51 25 49 70-13-16-29-26-50-27-20 0-36 9-50 25z\" fill={c.hair}/><path d=\"M82 119c9 21 23 31 38 31s29-10 38-31c-9 8-23 13-38 13s-29-5-38-13z\" fill={c.hair} opacity=\".92\"/><circle cx=\"101\" cy=\"96\" r=\"4\" fill=\"#26313d\"/><circle cx=\"139\" cy=\"96\" r=\"4\" fill=\"#26313d\"/><path d=\"M105 120c9 6 21 6 30 0\" fill=\"none\" stroke=\"#7c4a32\" strokeWidth=\"4\" strokeLinecap=\"round\"/><circle cx=\"177\" cy=\"55\" r=\"28\" fill=\"white\" opacity=\".82\"/><text x=\"177\" y=\"63\" textAnchor=\"middle\" fontSize=\"25\" fontFamily=\"sans-serif\">{c.prop}</text><text x=\"120\" y=\"206\" textAnchor=\"middle\" fontSize=\"13\" fontFamily=\"sans-serif\" fontWeight=\"700\" fill=\"white\">{c.mark}</text></svg>;}"""
          if old not in text:
              raise SystemExit('Expected profileImage implementation was not found')
          text = text.replace(old, new)
          text = text.replace('<img src={profileImage(result.ranked[0])} alt={`${result.ranked[0]} 성경인물 프로필`} className="h-24 w-24 shrink-0 rounded-[22px] border border-background-200 object-cover"/>', '<FigureIllustration name={result.ranked[0]} className="h-24 w-24 shrink-0 rounded-[22px] border border-background-200"/>')
          text = text.replace('<img src={profileImage(f)} alt={`${f} 성경인물 프로필`} className="mx-auto aspect-square w-full rounded-xl object-cover"/>', '<FigureIllustration name={f} className="mx-auto aspect-square w-full rounded-xl"/>')
          text = text.replace('<img src={profileImage(f)} alt={`${f} 성경인물 프로필`} className="aspect-square w-full rounded-xl object-cover"/>', '<FigureIllustration name={f} className="aspect-square w-full rounded-xl"/>')
          path.write_text(text)
          PY
          git diff --check
          grep -q "function FigureIllustration" src/pages/bibleMbtiEnhanced/page.tsx
          ! grep -q "profileImage" src/pages/bibleMbtiEnhanced/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/bibleMbtiEnhanced/page.tsx
          git rm .github/workflows/one-time-fix-bible-mbti-images.yml
          git commit -m "fix: render Bible MBTI figure images inline"
          git push
