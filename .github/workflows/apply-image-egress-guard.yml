name: Apply image egress guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply image egress guard') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply guard changes
        run: python3 ._apply_egress_guard.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --include=dev --cache "/tmp/npm-cache-${{ github.run_id }}"
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Verify site
        run: node scripts/verify-site.mjs
      - name: Commit guard and remove temporary files
        run: |
          rm -f ._apply_egress_guard.py .github/workflows/apply-image-egress-guard.yml .github/workflows/_apply-egress-guard.yml _egress-guard.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase/migrations/20260905220000_harden_public_image_bucket.sql
          git add -u .github/workflows/apply-image-egress-guard.yml .github/workflows/_apply-egress-guard.yml ._apply_egress_guard.py _egress-guard.patch
          git commit -m "chore: apply image egress guard"
          git push
