name: One-time Bible Quiz Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[bible-quiz-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Bible Quiz scoring and difficulty guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/bibleQuiz/page.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace("scorePerQ: 10", "scorePerQ: 20")
          text = text.replace("scorePerQ: 20", "scorePerQ: 50", 1)
          text = text.replace("scorePerQ: 30", "scorePerQ: 80")

          text = text.replace(
              "{ key: 'easy' as const, label: '입문', color:",
              "{ key: 'easy' as const, label: '입문', description: '성경을 처음 배우는 사람', color:"
          )
          text = text.replace(
              "{ key: 'normal' as const, label: '보통', color:",
              "{ key: 'normal' as const, label: '보통', description: '교회 3개월 정도', color:"
          )
          text = text.replace(
              "{ key: 'hard' as const, label: '도전', color:",
              "{ key: 'hard' as const, label: '도전', description: '교회 3년 정도', color:"
          )

          old = """      const pts = q.points || 10;\n      const streakBonus = Math.min(streak, 5) * 2;\n      const timeBonus = Math.max(0, Math.round(timer * 0.5));\n      const finalPts = pts + streakBonus + timeBonus;"""
          new = """      // 난이도별 고정 배점: 입문 20 / 보통 50 / 도전 80\n      const finalPts = q.points;"""
          if old not in text:
              raise SystemExit('Expected scoring block was not found')
          text = text.replace(old, new)

          old = """                      <div className={`text-sm font-bold ${active ? 'text-white' : 'text-foreground-800'}`}>{d.label}</div>\n                      <div className=\"flex items-center gap-0.5\">"""
          new = """                      <div className={`text-left ${active ? 'text-white' : 'text-foreground-800'}`}>\n                        <div className=\"text-sm font-bold\">{d.label}</div>\n                        <div className={`text-[10px] ${active ? 'text-white/75' : 'text-foreground-500'}`}>{d.description}</div>\n                      </div>\n                      <div className=\"flex items-center gap-0.5\">"""
          if old in text:
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-bible-quiz-fix.yml
          git add src/pages/bibleQuiz/page.tsx
          git commit -m "fix: align bible quiz scoring and difficulty guidance [bible-quiz-fix]"
          git push
