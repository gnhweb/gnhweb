name: One-off restore club page behavior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-restore-club-page.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore visual behavior from 9077a2f9
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/clubs/detail/page.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import ClubBannerManager, { useClubBanner } from '@/components/feature/ClubBannerManager';\n",
              ''
          )
          text = text.replace(
              "  const { banner: clubBanner, refresh: refreshBanner } = useClubBanner(id || '');\n",
              ''
          )
          text = text.replace(
              "{club.description}",
              "{(club as ClubData & { shortDescription?: string }).shortDescription}",
              1
          )
          text = text.replace(
              "      <ClubBannerManager club={club.id} onBannerChange={refreshBanner} />\n\n",
              ''
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify expected restoration
        run: |
          grep -q "shortDescription?: string" src/pages/clubs/detail/page.tsx
          ! grep -q "<ClubBannerManager club={club.id}" src/pages/clubs/detail/page.tsx
          ! grep -q "useClubBanner(id || '')" src/pages/clubs/detail/page.tsx

      - name: Remove one-off workflow
        run: rm .github/workflows/one-off-restore-club-page.yml

      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/clubs/detail/page.tsx .github/workflows/one-off-restore-club-page.yml
          git diff --cached --check
          git commit -m 'fix(club): restore previous detail page behavior'
          git push
