name: Apply account recovery login patch

on:
  push:
    branches:
      - account-password-migration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply account recovery login patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: node scripts/account-recovery-login-patch.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- src/pages/login/page.tsx; then
            echo 'Login recovery patch is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/login/page.tsx
          git commit -m 'chore: apply account recovery login patch'
          git push
