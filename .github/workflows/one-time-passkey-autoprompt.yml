name: One-time passkey autoprompt fix

on:
  push:
    paths:
      - .github/workflows/one-time-passkey-autoprompt.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch AppLockScreen
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/feature/AppLockScreen.tsx')
          s = p.read_text(encoding='utf-8')

          old_state = "  const [hasRegisteredBiometric, setHasRegisteredBiometric] = useState(() => isPasskeySupported());\n  const submitInFlightRef = useRef(false);"
          new_state = "  const [hasRegisteredBiometric, setHasRegisteredBiometric] = useState(false);\n  const submitInFlightRef = useRef(false);\n  const autoPasskeyAttemptedRef = useRef(false);"
          if old_state not in s:
              raise SystemExit('state anchor not found')
          s = s.replace(old_state, new_state, 1)

          old_effect = '''  useEffect(() => {\n    let mounted = true;\n    const detectBiometric = async () => {\n      if (!user || !isPasskeySupported()) return;\n      // Keep the button visible immediately on supported devices.\n      setHasRegisteredBiometric(true);\n      try {\n        const { data } = await withTimeout(listPasskeys(), PASSKEY_TIMEOUT_MS);\n        if (mounted && Array.isArray(data) && data.length === 0) {\n          // Keep the button visible: the explicit click will provide the clearest\n          // browser/platform response even when the registration check is unavailable.\n          setHasRegisteredBiometric(true);\n        }\n      } catch {\n        // Keep the biometric button visible and let the explicit user action\n        // determine whether the platform can complete the passkey flow.\n        if (mounted) setHasRegisteredBiometric(true);\n      }\n    };\n    void detectBiometric();\n    return () => { mounted = false; };\n  }, [user?.id]);\n'''
          new_effect = '''  useEffect(() => {\n    let mounted = true;\n    const detectAndAutoUnlock = async () => {\n      if (!user || !isPasskeySupported() || autoPasskeyAttemptedRef.current) return;\n      autoPasskeyAttemptedRef.current = true;\n      try {\n        const { data } = await withTimeout(listPasskeys(), PASSKEY_TIMEOUT_MS);\n        if (!mounted || !Array.isArray(data) || data.length === 0) return;\n        setHasRegisteredBiometric(true);\n        setPasskeyChecking(true);\n        setError('');\n        try {\n          const result = await withTimeout(unlockWithPasskey(), 12000);\n          if (!result && mounted) setError('지문/Face ID 인증을 취소했습니다. PIN을 사용해주세요.');\n        } catch {\n          if (mounted) setError('생체인증을 시작하지 못했습니다. PIN을 사용해주세요.');\n        } finally {\n          if (mounted) setPasskeyChecking(false);\n        }\n      } catch {\n        if (mounted) setHasRegisteredBiometric(false);\n      }\n    };\n    void detectAndAutoUnlock();\n    return () => { mounted = false; };\n  }, [user?.id, unlockWithPasskey]);\n'''
          if old_effect not in s:
              raise SystemExit('biometric effect anchor not found')
          s = s.replace(old_effect, new_effect, 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate
        run: |
          grep -n "autoPasskeyAttemptedRef" src/components/feature/AppLockScreen.tsx
          grep -n "unlockWithPasskey()" src/components/feature/AppLockScreen.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/AppLockScreen.tsx
          git commit -m "fix: auto-prompt registered biometric on app lock"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-passkey-autoprompt.yml
          git commit -m "chore: remove one-time passkey autoprompt workflow"
          git push
