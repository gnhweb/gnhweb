name: Repair Bible MBTI image cache

on:
  push:
    paths:
      - .github/workflows/repair-bible-mbti-cache.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh asset and PWA versions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/pages/bibleMbti/page.tsx': [
                  ('?v=20260909-2', '?v=20260909-4'),
              ],
              'src/pages/bibleMbtiEnhanced/page.tsx': [
                  ('?v=20260909-3', '?v=20260909-4'),
              ],
              'src/pwa.ts': [
                  ("const PWA_VERSION = '20260909-1';", "const PWA_VERSION = '20260909-2';"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'No change made to {filename}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/repair-bible-mbti-cache.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/bibleMbti/page.tsx src/pages/bibleMbtiEnhanced/page.tsx src/pwa.ts .github/workflows/repair-bible-mbti-cache.yml
          git commit -m 'fix: refresh Bible MBTI artwork cache'
          git push origin main
