name: One-time move quote management

on:
  push:
    paths:
      - .github/workflows/one-time-move-quote-manage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Move quote management navigation
        shell: python
        run: |
          from pathlib import Path

          navbar = Path('src/components/feature/Navbar.tsx')
          s = navbar.read_text(encoding='utf-8')
          old = "    { path: '/leadership-diary', label: '리더십 코칭', icon: 'ri-book-read-line' },"
          new = old + "\n    { path: '/teacher-dashboard/quote-manage', label: '어록 관리', icon: 'ri-chat-quote-line' },"
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one leadership mission-tool item in Navbar.tsx')
          if "path: '/teacher-dashboard/quote-manage', label: '어록 관리'" in s:
              raise SystemExit('Quote management item already exists')
          s = s.replace(old, new, 1)
          navbar.write_text(s, encoding='utf-8')

          teacher = Path('src/pages/teacherDashboard/page.tsx')
          s = teacher.read_text(encoding='utf-8')
          old = '<Link to="/teacher-dashboard/quote-manage" className="bg-background-100 border border-background-200 rounded-[20px] p-4 text-center hover:border-primary-300 transition-colors cursor-pointer"><i className="ri-chat-quote-line text-2xl text-primary-500 mb-2 block"></i><span className="text-xs font-semibold text-foreground-700">어록 관리</span></Link>'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one teacher dashboard quote quick-link')
          s = s.replace(old, '', 1)
          teacher.write_text(s, encoding='utf-8')

          navbar_text = navbar.read_text(encoding='utf-8')
          teacher_text = teacher.read_text(encoding='utf-8')
          if navbar_text.count("path: '/teacher-dashboard/quote-manage'") != 1:
              raise SystemExit('Quote management navigation entry count is not 1')
          if 'to="/teacher-dashboard/quote-manage"' in teacher_text:
              raise SystemExit('Teacher dashboard still contains quote management link')

      - name: Verify requested changes
        run: |
          grep -F "{ path: '/teacher-dashboard/quote-manage', label: '어록 관리', icon: 'ri-chat-quote-line' }," src/components/feature/Navbar.tsx
          if grep -F 'to="/teacher-dashboard/quote-manage"' src/pages/teacherDashboard/page.tsx; then exit 1; fi

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/feature/Navbar.tsx src/pages/teacherDashboard/page.tsx
          git commit -m "feat: move quote management to mission tools"
          git rm .github/workflows/one-time-move-quote-manage.yml
          git commit -m "chore: remove one-time quote navigation workflow"
          git push
