name: One-time coaching smoke test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy AI gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e005fccad53297f6ac5ca4d88472cd59
          wranglerVersion: "4"
          workingDirectory: workers/ai-gateway
          command: deploy --config wrangler.jsonc
      - name: Smoke test coaching
        run: |
          set -euo pipefail
          response1=$(curl --fail-with-body --silent --show-error --request POST             --header 'Content-Type: application/json'             --data '{"concern":"동아리 후배에게 역할을 맡겼는데 계속 약속한 일을 미루고 있어요. 저는 대신 해주기 싫지만 관계가 틀어질까 걱정돼요. 어떻게 해야 해요?","tone":"direct"}'             'https://gnhweb-ai-gateway.gemini19840314.workers.dev/nim-coaching')
          printf '%s\n' "$response1"
          ! printf '%s' "$response1" | grep -q 'AI 코칭을 일시적으로 완료하지 못했어'
          response2=$(curl --fail-with-body --silent --show-error --request POST             --header 'Content-Type: application/json'             --data '{"concern":"제가 회의에서 너무 강하게 말해서 후배가 위축된 것 같아요. 그런데 맡은 책임까지 제가 대신해야 하는 건 아닌 것 같아요. 사명자로서 제가 무엇을 고쳐야 하나요?","tone":"empathetic"}'             'https://gnhweb-ai-gateway.gemini19840314.workers.dev/nim-coaching')
          printf '%s\n' "$response2"
          ! printf '%s' "$response2" | grep -q 'AI 코칭을 일시적으로 완료하지 못했어'
      - name: Remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error             --request DELETE             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/contents/.github/workflows/one-time-coaching-smoke.yml"             --data '{"message":"chore: remove one-time coaching smoke test","sha":"$(git rev-parse HEAD:.github/workflows/one-time-coaching-smoke.yml)","branch":"main"}'
