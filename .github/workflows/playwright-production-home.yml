name: Playwright Production Home E2E

on:
  workflow_run:
    workflows: ["Auto Deploy Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-home-e2e
  cancel-in-progress: true

env:
  NODE_ENV: development
  E2E_BASE_URL: https://gnhwebw.pages.dev

jobs:
  home-memory-carousel:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Check actual production reachability
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL")
            echo "attempt=$attempt status=$status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then exit 0; fi
            sleep 10
          done
          echo "Production did not become reachable: $E2E_BASE_URL"
          exit 1

      - name: Run home memory carousel E2E
        env:
          E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
        run: npx playwright test tests/e2e/home-memory-carousel.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-home-memory-carousel-report
          path: playwright-report/
          if-no-files-found: ignore
