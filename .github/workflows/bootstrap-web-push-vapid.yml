name: Bootstrap Web Push VAPID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Generate and store production VAPID keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and store VAPID secrets
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          keys="$(npx --yes web-push generate-vapid-keys --json)"
          public_key="$(printf '%s' "$keys" | jq -r '.publicKey')"
          private_key="$(printf '%s' "$keys" | jq -r '.privateKey')"

          test "${#public_key}" -ge 20
          test "${#private_key}" -ge 20

          printf '%s' "$public_key" | npx --yes wrangler@4 secret put WEB_PUSH_VAPID_PUBLIC_KEY --config wrangler.jsonc
          printf '%s' "$private_key" | npx --yes wrangler@4 secret put WEB_PUSH_VAPID_PRIVATE_KEY --config wrangler.jsonc
          printf '%s' 'https://gnhweb-api.gemini19840314.workers.dev' | npx --yes wrangler@4 secret put WEB_PUSH_VAPID_SUBJECT --config wrangler.jsonc

      - name: Verify public VAPID key endpoint
        run: |
          set -euo pipefail
          response=""
          for attempt in {1..12}; do
            if response="$(curl --silent --show-error --fail-with-body --header "Accept: application/json" "https://gnhweb-api.gemini19840314.workers.dev/web-push-public-key" 2>/tmp/vapid-error)"; then
              printf '%s\n' "$response"
              printf '%s' "$response" | jq -e '.publicKey | type == "string" and length >= 20' >/dev/null
              exit 0
            fi
            cat /tmp/vapid-error || true
            sleep 5
          done
          echo "ERROR: Production API did not expose the VAPID public key."
          exit 1
